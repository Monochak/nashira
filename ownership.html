  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* PROTOTIPO RAMS: blanco-hueso Braun + naranja señal */
      --bg:             oklch(94% 0.010  85);
      --text:           oklch(24% 0.006  85);
      --text-secondary: oklch(32% 0.006  85);
      --muted:          oklch(52% 0.008  85);
      --dim:            oklch(72% 0.008  85);
      --accent:         #ab4e30;
      --border:         oklch(85% 0.008  85);
      --glass-bg:       oklch(97% 0.006  85 / 0.78);
      --glass-border:   oklch(78% 0.010  85 / 0.55);
      --label:          oklch(44% 0.008  85);       /* uppercase labels */
      --panel-border:   oklch(80% 0.010  85 / 0.6); /* panel internal dividers */
      --font-display:   'Big Shoulders Display', 'Arial Black', system-ui, sans-serif;
      --font-body:      'Barlow', system-ui, -apple-system, sans-serif;
      /* Columna editorial derecha — una sola fuente de verdad para el texto de
         presentación, la tarjeta de amenidades y el CTA: los tres comparten
         borde DERECHO y el texto va justificado a la derecha. Cambiar este
         valor los mueve juntos, sin desalinearse. */
      --col-right:      48px;
      --col-width:      min(340px, 38vw);
      /* Columna izquierda (niveles y unidades), en espejo: comparte borde
         IZQUIERDO y su texto va justificado a la izquierda, dejando aire
         entre la lista y la torre. */
      --col-left:       48px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── CANVAS ─────────────────────────────────────────────────────────── */
    #canvas-container {
      position: fixed;
      inset: 0;
      opacity: 0;
      background: var(--bg);
      filter: blur(14px); /* pull de foco (papel): el modelo enfoca al entrar */
      transition: opacity 1.6s ease-out, filter 2.2s ease-out;
    }
    #canvas-container.visible { opacity: 1; filter: blur(0px); }
    /* grafito conserva su revelado por luz; sin desenfoque */
    html[data-theme='grafito'] #canvas-container { filter: none; }

    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── CANVAS DIM (unit panel backdrop) ──────────────────────────────── */
    #canvas-dim {
      position: fixed;
      inset: 0;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
      z-index: 10;
    }

    /* etiquetas de tipología por unidad (vista por nivel) */
    #unit-tags { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    .unit-tag {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: var(--font-body);
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.08em;
      padding: 3px 9px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 100px;
      color: var(--label);
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }
    .unit-tag.on { opacity: 1; }
    .unit-tag.disponible { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 45%, transparent); }
    .unit-tag.vendida { opacity: 0; }
    .unit-tag.vendida.on { opacity: 0.55; }
    #canvas-dim.active {
      opacity: 0.55;
      pointer-events: auto;
      cursor: pointer;
    }

    /* ── LOADING ─────────────────────────────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      transition: opacity 0.65s ease-out, filter 0.65s ease-out;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: no-preference) {
      #loading-overlay {
        transition: opacity 0.70s ease-out, filter 0.70s ease-out, transform 0.70s ease-out;
      }
      #loading-overlay.hidden {
        filter: blur(10px);
        transform: scale(1.03);
        transform-origin: center center;
      }
    }

    /* Content block — centrado en pantalla */
    .lo-content {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 640px;
      padding: 0 24px;
    }

    .lo-label {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--label);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .lo-heading {
      font-family: var(--font-display);
      font-size: clamp(4rem, 8vw, 8rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 0 3px 6px oklch(24% 0.006 85 / 0.18), 0 12px 32px oklch(24% 0.006 85 / 0.14);
    }

    /* Tamaños gobernados desde el panel (100% = estos valores base). */
    .lo-logo {
      display: block;
      max-width: min(70vw, calc(320px * var(--lo-logo-esc, 1)));
      height: auto;
      margin-bottom: 20px;
    }
    @media (prefers-reduced-motion: no-preference) {
      .lo-logo {
        opacity: 0;
        filter: blur(16px);
        animation: lo-emerge 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
      }
    }

    .lo-quote {
      font-size: calc(1.15rem * var(--lo-frase-esc, 1));
      font-weight: 400;
      line-height: 1.6;
      color: oklch(46% 0.008 85);
      letter-spacing: 0.01em;
      max-width: 520px;
      text-wrap: pretty;
    }

    /* Progress line — full-width at bottom edge */
    .lo-bar-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.12s linear;
    }

    /* Default: fully visible (reduced motion / no-JS fallback) */
    .lo-label, .lo-heading, .lo-quote { opacity: 1; }

    /* Animate only when motion is welcome */
    @media (prefers-reduced-motion: no-preference) {
      .lo-label {
        opacity: 0;
        transform: translateY(8px);
        animation: lo-rise   0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
      }
      .lo-heading {
        opacity: 0;
        filter: blur(20px);
        animation: lo-emerge 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
      }
      .lo-quote {
        opacity: 0;
        animation: lo-fade   0.8s ease-out 1.55s forwards;
      }
    }

    @keyframes lo-rise   { to { opacity: 1; transform: translateY(0); } }
    @keyframes lo-emerge { to { opacity: 1; filter: blur(0px); } }
    @keyframes lo-fade   { to { opacity: 1; } }

    /* ── FLOOR LIST (left sidebar) ──────────────────────────────────────── */
    #floor-list {
      position: fixed;
      left: var(--col-left);
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }
    #floor-list.visible { opacity: 1; }

    .floor-item {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      padding: 3px 0;
      user-select: none;
      /* Cascada de entrada: cada item emerge cuando su piso pulsa en la torre */
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    }
    .floor-item.revealed { opacity: 1; transform: translateX(0); }
    /* Durante la cascada: label y dot en ámbar, decaen al color base al soltar la clase */
    .floor-item.cascade-pulse .floor-number { color: var(--accent); }
    .floor-item.cascade-pulse .floor-dot    { background: var(--accent); }

    .floor-number {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.10em;
      color: var(--muted);
      min-width: 22px;
      text-align: left;   /* espejo de la columna derecha: borde izquierdo limpio */
      transition: color 0.2s ease-out;
    }

    .floor-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: oklch(70% 0.008 85);
      flex-shrink: 0;
      transition: background 0.2s ease-out, transform 0.2s ease-out;
    }

    .floor-item:hover .floor-number { color: var(--muted); }
    .floor-item:hover .floor-dot    { background: oklch(58% 0.008 85 / 0.7); }

    .floor-item.has-available .floor-dot { background: oklch(54.8% 0.157 35.7 / 0.4); }

    .floor-item.hover-highlight .floor-number { color: oklch(28% 0.006 85); }
    .floor-item.hover-highlight .floor-dot    { background: oklch(45% 0.008 85 / 0.6); transform: scale(1.3); }

    .floor-item.active .floor-number { color: var(--accent); }
    .floor-item.active .floor-dot    { background: var(--accent); transform: scale(1.8); }

    /* ── UNIT SUB-LIST ───────────────────────────────────────────────────── */
    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      margin: 0;
      transition: max-height 0.35s ease-out, opacity 0.25s ease-out, margin 0.35s ease-out;
    }
    .unit-list.expanded {
      max-height: 400px;
      opacity: 1;
      margin: 4px 0 12px; /* aire entre el submenú y los niveles que siguen */
    }

    .unit-item {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      padding: 2px 0;
      padding-left: 5px;
      user-select: none;
    }
    .unit-item .unit-name {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.10em;
      color: oklch(66% 0.008 85);
      min-width: 22px;
      text-align: left;   /* espejo de la columna derecha */
      transition: color 0.2s ease-out;
    }
    .unit-item .unit-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: oklch(72% 0.008 85);
      flex-shrink: 0;
      transition: background 0.2s ease-out, transform 0.2s ease-out;
    }
    .unit-item.disponible .unit-name { color: oklch(57.6% 0.098 270.8); }
    .unit-item.disponible .unit-dot  { background: oklch(59% 0.098 270.8); }
    .unit-item.apartada .unit-name   { color: oklch(54.8% 0.157 35.7); }
    .unit-item.apartada .unit-dot    { background: oklch(56% 0.157 35.7); }
    .unit-item.disponible:hover .unit-name { color: oklch(50.6% 0.098 270.8); }
    .unit-item.disponible:hover .unit-dot  { background: oklch(52% 0.098 270.8); transform: scale(1.3); }
    .unit-item.apartada:hover .unit-name   { color: oklch(47.8% 0.157 35.7); }
    .unit-item.apartada:hover .unit-dot    { background: oklch(49% 0.157 35.7); transform: scale(1.3); }
    .unit-item.active .unit-name { color: var(--accent); }
    .unit-item.active .unit-dot  { background: var(--accent); transform: scale(1.6); }
    .unit-item.vendida            { cursor: default; }
    .unit-item.vendida .unit-name { color: oklch(72% 0.005 85); }
    .unit-item.vendida .unit-dot  { background: oklch(76% 0.005 85); }
    .unit-item.vendida:hover .unit-name { color: oklch(72% 0.005 85); }
    .unit-item.vendida:hover .unit-dot  { background: oklch(76% 0.005 85); transform: none; }

    /* ── CAT ICONS ───────────────────────────────────────────────────────── */
    .cat-icon {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: oklch(98% 0.005 85);
      border: 2px solid oklch(24% 0.006 85 / 0.85);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease-out, transform 0.15s ease-out;
      z-index: 15;
    }
    .cat-icon.visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }
    .cat-icon.visible:hover {
      transform: translate(-50%, -50%) scale(1.35);
    }

    /* Anillo de pulso */
    .cat-icon::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid oklch(98% 0.005 85 / 0.9);
      opacity: 0;
      animation: cat-pulse 2.4s ease-out infinite;
    }
    @keyframes cat-pulse {
      0%   { transform: scale(1);   opacity: 0.7; }
      60%  { transform: scale(2.2); opacity: 0;   }
      61%  { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(2.2); opacity: 0;   }
    }

    /* ── PANORAMA OVERLAY ────────────────────────────────────────────────── */
    #pano-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: oklch(6% 0.006 250);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }
    #pano-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    #pano-viewer {
      width: 100%;
      height: 100%;
    }

    /* ── Visor unificado: panorámica + galería ──────────────────────────────
       Una sola pieza para "ver el departamento". La 360° va primero, pero su
       arrastre solo toma el control cuando se activa a propósito: mientras
       tanto, deslizar cambia de imagen y no hay ambigüedad de gestos. */
    .visor-slide { position: absolute; inset: 0; }
    /* Con ID: si se ocultara solo por clase, `#slide-foto` le ganaría en
       especificidad y la diapositiva seguiría encima, tapando la 360° y
       quedándose con el arrastre. */
    #slide-pano[hidden], #slide-foto[hidden], #slide-video[hidden] { display: none; }
    #slide-foto { display: flex; align-items: center; justify-content: center; padding: 4vh 6vw 12vh; }
    #visor-img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      border-radius: 4px; opacity: 0; transition: opacity 0.35s ease;
    }
    #visor-img.lista { opacity: 1; }
    /* Paneo de la vista: gira solo, en silencio y sin controles de reproducción.
       La única palanca es cerrar, que vive arriba a la derecha y nunca se esconde. */
    #slide-video { display: flex; align-items: center; justify-content: center; padding: 4vh 6vw 12vh; }
    #visor-video {
      max-width: 100%; max-height: 100%; object-fit: contain;
      border-radius: 4px; opacity: 0; transition: opacity 0.35s ease;
      background: oklch(6% 0.006 250);
    }
    #visor-video.lista { opacity: 1; }
    /* Mientras no se active, una capa transparente se queda con el gesto para
       que deslizar siga cambiando de imagen dentro de la 360°. */
    .visor-activar {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: oklch(6% 0.006 250 / 0.35);
      border: none; cursor: pointer;
      color: oklch(96% 0.005 250);
      font-family: var(--font-body); font-size: 0.6875rem; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      transition: background 0.25s;
    }
    .visor-activar:hover { background: oklch(6% 0.006 250 / 0.2); }
    .visor-activar[hidden] { display: none; }
    .visor-360 {
      display: flex; align-items: center; justify-content: center;
      width: 66px; height: 66px; border-radius: 50%;
      border: 1px solid oklch(100% 0 0 / 0.5);
      font-size: 0.8125rem; letter-spacing: 0.06em;
    }
    .visor-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid oklch(100% 0 0 / 0.2);
      background: oklch(9% 0.008 250 / 0.55);
      backdrop-filter: blur(8px);
      color: oklch(93% 0.005 250);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .visor-nav svg { width: 22px; height: 22px; }
    .visor-nav:hover { background: oklch(16% 0.008 250 / 0.85); }
    .visor-nav[disabled] { opacity: 0.25; pointer-events: none; }
    #visor-prev { left: 22px; }
    #visor-next { right: 22px; }
    #visor-pie {
      position: absolute; left: 0; right: 0; bottom: 30px; z-index: 10;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 0 80px; pointer-events: none;
      color: oklch(88% 0.005 250);
      font-family: var(--font-body); font-size: 0.8125rem; letter-spacing: 0.01em;
      text-shadow: 0 2px 12px oklch(0% 0 0 / 0.8);
      text-wrap: pretty;
    }
    #visor-contador {
      font-size: 0.625rem; font-weight: 600; letter-spacing: 0.14em;
      color: oklch(70% 0.005 250); font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    /* Ficha del nivel: una línea sobre el pie. Son datos al margen — el
       protagonista es la vista —, así que pesan lo menos posible. */
    #visor-franja {
      position: absolute; left: 0; right: 0; bottom: 66px; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 0 13px; padding: 0 80px; pointer-events: none;
      color: oklch(84% 0.005 250);
      font-family: var(--font-body); font-size: 0.75rem; letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px oklch(0% 0 0 / 0.8);
    }
    #visor-franja[hidden] { display: none; }
    #visor-franja b { font-weight: 600; color: oklch(94% 0.005 250); }
    #visor-franja .vf-sep { opacity: 0.4; }
    #visor-franja .vf-disp { color: var(--accent); font-weight: 600; }
    /* Un solo elemento: sin flechas ni contador que estorben */
    #pano-overlay.solo-uno .visor-nav,
    #pano-overlay.solo-uno #visor-contador { display: none; }
    #pano-close {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid oklch(100% 0 0 / 0.2);
      background: oklch(9% 0.008 250 / 0.7);
      backdrop-filter: blur(8px);
      color: oklch(93% 0.005 250);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.15s ease-out;
    }
    #pano-close:hover {
      background: oklch(15% 0.008 250 / 0.9);
      border-color: oklch(100% 0 0 / 0.4);
      transform: scale(1.08);
    }
    #pano-close svg { width: 18px; height: 18px; }
    /* Encabezado del visor: qué se está viendo en conjunto ("Vista desde N10",
       "Vista 360° · Tipo A"). Vivía abajo al centro, exactamente encima del pie
       de foto —dos píxeles de diferencia— y los dos textos se encimaban en
       cuanto una imagen tenía descripción. Es un título, así que va arriba:
       el pie queda solo con lo suyo, la leyenda del medio actual. */
    #pano-label {
      position: absolute;
      top: 30px;
      left: 30px;
      max-width: calc(100% - 130px);   /* libra el botón de cerrar */
      z-index: 10;
      font-family: var(--font-body);
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: oklch(93% 0.005 250 / 0.5);
      pointer-events: none;
    }
    @media (max-width: 767px) {
      #pano-close { top: 16px; right: 16px; }
      /* Con `bottom` heredado y el nuevo `top`, la caja se estiraría de arriba
         abajo. Se reancla al mismo criterio que en escritorio. */
      #pano-label { top: 20px; left: 16px; bottom: auto; max-width: calc(100% - 80px); }
    }

    /* ── INFO HINT ──────────────────────────────────────────────────────────── */
    /* ── INFO BUTTON ─────────────────────────────────────────────────────── */
    #info-btn {
      position: fixed;
      bottom: 36px;
      right: 32px;
      left: auto;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 0 16px 0 12px;
      height: 44px;
      background: oklch(97% 0.006 85 / 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid oklch(20% 0.006 85 / 0.18);
      color: oklch(38% 0.006 85);
      border-radius: 100px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.15s ease-out, opacity 0.3s ease-out;
      opacity: 0;
    }
    /* Escritorio: el CTA cierra la columna editorial — comparte borde DERECHO
       con el texto de presentación y la tarjeta de amenidades. En móvil se queda
       con su margen propio (ahí no hay columna). */
    @media (min-width: 768px) {
      #info-btn {
        right: var(--col-right);
        left: auto;
      }
    }
    #info-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    #info-btn .info-label {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #info-btn.visible { display: flex; }
    #info-btn.shown   { opacity: 1; }
    /* Dentro de la galería el CTA sigue disponible: el visor está en la capa
       100 y el botón en la 20, así que sin esto no se esconde — se lo traga.
       Justo ahí es cuando más se quiere preguntar, viendo el departamento. */
    #info-btn.sobre-visor { z-index: 101; }
    #info-btn.selected {
      color: var(--accent);
      border-color: oklch(54.8% 0.157 35.7 / 0.35);
      background: oklch(97% 0.006 85 / 0.92);
    }
    #info-btn.selected::after {
      border-color: oklch(54.8% 0.157 35.7 / 0.55);
    }
    #info-btn:hover {
      color: oklch(18% 0.006 85);
      border-color: oklch(20% 0.006 85 / 0.4);
      background: oklch(99% 0.004 85 / 0.95);
      transform: scale(1.04);
    }

    #info-btn.selected:hover { color: var(--accent); filter: brightness(1.1); }
    /* Modo unidad: el botón se vuelve el CTA "Hablar con un asesor" (relleno acento, sin ícono). */
    #info-btn.cta {
      background: var(--accent);
      border-color: var(--accent);
      color: oklch(97% 0.01 85);
      padding: 0 20px;
    }
    #info-btn.cta svg { display: none; }
    #info-btn.cta:hover { background: var(--accent); color: oklch(97% 0.01 85); filter: brightness(1.08); transform: scale(1.04); }
    #info-btn.cta::after { border-color: oklch(from var(--accent) l c h / 0.5); }

    /* ── EL CTA COMO ICONO ──────────────────────────────────────────────
       Arranca redondo —solo la diadema— y al acercar el cursor se despliega
       hacia la izquierda con el texto. Devuelve bastante aire a esa esquina,
       que es la más cargada de la pantalla.

       La rejilla de 0fr a 1fr crece hasta el ancho natural del texto sin que
       nadie lo mida: a `auto` no se puede transicionar, y medir en JS se
       rompería al cambiar el texto desde el panel.

       Solo donde hay cursor. En táctil no existe el hover, así que ahí el
       botón sigue entero como hasta hoy — la única llamada a la acción de la
       página no puede depender de un gesto que no se puede hacer.

       Todo va sobre `#info-btn.cta` porque esa clase la lleva SIEMPRE el botón
       y su regla ganaba en especificidad. De paso: esa misma regla escondía el
       icono (`display: none`), así que la pastilla llevaba tiempo siendo solo
       texto — el dibujo que había dentro no se veía desde hace sesiones. */
    @media (hover: hover) and (min-width: 768px) {
      #info-btn.cta { padding: 0; gap: 0; }
      /* 12 + 18 + 12 = 42, más 1 px de borde por lado = 44: el círculo exacto */
      #info-btn.cta svg { display: block; margin: 0 12px; }
      #info-btn.cta .info-label-caja {
        display: grid;
        grid-template-columns: 0fr;
        transition: grid-template-columns 0.38s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #info-btn.cta .info-label {
        overflow: hidden; min-width: 0;
        /* El relleno derecho NO puede ser fijo: aunque el texto mida cero su
           caja lo sigue ocupando, y la pastilla plegada dejaba de ser redonda.
           Se abre junto con el ancho. */
        padding-right: 0;
        opacity: 0;
        transition: opacity 0.2s ease-out,
                    padding-right 0.38s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #info-btn.cta:hover .info-label-caja,
      #info-btn.cta:focus-visible .info-label-caja { grid-template-columns: 1fr; }
      #info-btn.cta:hover .info-label,
      #info-btn.cta:focus-visible .info-label {
        opacity: 1; padding-right: 20px;
        transition-delay: 0.08s, 0s;
      }
      /* El propio despliegue ya es la respuesta al cursor: la escala encima
         sobraba y hacía crecer la pastilla por dos lados a la vez. */
      #info-btn.cta:hover { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #info-btn.cta .info-label-caja, #info-btn.cta .info-label { transition: none; }
    }
    #info-btn::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 100px;
      border: 1.5px solid oklch(40% 0.006 85 / 0.4);
      opacity: 0;
      animation: info-pulse 2.6s ease-out infinite;
    }
    @keyframes info-pulse {
      0%   { transform: scale(1);    opacity: 0.7; }
      70%  { transform: scale(1.08); opacity: 0;   }
      100% { transform: scale(1.08); opacity: 0;   }
    }

    #back-btn {
      position: fixed;
      top: 84px;
      left: var(--col-left);   /* mismo borde que la lista de niveles */
      z-index: 20;
      display: none;
      align-items: center;
      gap: 7px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 100px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #back-btn.visible { display: flex; }
    #back-btn:hover   { color: var(--text); border-color: var(--muted); }
    #back-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .back-arrow {
      font-size: 0.6rem;
      line-height: 1;
      display: inline-block;
      transform: translateY(-0.5px);
    }

    /* ── UNIT HOVER LABEL ────────────────────────────────────────────────── */
    #unit-label {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border-radius: 7px;
      padding: 7px 11px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      transform: translate(14px, -50%);
      transition: opacity 0.12s ease-out;
    }
    #unit-label.visible { opacity: 1; }

    .unit-label-id {
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .unit-label-status {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.10em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .unit-label-status.disponible { color: var(--accent); }

    /* ── UNIT PANEL ──────────────────────────────────────────────────────── */
    #unit-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      height: 100%;
      z-index: 40;
      background: oklch(97% 0.008 85 / 0.78);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border-left: 1px solid oklch(70% 0.010 85 / 0.5);
      transform: translateX(100%);
      transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #unit-panel.open { transform: translateX(0); }

    .panel-header {
      padding: 80px 32px 28px;
      border-bottom: 1px solid oklch(75% 0.010 85 / 0.6); /* header: slightly stronger */
      position: relative;
      flex-shrink: 0;
    }

    #panel-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.875rem;
      line-height: 1;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s;
      padding: 0;
    }
    #panel-close:hover { color: var(--text); border-color: var(--muted); }
    #panel-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .panel-floor-label {
      display: block;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--label);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Info de la unidad sobre la pantalla (fuera del panel) */
    #unit-info {
      position: fixed;
      right: 250px; top: 50%;           /* despejado del rail de navegación (right:20px) */
      transform: translateY(-50%) translateX(14px);
      z-index: 6;                       /* debajo del dim (10): se atenúa con el modelo al abrir el form */
      width: 264px; max-width: 34vw;
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #unit-info.on { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }
    /* Con ID: el `display: flex` de arriba le ganaba a la regla del navegador
       para [hidden], así que ocultarlo no lo ocultaba — solo se desvanecía en
       0.4s, y en ese rato quedaba encima de la información del nivel. */
    #unit-info[hidden] { display: none; }
    .ui-floor { font-size: 0.625rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .ui-name {
      font-family: var(--font-display); font-size: 2.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--text); line-height: 1; margin: 6px 0 20px;
      text-shadow: 0 2px 20px oklch(from var(--bg) l c h / 0.7);
    }
    .ui-stats { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
    .ui-stat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 0.75rem; }
    .ui-stat-l { color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.6875rem; }
    .ui-stat-v { color: var(--text); font-weight: 600; }
    .ui-stat-v.accent { color: var(--accent); }
    .ui-feats {
      display: flex; flex-direction: column; gap: 13px;
      margin-top: 22px; padding-top: 20px;
      border-top: 1px solid var(--panel-border);
    }
    /* Miniatura de la galería: la primera fotografía, como invitación a ver
       por dentro. Sin fotos no aparece, y entonces no hay entrada. */
    .ui-galeria {
      position: relative; margin-top: 20px; padding: 0; border: none;
      border-radius: 8px; overflow: hidden; cursor: pointer;
      background: oklch(from var(--bg) l c h / 0.5);
      aspect-ratio: 16 / 10; width: 100%;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ui-galeria[hidden] { display: none; }
    .ui-galeria img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ui-galeria:hover { transform: scale(1.02); }
    .ui-galeria-pie {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 18px 10px 8px;
      background: linear-gradient(to top, oklch(0% 0 0 / 0.65), transparent);
      color: oklch(97% 0.01 85);
      font-size: 0.625rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .ui-galeria-pie::before { content: 'Ver por dentro'; }

    .unit-feat { display: flex; align-items: center; gap: 12px; }
    .unit-feat-ic {
      flex-shrink: 0;
      width: 26px; height: 26px;
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.22s ease, filter 0.22s ease;
    }
    /* Hover vivo (el icono ya es acento): levantamiento + un punto más de brillo.
       Reacciona la fila completa. */
    .unit-feat:hover .unit-feat-ic {
      transform: translateY(-2px) scale(1.12);
      filter: brightness(1.12);
    }
    .unit-feat-ic svg { width: 100%; height: 100%; }
    .unit-feat-tx {
      font-size: 0.8125rem;
      line-height: 1.35;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .panel-unit-name {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1;
    }

    .panel-body {
      padding: 28px 32px 32px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }





    .panel-note {
      font-size: 0.6875rem;
      color: oklch(44% 0.008 85);
      line-height: 1.65;
      letter-spacing: 0.02em;
    }

    .panel-cta {
      display: block;
      text-align: center;
      padding: 13px 24px;
      background: var(--accent);
      color: var(--bg);
      font-family: var(--font-body);
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .panel-cta:hover { opacity: 0.85; }
    .panel-cta:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ── PANEL STATES ────────────────────────────────────────────────────── */
    .panel-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 24px;
    }
    .panel-section[hidden] { display: none; }
    /* Intro opcional (descripción) sobre la retícula de amenidades */
    /* Amenidades del proyecto: retícula icono-arriba / texto-debajo */
    .amenidades-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 24px 14px; margin: 0 0 22px;
    }
    .amenidad {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 9px;
    }
    .amenidad-ic {
      width: 34px; height: 34px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      transition: color 0.22s ease, transform 0.22s ease;
    }
    /* Hover vivo (no clickeable): tinta → acento + levantamiento sutil.
       La zona de reacción es la celda completa, no solo el icono. */
    .amenidad:hover .amenidad-ic {
      color: var(--accent);
      transform: translateY(-2px) scale(1.12);
    }
    .amenidad-ic svg { width: 100%; height: 100%; }
    .amenidad-tx {
      font-size: 0.75rem; line-height: 1.3; color: var(--text);
      letter-spacing: 0.01em; text-wrap: pretty;
    }
    /* Amenidades como TARJETA siempre visible en torre y nivel (fuera del panel):
       retícula 2 columnas icono-arriba/texto-debajo, anclada abajo-derecha.
       Se oculta al seleccionar unidad; bajo un panel el dim la atenúa. */
    #amenidades {
      position: fixed;
      right: var(--col-right); bottom: 124px;   /* misma columna; arriba del CTA sin encimarse */
      z-index: 6;
      width: var(--col-width);
      padding: 18px 18px 16px;
      background: oklch(from var(--bg) l c h / 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      opacity: 0; pointer-events: none;
      transform: translateX(14px);
      /* sin transición en reposo: ocultarse es INSTANTÁNEO (no se cruza con la
         info de unidad que entra); solo la aparición hace fade */
    }
    #amenidades.on {
      opacity: 1; transform: translateX(0); pointer-events: auto;
      transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #amenidades .amenidades-grid { grid-template-columns: 1fr 1fr 1fr; gap: 15px 10px; margin: 0; }
    #amenidades .amenidad { gap: 7px; }
    #amenidades .amenidad-ic { width: 24px; height: 24px; }
    #amenidades .amenidad-tx { font-size: 0.66rem; line-height: 1.2; }

    /* ── VISTA DEL NIVEL ─────────────────────────────────────────────────────
       Tarjeta en la parte alta de la MISMA columna derecha que amenidades: la
       columna se lee de arriba abajo — vista del nivel, amenidades, CTA. Solo
       aparece en modo nivel; sin material (ni propio ni heredado) no aparece. */
    #nivel-info {
      position: fixed;
      right: var(--col-right); top: 96px;
      z-index: 6;                       /* igual que amenidades: el dim las atenúa juntas */
      width: var(--col-width);
      display: flex; flex-direction: column; align-items: flex-end;
      text-align: right;
      opacity: 0; pointer-events: none;
      transform: translateX(14px);
    }
    #nivel-info.on {
      opacity: 1; transform: translateX(0); pointer-events: auto;
      transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #nivel-info[hidden] { display: none; }
    .ni-eyebrow {
      font-size: 0.625rem; font-weight: 600; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted);
    }
    .ni-name {
      font-family: var(--font-display); font-size: 2.25rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--text); line-height: 1; margin: 6px 0 16px;
      text-shadow: 0 2px 20px oklch(from var(--bg) l c h / 0.7);
    }
    /* Misma invitación que la miniatura de la unidad, para que se aprenda una vez. */
    .ni-vista {
      position: relative; padding: 0; border: none;
      border-radius: 8px; overflow: hidden; cursor: pointer;
      background: oklch(from var(--bg) l c h / 0.5);
      aspect-ratio: 16 / 10; width: 100%;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ni-vista img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ni-vista:hover { transform: scale(1.02); }
    .ni-vista-pie {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 18px 10px 8px;
      background: linear-gradient(to top, oklch(0% 0 0 / 0.65), transparent);
      color: oklch(97% 0.01 85);
      font-size: 0.625rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    }
    /* Cuando la vista es prestada del nivel vecino hay que decirlo, no insinuarlo. */
    .ni-prestada {
      margin-top: 9px;
      font-size: 0.625rem; line-height: 1.35; color: var(--muted);
      letter-spacing: 0.02em;
    }
    .ni-prestada[hidden] { display: none; }


    /* ── CONTACT FORM ────────────────────────────────────────────────────── */
    .panel-back {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }
    .panel-back:hover { color: var(--text); }
    .panel-back:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    #contact-form {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 24px;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--label);
      text-transform: uppercase;
    }

    .form-input {
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 400;
      padding: 9px 0;
      transition: border-color 0.2s;
      -webkit-font-smoothing: antialiased;
    }
    .form-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
      box-shadow: 0 2px 0 -1px oklch(54.8% 0.157 35.7 / 0.25);
    }
    .form-input::placeholder { color: var(--dim); }
    .form-input.error { border-bottom-color: oklch(60% 0.20 25); }

    .form-error {
      font-size: 0.5625rem;
      color: oklch(60% 0.20 25);
      letter-spacing: 0.06em;
      display: none;
    }
    .form-error.visible { display: block; }

    /* ── SUCCESS STATE ───────────────────────────────────────────────────── */
    #panel-success {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }

    .success-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .success-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
      text-transform: uppercase;
    }

    .success-body {
      font-size: 0.6875rem;
      color: var(--muted);
      line-height: 1.65;
      white-space: pre-line;   /* el texto viene de la ficha: sus saltos de línea cuentan */
    }

    /* ── TEMA GRAFITO (Dieter en oscuro: grafito + naranja señal) ────────── */
    html[data-theme='grafito'] {
      --bg:             oklch(18% 0.008 250);
      --text:           oklch(93% 0.005 250);
      --text-secondary: oklch(88% 0.006 250);
      --muted:          oklch(52% 0.01  250);
      --dim:            oklch(34% 0.009 250);
      --border:         oklch(26% 0.01  250);
      --glass-bg:       oklch(22% 0.01  250 / 0.80);
      --glass-border:   oklch(34% 0.012 250 / 0.55);
      --label:          oklch(62% 0.01  250);
      --panel-border:   oklch(28% 0.012 250 / 0.45);
      /* --accent se conserva: naranja señal en ambos temas */
    }
    html[data-theme='grafito'] .floor-dot { background: oklch(38% 0.01 250); }
    html[data-theme='grafito'] .floor-item:hover .floor-dot { background: oklch(48% 0.01 250 / 0.6); }
    html[data-theme='grafito'] .floor-item.has-available .floor-dot { background: oklch(54.8% 0.157 35.7 / 0.35); }
    html[data-theme='grafito'] .floor-item.hover-highlight .floor-number { color: oklch(82% 0.005 250); }
    html[data-theme='grafito'] .floor-item.hover-highlight .floor-dot { background: oklch(60% 0.01 250 / 0.55); }
    html[data-theme='grafito'] .unit-item .unit-name { color: oklch(32% 0.008 250); }
    html[data-theme='grafito'] .unit-item .unit-dot  { background: oklch(34% 0.01 250); }
    html[data-theme='grafito'] .unit-item.disponible .unit-name { color: oklch(60.6% 0.098 270.8); }
    html[data-theme='grafito'] .unit-item.disponible .unit-dot  { background: oklch(58% 0.098 270.8); }
    html[data-theme='grafito'] .unit-item.apartada .unit-name   { color: oklch(62% 0.157 35.7); }
    html[data-theme='grafito'] .unit-item.apartada .unit-dot    { background: oklch(60% 0.157 35.7); }
    html[data-theme='grafito'] .unit-item.disponible:hover .unit-name { color: oklch(68% 0.098 270.8); }
    html[data-theme='grafito'] .unit-item.disponible:hover .unit-dot  { background: oklch(66% 0.098 270.8); }
    html[data-theme='grafito'] .unit-item.apartada:hover .unit-name   { color: oklch(70% 0.157 35.7); }
    html[data-theme='grafito'] .unit-item.apartada:hover .unit-dot    { background: oklch(68% 0.157 35.7); }
    html[data-theme='grafito'] #info-btn {
      background: oklch(14% 0.008 250 / 0.72);
      border-color: oklch(100% 0.005 250 / 0.15);
      color: oklch(80% 0.005 250);
    }
    html[data-theme='grafito'] #info-btn:hover {
      color: oklch(95% 0.004 250);
      border-color: oklch(100% 0.005 250 / 0.3);
      background: oklch(20% 0.008 250 / 0.85);
    }
    html[data-theme='grafito'] #info-btn::after { border-color: oklch(80% 0.005 250 / 0.4); }
    html[data-theme='grafito'] #info-btn.selected {
      color: var(--accent);
      border-color: oklch(54.8% 0.157 35.7 / 0.4);
      background: oklch(14% 0.008 250 / 0.82);
    }
    html[data-theme='grafito'] #unit-panel {
      background: oklch(11% 0.012 250 / 0.65);
      border-left-color: oklch(32% 0.014 250 / 0.45);
    }
    html[data-theme='grafito'] .panel-header { border-bottom-color: oklch(28% 0.012 250 / 0.5); }
    html[data-theme='grafito'] .panel-note { color: oklch(55% 0.009 250); }
    html[data-theme='grafito'] .lo-quote  { color: oklch(52% 0.008 250); }
    html[data-theme='grafito'] .lo-heading {
      text-shadow: 0 3px 6px oklch(0% 0.008 250 / 0.5), 0 12px 32px oklch(0% 0.008 250 / 0.4);
    }

    /* ── REDUCED MOTION ─────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration:  0.01ms !important;
      }
      #canvas-container { transition: none; filter: none; }
      #loading-overlay  { transition: none; }
      #unit-panel       { transition: none; }
      #unit-label       { transition: none; }
    }

    /* ── MOBILE ≤ 767px ─────────────────────────────────────────────────── */
    @media (max-width: 767px) {
      #floor-list {
        left: 14px;
        gap: 4px;
      }

      .lo-content { left: 14px; }

      #back-btn {
        top: 84px;
        left: 14px;
        font-size: 0.5rem;
        padding: 6px 11px;
      }

      #unit-panel {
        width: 100%;
        height: 68%;
        top: auto;
        bottom: 0;
        right: 0;
        transform: translateY(100%);
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
      }
      #unit-panel.open { transform: translateY(0); }

      .panel-header { padding: 28px 24px 20px; }
      #panel-close  { top: 20px; right: 18px; }
    }

    /* ── Presentación guiada (pasos desde la ficha) ─────────────────────── */
    /* Columna derecha unificada: el texto (arriba, sin caja) y la tarjeta de
       amenidades (abajo) comparten ancho y bordes — una sola vertical editorial.
       La torre se reencuadra a la izquierda mientras corre la presentación, así
       que el texto va directo sobre el fondo papel, sin backdrop. El remate a
       84px reserva el canal del rail (iconos hasta ~64px). */
    #prez-overlay {
      position: fixed;
      right: var(--col-right);
      top: 96px;      /* libra la pastilla de navegación superior (20px + alto) */
      transform: none;
      z-index: 30;
      width: var(--col-width);
      pointer-events: none;
      opacity: 0;
      /* ocultarse es instantáneo (al seleccionar unidad no debe cruzarse con la
         info que entra); solo la aparición hace fade */
    }
    #prez-overlay.visible { opacity: 1; transition: opacity 0.4s ease; }
    .prez-text { position: relative; opacity: 0; transition: opacity 0.5s ease; text-align: right; }
    .prez-text.in { opacity: 1; }
    .prez-num {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .prez-kpi {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700; line-height: 1;
      color: var(--text); letter-spacing: -0.01em;
    }
    .prez-caption {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted); margin: 6px 0 12px;
    }
    .prez-body {
      font-size: 0.9rem; line-height: 1.6; color: var(--text);
      letter-spacing: 0.01em; text-wrap: pretty; margin: 0;
      white-space: pre-line;   /* respeta los saltos de párrafo del texto de la ficha */
    }
    .prez-body strong { font-weight: 700; }
    .prez-body em { font-style: italic; }
    #prez-pill {
      position: fixed; bottom: 40px; left: 50%;
      /* Sube unos pixeles al aparecer: llega, no se materializa. El translateX
         del centrado tiene que repetirse aquí o se pierde al animar. */
      transform: translateX(-50%) translateY(10px);
      z-index: 30; display: flex; align-items: center; gap: 4px;
      padding: 6px 8px 10px 14px;   /* el extra abajo aloja el hilo de avance */
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-radius: 100px; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #prez-pill.visible { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }

    /* Hilo de avance: "1 / 11" lo dice en números; esto lo dice de un vistazo,
       y hace que el recorrido se sienta finito — que tiene un final al que se
       llega, no una lista que no se sabe dónde termina. */
    #prez-pill::before, #prez-pill::after {
      content: ''; position: absolute; bottom: 5px; height: 1.5px; border-radius: 2px;
    }
    #prez-pill::before {                       /* riel */
      left: 20px; right: 20px;
      background: oklch(from var(--text) l c h / 0.14);
    }
    #prez-pill::after {                        /* recorrido */
      left: 20px;
      width: calc((100% - 40px) * var(--avance, 0));
      background: var(--accent);
      transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      #prez-pill { transition: opacity 0.4s ease; transform: translateX(-50%); }
      #prez-pill.visible { transform: translateX(-50%); }
      #prez-pill::after { transition: none; }
    }
    #prez-counter {
      font-size: 0.625rem; font-weight: 600; letter-spacing: 0.14em;
      color: var(--muted); min-width: 40px; text-align: center;
      font-variant-numeric: tabular-nums;
    }
    #prez-pill .pill-btn {
      background: none; border: none; cursor: pointer; padding: 5px 10px;
      color: var(--text); opacity: 0.45; transition: opacity 0.2s;
      display: flex; align-items: center; border-radius: 100px;
    }
    #prez-pill .pill-btn:hover { opacity: 1; }
    #prez-pill .pill-btn:disabled { opacity: 0.18; cursor: default; pointer-events: none; }
    #prez-pill .pill-btn svg {
      width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; fill: none; display: block;
    }
    /* El recorrido tiene que poder abandonarse (la ×) y tiene que poder
       terminar: en el último paso la flecha se vuelve la palabra "Explorar",
       que es lo que de verdad hace — suelta la pantalla. */
    .pill-sep {
      width: 1px; height: 15px; margin: 0 3px;
      background: var(--glass-border);
    }
    #prez-next .pill-tx { display: none; }
    #prez-pill.final #prez-next .pill-ic { display: none; }
    #prez-pill.final #prez-next {
      opacity: 1; padding: 5px 12px;
      color: var(--accent);
    }
    #prez-pill.final #prez-next .pill-tx {
      display: block;
      font-size: 0.625rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    #prez-pill .pill-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; opacity: 1; }

    /* El guiño: la presentación arranca sola y el pill aparece sin que nada
       diga que el recorrido se avanza con él. Tres empujoncitos de la flecha
       —el mismo gesto que ya usan los chevrons de emotion, para no inventar
       un lenguaje nuevo— y se calla. Se detiene al primer clic. */
    @keyframes prez-empujon {
      0%   { transform: translateX(0);     }
      35%  { transform: translateX(5px);   }
      65%  { transform: translateX(1.5px); }
      100% { transform: translateX(0);     }
    }
    #prez-pill #prez-next.incita { opacity: 1; }
    #prez-pill #prez-next.incita .pill-ic {
      animation: prez-empujon 0.65s ease-out 3;
    }
    @media (prefers-reduced-motion: reduce) {
      #prez-pill #prez-next.incita .pill-ic { animation: none; }
    }
    #prez-resume {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      z-index: 30;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      color: var(--muted);
      font-family: var(--font-body); font-size: 0.5625rem; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      padding: 8px 16px; border-radius: 100px; cursor: pointer;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease, color 0.2s;
    }
    #prez-resume.visible { opacity: 1; pointer-events: auto; }
    #prez-resume.en-unidad { display: none; }   /* dentro de una unidad no aplica */
    #prez-resume:hover { color: var(--text); }
    #prez-resume:focus-visible, #prez-pill .pill-btn:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 3px;
    }
    @media (max-width: 767px) {
      #prez-overlay {
        left: 16px; right: 16px; top: auto;
        bottom: calc(126px + env(safe-area-inset-bottom));
        transform: none; width: auto;
      }
      .prez-kpi { font-size: 2.5rem; }
      .prez-body { font-size: 1.05rem; }
      #prez-pill, #prez-resume { bottom: calc(76px + env(safe-area-inset-bottom)); }
      /* En móvil no hay espacio para la tarjeta de amenidades sin tapar el modelo */
      #amenidades { display: none; }
    }
  </style>
</head>
<body>

  <!-- ── LOADING ─────────────────────────────────────────────────────────── -->
  <div id="loading-overlay">
    <div class="lo-content">
      <span class="lo-label" data-site="pages.ownership.copy.loadingEyebrow">Torre Nashira · Nivel 10</span>
      <img class="lo-logo" alt="" hidden>
      <span class="lo-heading" data-site="pages.ownership.copy.loadingHeading">Ownership</span>
      <p class="lo-quote" lang="en" data-site="pages.ownership.copy.loadingQuote">The door handle is the handshake of the building.</p>
    </div>
    <div class="lo-bar-track">
      <div id="loading-bar"></div>
    </div>
  </div>

  <!-- ── CANVAS ──────────────────────────────────────────────────────────── -->
  <div id="canvas-container">
    <canvas id="three-canvas" role="img" aria-label="Visualizador 3D interactivo de la torre FORMA — selecciona un nivel para explorar las unidades disponibles"></canvas>
  </div>

  <!-- ── CANVAS DIM ──────────────────────────────────────────────────────── -->

  <!-- ── ETIQUETAS DE TIPOLOGÍA (vista por nivel) ────────────────────────── -->

  <div id="nivel-info" hidden>
    <span class="ni-eyebrow" id="ni-eyebrow"></span>

    <button class="ni-vista" id="ni-vista">
      <img id="ni-vista-img" alt="">
      <span class="ni-vista-pie"><span id="ni-vista-cta">Ver la vista</span><span id="ni-vista-n"></span></span>
    </button>
    <span class="ni-prestada" id="ni-prestada" hidden></span>

  <!-- ── BACK BUTTON ─────────────────────────────────────────────────────── -->

    <span class="back-arrow">&#8592;</span> <span data-site="pages.ownership.copy.backButton">Torre</span>
  </button>

  <!-- ── INFO BUTTON ───────────────────────────────────────────────────────── -->
  <!-- El icono era la "i" del botón INFO que se retiró: decía "información"
       donde el botón ya decía "hablar con alguien". Ahora es una diadema. -->
  <button id="info-btn" aria-label="Hablar con un asesor">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 14v-2a8 8 0 0 1 16 0v2"/>
      <rect x="2" y="13" width="4.6" height="6.4" rx="2.3"/>
      <rect x="17.4" y="13" width="4.6" height="6.4" rx="2.3"/>
      <path d="M19.7 19.4v.4a2.6 2.6 0 0 1-2.6 2.6H13.4"/>

    <span class="info-label-caja"><span class="info-label" data-site="pages.ownership.copy.cta">Hablar con un asesor</span></span>

  <!-- ── UNIT HOVER LABEL ────────────────────────────────────────────────── -->

  <!-- ── UNIT PANEL (solo formulario de contacto) ────────────────────────── -->

      <button id="panel-close" aria-label="Cerrar panel">&#215;</button>
      <span class="panel-floor-label" id="panel-floor-label"></span>

Un asesor te contactará en breve.</p>

    </div>
