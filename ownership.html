<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#24262b">
  <link rel="apple-touch-icon" href="content/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nashira">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Nashira · Ownership</title>
  <meta name="description" content="Nashira. Explora la torre en 3D y descubre las unidades disponibles.">
  <link rel="icon" type="image/svg+xml" href="content/brand/favicon.svg">
  <!-- Ficha del proyecto — SIEMPRE el primer script (los motores leen window.SITE) -->
  <script src="site.js?v=0d6e79f5"></script>
  <script src="theme.js?v=a45adf14"></script>
  <script src="backend.js?v=105737ee"></script>
  <!-- OG: reemplazar og:image con URL absoluta al definir el dominio de producción -->
  <meta property="og:title" content="Nashira · Ownership">
  <meta property="og:description" content="Nashira. Explora la torre en 3D y descubre las unidades disponibles.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="content/images/sequence/frame_000.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* PROTOTIPO RAMS: blanco-hueso Braun + naranja señal */
      --bg:             oklch(94% 0.010  85);
      --text:           oklch(24% 0.006  85);
      --text-secondary: oklch(32% 0.006  85);
      --muted:          oklch(52% 0.008  85);
      --dim:            oklch(72% 0.008  85);
      --accent:         #ab4e30;
      --border:         oklch(85% 0.008  85);
      --glass-bg:       oklch(97% 0.006  85 / 0.78);
      --glass-border:   oklch(78% 0.010  85 / 0.55);
      --label:          oklch(44% 0.008  85);       /* uppercase labels */
      --panel-border:   oklch(80% 0.010  85 / 0.6); /* panel internal dividers */
      --font-display:   'Big Shoulders Display', 'Arial Black', system-ui, sans-serif;
      --font-body:      'Barlow', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── CANVAS ─────────────────────────────────────────────────────────── */
    #canvas-container {
      position: fixed;
      inset: 0;
      opacity: 0;
      background: var(--bg);
      filter: blur(14px); /* pull de foco (papel): el modelo enfoca al entrar */
      transition: opacity 1.6s ease-out, filter 2.2s ease-out;
    }
    #canvas-container.visible { opacity: 1; filter: blur(0px); }
    /* grafito conserva su revelado por luz; sin desenfoque */
    html[data-theme='grafito'] #canvas-container { filter: none; }

    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── CANVAS DIM (unit panel backdrop) ──────────────────────────────── */
    #canvas-dim {
      position: fixed;
      inset: 0;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
      z-index: 10;
    }

    /* etiquetas de tipología por unidad (vista por nivel) */
    #unit-tags { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    .unit-tag {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: var(--font-body);
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.08em;
      padding: 3px 9px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 100px;
      color: var(--label);
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }
    .unit-tag.on { opacity: 1; }
    .unit-tag.disponible { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 45%, transparent); }
    .unit-tag.vendida { opacity: 0; }
    .unit-tag.vendida.on { opacity: 0.55; }
    #canvas-dim.active {
      opacity: 0.55;
      pointer-events: auto;
      cursor: pointer;
    }

    /* ── LOADING ─────────────────────────────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      transition: opacity 0.65s ease-out, filter 0.65s ease-out;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: no-preference) {
      #loading-overlay {
        transition: opacity 0.70s ease-out, filter 0.70s ease-out, transform 0.70s ease-out;
      }
      #loading-overlay.hidden {
        filter: blur(10px);
        transform: scale(1.03);
        transform-origin: center center;
      }
    }

    /* Content block — centrado en pantalla */
    .lo-content {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 640px;
      padding: 0 24px;
    }

    .lo-label {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--label);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .lo-heading {
      font-family: var(--font-display);
      font-size: clamp(4rem, 8vw, 8rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 0 3px 6px oklch(24% 0.006 85 / 0.18), 0 12px 32px oklch(24% 0.006 85 / 0.14);
    }

    .lo-logo {
      display: block;
      max-width: min(70vw, 380px);
      height: auto;
      margin-bottom: 20px;
    }
    @media (prefers-reduced-motion: no-preference) {
      .lo-logo {
        opacity: 0;
        filter: blur(16px);
        animation: lo-emerge 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
      }
    }

    .lo-quote {
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.65;
      color: oklch(46% 0.008 85);
      letter-spacing: 0.01em;
      max-width: 440px;
    }

    /* Progress line — full-width at bottom edge */
    .lo-bar-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.12s linear;
    }

    /* Default: fully visible (reduced motion / no-JS fallback) */
    .lo-label, .lo-heading, .lo-quote { opacity: 1; }

    /* Animate only when motion is welcome */
    @media (prefers-reduced-motion: no-preference) {
      .lo-label {
        opacity: 0;
        transform: translateY(8px);
        animation: lo-rise   0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
      }
      .lo-heading {
        opacity: 0;
        filter: blur(20px);
        animation: lo-emerge 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
      }
      .lo-quote {
        opacity: 0;
        animation: lo-fade   0.8s ease-out 1.55s forwards;
      }
    }

    @keyframes lo-rise   { to { opacity: 1; transform: translateY(0); } }
    @keyframes lo-emerge { to { opacity: 1; filter: blur(0px); } }
    @keyframes lo-fade   { to { opacity: 1; } }

    /* ── FLOOR LIST (left sidebar) ──────────────────────────────────────── */
    #floor-list {
      position: fixed;
      left: 256px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }
    #floor-list.visible { opacity: 1; }

    .floor-item {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      padding: 3px 0;
      user-select: none;
      /* Cascada de entrada: cada item emerge cuando su piso pulsa en la torre */
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    }
    .floor-item.revealed { opacity: 1; transform: translateX(0); }
    /* Durante la cascada: label y dot en ámbar, decaen al color base al soltar la clase */
    .floor-item.cascade-pulse .floor-number { color: var(--accent); }
    .floor-item.cascade-pulse .floor-dot    { background: var(--accent); }

    .floor-number {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.10em;
      color: var(--muted);
      min-width: 22px;
      text-align: right;
      transition: color 0.2s ease-out;
    }

    .floor-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: oklch(70% 0.008 85);
      flex-shrink: 0;
      transition: background 0.2s ease-out, transform 0.2s ease-out;
    }

    .floor-item:hover .floor-number { color: var(--muted); }
    .floor-item:hover .floor-dot    { background: oklch(58% 0.008 85 / 0.7); }

    .floor-item.has-available .floor-dot { background: oklch(54.8% 0.157 35.7 / 0.4); }

    .floor-item.hover-highlight .floor-number { color: oklch(28% 0.006 85); }
    .floor-item.hover-highlight .floor-dot    { background: oklch(45% 0.008 85 / 0.6); transform: scale(1.3); }

    .floor-item.active .floor-number { color: var(--accent); }
    .floor-item.active .floor-dot    { background: var(--accent); transform: scale(1.8); }

    /* ── UNIT SUB-LIST ───────────────────────────────────────────────────── */
    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      margin: 0;
      transition: max-height 0.35s ease-out, opacity 0.25s ease-out, margin 0.35s ease-out;
    }
    .unit-list.expanded {
      max-height: 400px;
      opacity: 1;
      margin: 4px 0 12px; /* aire entre el submenú y los niveles que siguen */
    }

    .unit-item {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      padding: 2px 0;
      padding-left: 5px;
      user-select: none;
    }
    .unit-item .unit-name {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.10em;
      color: oklch(66% 0.008 85);
      min-width: 22px;
      text-align: right;
      transition: color 0.2s ease-out;
    }
    .unit-item .unit-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: oklch(72% 0.008 85);
      flex-shrink: 0;
      transition: background 0.2s ease-out, transform 0.2s ease-out;
    }
    .unit-item.disponible .unit-name { color: oklch(57.6% 0.098 270.8); }
    .unit-item.disponible .unit-dot  { background: oklch(59% 0.098 270.8); }
    .unit-item.apartada .unit-name   { color: oklch(54.8% 0.157 35.7); }
    .unit-item.apartada .unit-dot    { background: oklch(56% 0.157 35.7); }
    .unit-item.disponible:hover .unit-name { color: oklch(50.6% 0.098 270.8); }
    .unit-item.disponible:hover .unit-dot  { background: oklch(52% 0.098 270.8); transform: scale(1.3); }
    .unit-item.apartada:hover .unit-name   { color: oklch(47.8% 0.157 35.7); }
    .unit-item.apartada:hover .unit-dot    { background: oklch(49% 0.157 35.7); transform: scale(1.3); }
    .unit-item.active .unit-name { color: var(--accent); }
    .unit-item.active .unit-dot  { background: var(--accent); transform: scale(1.6); }
    .unit-item.vendida            { cursor: default; }
    .unit-item.vendida .unit-name { color: oklch(72% 0.005 85); }
    .unit-item.vendida .unit-dot  { background: oklch(76% 0.005 85); }
    .unit-item.vendida:hover .unit-name { color: oklch(72% 0.005 85); }
    .unit-item.vendida:hover .unit-dot  { background: oklch(76% 0.005 85); transform: none; }

    /* ── CAT ICONS ───────────────────────────────────────────────────────── */
    .cat-icon {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: oklch(98% 0.005 85);
      border: 2px solid oklch(24% 0.006 85 / 0.85);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease-out, transform 0.15s ease-out;
      z-index: 15;
    }
    .cat-icon.visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }
    .cat-icon.visible:hover {
      transform: translate(-50%, -50%) scale(1.35);
    }

    /* Anillo de pulso */
    .cat-icon::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid oklch(98% 0.005 85 / 0.9);
      opacity: 0;
      animation: cat-pulse 2.4s ease-out infinite;
    }
    @keyframes cat-pulse {
      0%   { transform: scale(1);   opacity: 0.7; }
      60%  { transform: scale(2.2); opacity: 0;   }
      61%  { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(2.2); opacity: 0;   }
    }

    /* ── PANORAMA OVERLAY ────────────────────────────────────────────────── */
    #pano-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: oklch(6% 0.006 250);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }
    #pano-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    #pano-viewer {
      width: 100%;
      height: 100%;
    }
    #pano-close {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid oklch(100% 0 0 / 0.2);
      background: oklch(9% 0.008 250 / 0.7);
      backdrop-filter: blur(8px);
      color: oklch(93% 0.005 250);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.15s ease-out;
    }
    #pano-close:hover {
      background: oklch(15% 0.008 250 / 0.9);
      border-color: oklch(100% 0 0 / 0.4);
      transform: scale(1.08);
    }
    #pano-close svg { width: 18px; height: 18px; }
    #pano-label {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: var(--font-body);
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: oklch(93% 0.005 250 / 0.5);
      pointer-events: none;
    }
    @media (max-width: 767px) {
      #pano-close { top: 16px; right: 16px; }
      #pano-label { bottom: calc(20px + env(safe-area-inset-bottom)); }
    }

    /* ── INFO HINT ──────────────────────────────────────────────────────────── */
    /* ── INFO BUTTON ─────────────────────────────────────────────────────── */
    #info-btn {
      position: fixed;
      bottom: 36px;
      right: 32px;
      left: auto;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 0 16px 0 12px;
      height: 44px;
      background: oklch(97% 0.006 85 / 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid oklch(20% 0.006 85 / 0.18);
      color: oklch(38% 0.006 85);
      border-radius: 100px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.15s ease-out, opacity 0.3s ease-out;
      opacity: 0;
    }
    #info-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    #info-btn .info-label {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #info-btn.visible { display: flex; }
    #info-btn.shown   { opacity: 1; }
    #info-btn.selected {
      color: var(--accent);
      border-color: oklch(54.8% 0.157 35.7 / 0.35);
      background: oklch(97% 0.006 85 / 0.92);
    }
    #info-btn.selected::after {
      border-color: oklch(54.8% 0.157 35.7 / 0.55);
    }
    #info-btn:hover {
      color: oklch(18% 0.006 85);
      border-color: oklch(20% 0.006 85 / 0.4);
      background: oklch(99% 0.004 85 / 0.95);
      transform: scale(1.04);
    }
    #info-btn.selected:hover { color: var(--accent); filter: brightness(1.1); }
    /* Modo unidad: el botón se vuelve el CTA "Hablar con un asesor" (relleno acento, sin ícono). */
    #info-btn.cta {
      background: var(--accent);
      border-color: var(--accent);
      color: oklch(97% 0.01 85);
      padding: 0 20px;
    }
    #info-btn.cta svg { display: none; }
    #info-btn.cta:hover { background: var(--accent); color: oklch(97% 0.01 85); filter: brightness(1.08); transform: scale(1.04); }
    #info-btn.cta::after { border-color: oklch(from var(--accent) l c h / 0.5); }
    #info-btn::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 100px;
      border: 1.5px solid oklch(40% 0.006 85 / 0.4);
      opacity: 0;
      animation: info-pulse 2.6s ease-out infinite;
    }
    @keyframes info-pulse {
      0%   { transform: scale(1);    opacity: 0.7; }
      70%  { transform: scale(1.08); opacity: 0;   }
      100% { transform: scale(1.08); opacity: 0;   }
    }

    #back-btn {
      position: fixed;
      top: 84px;
      left: 32px;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 7px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 100px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #back-btn.visible { display: flex; }
    #back-btn:hover   { color: var(--text); border-color: var(--muted); }
    #back-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .back-arrow {
      font-size: 0.6rem;
      line-height: 1;
      display: inline-block;
      transform: translateY(-0.5px);
    }

    /* ── UNIT HOVER LABEL ────────────────────────────────────────────────── */
    #unit-label {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border-radius: 7px;
      padding: 7px 11px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      transform: translate(14px, -50%);
      transition: opacity 0.12s ease-out;
    }
    #unit-label.visible { opacity: 1; }

    .unit-label-id {
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .unit-label-status {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.10em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .unit-label-status.disponible { color: var(--accent); }

    /* ── UNIT PANEL ──────────────────────────────────────────────────────── */
    #unit-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      height: 100%;
      z-index: 40;
      background: oklch(97% 0.008 85 / 0.78);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border-left: 1px solid oklch(70% 0.010 85 / 0.5);
      transform: translateX(100%);
      transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #unit-panel.open { transform: translateX(0); }

    .panel-header {
      padding: 80px 32px 28px;
      border-bottom: 1px solid oklch(75% 0.010 85 / 0.6); /* header: slightly stronger */
      position: relative;
      flex-shrink: 0;
    }

    #panel-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.875rem;
      line-height: 1;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s;
      padding: 0;
    }
    #panel-close:hover { color: var(--text); border-color: var(--muted); }
    #panel-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .panel-floor-label {
      display: block;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--label);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Info de la unidad sobre la pantalla (fuera del panel) */
    #unit-info {
      position: fixed;
      right: 250px; top: 50%;           /* despejado del rail de navegación (right:20px) */
      transform: translateY(-50%) translateX(14px);
      z-index: 6;                       /* debajo del dim (10): se atenúa con el modelo al abrir el form */
      width: 264px; max-width: 34vw;
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #unit-info.on { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }
    .ui-floor { font-size: 0.625rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .ui-name {
      font-family: var(--font-display); font-size: 2.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--text); line-height: 1; margin: 6px 0 20px;
      text-shadow: 0 2px 20px oklch(from var(--bg) l c h / 0.7);
    }
    .ui-stats { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
    .ui-stat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 0.75rem; }
    .ui-stat-l { color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.6875rem; }
    .ui-stat-v { color: var(--text); font-weight: 600; }
    .ui-stat-v.accent { color: var(--accent); }
    .ui-feats {
      display: flex; flex-direction: column; gap: 13px;
      margin-top: 22px; padding-top: 20px;
      border-top: 1px solid var(--panel-border);
    }

    .panel-features {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 22px 0 26px;
      padding-top: 22px;
      border-top: 1px solid var(--panel-border);
    }
    .unit-feat { display: flex; align-items: center; gap: 12px; }
    .unit-feat-ic {
      flex-shrink: 0;
      width: 26px; height: 26px;
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    .unit-feat-ic svg { width: 100%; height: 100%; }
    .unit-feat-tx {
      font-size: 0.8125rem;
      line-height: 1.35;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .panel-unit-name {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1;
    }
    /* Logo del proyecto en el header del panel de info (domina sobre el texto) */
    .panel-proyecto-logo {
      display: block;
      max-width: 100%;
      max-height: 76px;
      width: auto;
      height: auto;
    }

    .panel-body {
      padding: 28px 32px 32px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .panel-stats { display: flex; flex-direction: column; }

    .panel-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--panel-border);
    }
    .panel-stat:first-child { border-top: 1px solid var(--panel-border); }

    .stat-label {
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--label);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .stat-value.accent { color: var(--accent); }

    .panel-note {
      font-size: 0.6875rem;
      color: oklch(44% 0.008 85);
      line-height: 1.65;
      letter-spacing: 0.02em;
    }

    .panel-cta {
      display: block;
      text-align: center;
      padding: 13px 24px;
      background: var(--accent);
      color: var(--bg);
      font-family: var(--font-body);
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .panel-cta:hover { opacity: 0.85; }
    .panel-cta:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ── PANEL STATES ────────────────────────────────────────────────────── */
    .panel-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 24px;
    }
    .panel-section[hidden] { display: none; }
    .panel-proyecto-body {
      font-size: 0.95rem; line-height: 1.7; color: var(--text);
      letter-spacing: 0.01em; text-wrap: pretty; margin: 0 0 22px;
      white-space: pre-line;   /* respeta saltos de párrafo del texto de la ficha */
    }
    .panel-proyecto-body strong { font-weight: 700; }
    .panel-proyecto-body em { font-style: italic; }
    /* Intro opcional (descripción) sobre la retícula de amenidades */
    .panel-proyecto-intro {
      font-size: 0.95rem; line-height: 1.7; color: var(--text);
      letter-spacing: 0.01em; text-wrap: pretty; margin: 0 0 22px;
      white-space: pre-line;
    }
    .panel-proyecto-intro strong { font-weight: 700; }
    .panel-proyecto-intro em { font-style: italic; }
    /* Amenidades del proyecto: retícula icono-arriba / texto-debajo */
    .amenidades-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 24px 14px; margin: 0 0 22px;
    }
    .amenidad {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 9px;
    }
    .amenidad-ic {
      width: 34px; height: 34px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
    }
    .amenidad-ic svg { width: 100%; height: 100%; }
    .amenidad-tx {
      font-size: 0.75rem; line-height: 1.3; color: var(--text);
      letter-spacing: 0.01em; text-wrap: pretty;
    }
    /* Amenidades como TARJETA siempre visible en torre y nivel (fuera del panel):
       retícula 2 columnas icono-arriba/texto-debajo, anclada abajo-derecha.
       Se oculta al seleccionar unidad; bajo un panel el dim la atenúa. */
    #amenidades {
      position: fixed;
      right: 48px; bottom: 74px;         /* despejado del rail (right:20px) y de los controles de abajo */
      z-index: 6;
      width: 316px; max-width: 40vw;
      padding: 18px 18px 16px;
      background: oklch(from var(--bg) l c h / 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      opacity: 0; pointer-events: none;
      transform: translateX(14px);
      transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #amenidades.on { opacity: 1; transform: translateX(0); pointer-events: auto; }
    #amenidades .amenidades-grid { grid-template-columns: 1fr 1fr 1fr; gap: 15px 10px; margin: 0; }
    #amenidades .amenidad { gap: 7px; }
    #amenidades .amenidad-ic { width: 24px; height: 24px; }
    #amenidades .amenidad-tx { font-size: 0.66rem; line-height: 1.2; }

    #panel-detail { justify-content: space-between; }

    /* ── CONTACT FORM ────────────────────────────────────────────────────── */
    .panel-back {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }
    .panel-back:hover { color: var(--text); }
    .panel-back:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    #contact-form {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 24px;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--label);
      text-transform: uppercase;
    }

    .form-input {
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 400;
      padding: 9px 0;
      transition: border-color 0.2s;
      -webkit-font-smoothing: antialiased;
    }
    .form-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
      box-shadow: 0 2px 0 -1px oklch(54.8% 0.157 35.7 / 0.25);
    }
    .form-input::placeholder { color: var(--dim); }
    .form-input.error { border-bottom-color: oklch(60% 0.20 25); }

    .form-error {
      font-size: 0.5625rem;
      color: oklch(60% 0.20 25);
      letter-spacing: 0.06em;
      display: none;
    }
    .form-error.visible { display: block; }

    /* ── SUCCESS STATE ───────────────────────────────────────────────────── */
    #panel-success {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }

    .success-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .success-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
      text-transform: uppercase;
    }

    .success-body {
      font-size: 0.6875rem;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── TEMA GRAFITO (Dieter en oscuro: grafito + naranja señal) ────────── */
    html[data-theme='grafito'] {
      --bg:             oklch(18% 0.008 250);
      --text:           oklch(93% 0.005 250);
      --text-secondary: oklch(88% 0.006 250);
      --muted:          oklch(52% 0.01  250);
      --dim:            oklch(34% 0.009 250);
      --border:         oklch(26% 0.01  250);
      --glass-bg:       oklch(22% 0.01  250 / 0.80);
      --glass-border:   oklch(34% 0.012 250 / 0.55);
      --label:          oklch(62% 0.01  250);
      --panel-border:   oklch(28% 0.012 250 / 0.45);
      /* --accent se conserva: naranja señal en ambos temas */
    }
    html[data-theme='grafito'] .floor-dot { background: oklch(38% 0.01 250); }
    html[data-theme='grafito'] .floor-item:hover .floor-dot { background: oklch(48% 0.01 250 / 0.6); }
    html[data-theme='grafito'] .floor-item.has-available .floor-dot { background: oklch(54.8% 0.157 35.7 / 0.35); }
    html[data-theme='grafito'] .floor-item.hover-highlight .floor-number { color: oklch(82% 0.005 250); }
    html[data-theme='grafito'] .floor-item.hover-highlight .floor-dot { background: oklch(60% 0.01 250 / 0.55); }
    html[data-theme='grafito'] .unit-item .unit-name { color: oklch(32% 0.008 250); }
    html[data-theme='grafito'] .unit-item .unit-dot  { background: oklch(34% 0.01 250); }
    html[data-theme='grafito'] .unit-item.disponible .unit-name { color: oklch(60.6% 0.098 270.8); }
    html[data-theme='grafito'] .unit-item.disponible .unit-dot  { background: oklch(58% 0.098 270.8); }
    html[data-theme='grafito'] .unit-item.apartada .unit-name   { color: oklch(62% 0.157 35.7); }
    html[data-theme='grafito'] .unit-item.apartada .unit-dot    { background: oklch(60% 0.157 35.7); }
    html[data-theme='grafito'] .unit-item.disponible:hover .unit-name { color: oklch(68% 0.098 270.8); }
    html[data-theme='grafito'] .unit-item.disponible:hover .unit-dot  { background: oklch(66% 0.098 270.8); }
    html[data-theme='grafito'] .unit-item.apartada:hover .unit-name   { color: oklch(70% 0.157 35.7); }
    html[data-theme='grafito'] .unit-item.apartada:hover .unit-dot    { background: oklch(68% 0.157 35.7); }
    html[data-theme='grafito'] #info-btn {
      background: oklch(14% 0.008 250 / 0.72);
      border-color: oklch(100% 0.005 250 / 0.15);
      color: oklch(80% 0.005 250);
    }
    html[data-theme='grafito'] #info-btn:hover {
      color: oklch(95% 0.004 250);
      border-color: oklch(100% 0.005 250 / 0.3);
      background: oklch(20% 0.008 250 / 0.85);
    }
    html[data-theme='grafito'] #info-btn::after { border-color: oklch(80% 0.005 250 / 0.4); }
    html[data-theme='grafito'] #info-btn.selected {
      color: var(--accent);
      border-color: oklch(54.8% 0.157 35.7 / 0.4);
      background: oklch(14% 0.008 250 / 0.82);
    }
    html[data-theme='grafito'] #unit-panel {
      background: oklch(11% 0.012 250 / 0.65);
      border-left-color: oklch(32% 0.014 250 / 0.45);
    }
    html[data-theme='grafito'] .panel-header { border-bottom-color: oklch(28% 0.012 250 / 0.5); }
    html[data-theme='grafito'] .panel-note { color: oklch(55% 0.009 250); }
    html[data-theme='grafito'] .lo-quote  { color: oklch(52% 0.008 250); }
    html[data-theme='grafito'] .lo-heading {
      text-shadow: 0 3px 6px oklch(0% 0.008 250 / 0.5), 0 12px 32px oklch(0% 0.008 250 / 0.4);
    }

    /* ── REDUCED MOTION ─────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration:  0.01ms !important;
      }
      #canvas-container { transition: none; filter: none; }
      #loading-overlay  { transition: none; }
      #unit-panel       { transition: none; }
      #unit-label       { transition: none; }
    }

    /* ── MOBILE ≤ 767px ─────────────────────────────────────────────────── */
    @media (max-width: 767px) {
      #floor-list {
        left: 14px;
        gap: 4px;
      }

      .lo-content { left: 14px; }

      #back-btn {
        top: 84px;
        left: 14px;
        font-size: 0.5rem;
        padding: 6px 11px;
      }

      #unit-panel {
        width: 100%;
        height: 68%;
        top: auto;
        bottom: 0;
        right: 0;
        transform: translateY(100%);
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
      }
      #unit-panel.open { transform: translateY(0); }

      .panel-header { padding: 28px 24px 20px; }
      #panel-close  { top: 20px; right: 18px; }
    }

    /* ── Presentación guiada (pasos desde la ficha) ─────────────────────── */
    #prez-overlay {
      position: fixed;
      right: 74px;    /* su backdrop (-26px) remata en 48px = borde de la tarjeta de amenidades */
      top: 92px;      /* arriba-derecha: el texto va ARRIBA de las amenidades, sin encimarse */
      transform: none;
      z-index: 30;
      width: min(400px, 34vw);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #prez-overlay.visible { opacity: 1; }
    .prez-text { position: relative; opacity: 0; transition: opacity 0.5s ease; }
    .prez-text.in { opacity: 1; }
    .prez-text::before {
      content: '';
      position: absolute;
      inset: -20px -26px;
      z-index: -1;
      background: oklch(from var(--bg) l c h / 0.55);
      backdrop-filter: blur(6px) saturate(0.8);
      -webkit-backdrop-filter: blur(6px) saturate(0.8);
      border-radius: 16px;
    }
    .prez-num {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .prez-kpi {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 3.4vw, 3.2rem);
      font-weight: 700; line-height: 1;
      color: var(--text); letter-spacing: -0.01em;
    }
    .prez-caption {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted); margin: 6px 0 12px;
    }
    .prez-body {
      font-size: 0.95rem; line-height: 1.6; color: var(--text);
      letter-spacing: 0.01em; text-wrap: pretty; margin: 0;
      white-space: pre-line;   /* respeta los saltos de párrafo del texto de la ficha */
    }
    .prez-body strong { font-weight: 700; }
    .prez-body em { font-style: italic; }
    #prez-pill {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      z-index: 30; display: flex; align-items: center; gap: 4px;
      padding: 6px 8px 6px 14px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-radius: 100px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    #prez-pill.visible { opacity: 1; pointer-events: auto; }
    #prez-counter {
      font-size: 0.625rem; font-weight: 600; letter-spacing: 0.14em;
      color: var(--muted); min-width: 40px; text-align: center;
      font-variant-numeric: tabular-nums;
    }
    #prez-pill .pill-btn {
      background: none; border: none; cursor: pointer; padding: 5px 10px;
      color: var(--text); opacity: 0.45; transition: opacity 0.2s;
      display: flex; align-items: center; border-radius: 100px;
    }
    #prez-pill .pill-btn:hover { opacity: 1; }
    #prez-pill .pill-btn:disabled { opacity: 0.18; cursor: default; pointer-events: none; }
    #prez-pill .pill-btn svg {
      width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; fill: none; display: block;
    }
    #prez-resume {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      z-index: 30;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      color: var(--muted);
      font-family: var(--font-body); font-size: 0.5625rem; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      padding: 8px 16px; border-radius: 100px; cursor: pointer;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease, color 0.2s;
    }
    #prez-resume.visible { opacity: 1; pointer-events: auto; }
    #prez-resume:hover { color: var(--text); }
    #prez-resume:focus-visible, #prez-pill .pill-btn:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 3px;
    }
    @media (max-width: 767px) {
      #prez-overlay {
        left: 16px; right: 16px; top: auto;
        bottom: calc(126px + env(safe-area-inset-bottom));
        transform: none; width: auto;
      }
      .prez-kpi { font-size: 2.5rem; }
      .prez-body { font-size: 1.05rem; }
      #prez-pill, #prez-resume { bottom: calc(76px + env(safe-area-inset-bottom)); }
      /* En móvil no hay espacio para la tarjeta de amenidades sin tapar el modelo */
      #amenidades { display: none; }
    }
  </style>
</head>
<body>

  <!-- ── LOADING ─────────────────────────────────────────────────────────── -->
  <div id="loading-overlay">
    <div class="lo-content">
      <span class="lo-label" data-site="pages.ownership.copy.loadingEyebrow">Torre Nashira · Nivel 10</span>
      <img class="lo-logo" alt="" hidden>
      <span class="lo-heading" data-site="pages.ownership.copy.loadingHeading">Ownership</span>
      <p class="lo-quote" lang="en" data-site="pages.ownership.copy.loadingQuote">The door handle is the handshake of the building.</p>
    </div>
    <div class="lo-bar-track">
      <div id="loading-bar"></div>
    </div>
  </div>

  <!-- ── CANVAS ──────────────────────────────────────────────────────────── -->
  <div id="canvas-container">
    <canvas id="three-canvas" role="img" aria-label="Visualizador 3D interactivo de la torre FORMA — selecciona un nivel para explorar las unidades disponibles"></canvas>
  </div>

  <!-- ── CANVAS DIM ──────────────────────────────────────────────────────── -->
  <div id="canvas-dim"></div>

  <!-- ── ETIQUETAS DE TIPOLOGÍA (vista por nivel) ────────────────────────── -->
  <div id="unit-tags"></div>

  <!-- ── AMENIDADES (capa siempre visible en torre y nivel; oculta en unidad) ── -->
  <div id="amenidades" aria-label="Amenidades del proyecto"></div>

  <!-- ── FLOOR LIST ──────────────────────────────────────────────────────── -->
  <div id="floor-list" role="navigation" aria-label="Navegación por pisos"></div>

  <!-- ── BACK BUTTON ─────────────────────────────────────────────────────── -->
  <button id="back-btn" aria-label="Volver a vista orbital">
    <span class="back-arrow">&#8592;</span> <span data-site="pages.ownership.copy.backButton">Torre</span>
  </button>

  <!-- ── INFO BUTTON ───────────────────────────────────────────────────────── -->
  <button id="info-btn" aria-label="Ver información de la unidad">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="8"/>

  <!-- ── THREE.JS ────────────────────────────────────────────────────────── -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader }     from 'three/addons/loaders/GLTFLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
    import { SSAOPass }       from 'three/addons/postprocessing/SSAOPass.js';
    import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';

    // ── MOTION PREFERENCE ────────────────────────────────────────────────────
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ── FICHA DEL PROYECTO (site.json → window.SITE) ─────────────────────────
    const OWN   = window.SITE.pages.ownership;
    const AVAIL = window.SITE.tokens.availability;

    // Pantalla de carga: si la ficha trae logotipo (brand.wordmark) y carga bien,
    // sustituye el TÍTULO de carga por el logo. Si no hay archivo (aún sin subir
    // en el panel Marca), se queda el texto — sin flash de vacío.
    (function () {
      const wm = window.SITE.brand && window.SITE.brand.wordmark;
      if (!wm) return;
      const logo = document.querySelector('.lo-logo');
      const heading = document.querySelector('.lo-heading');
      if (!logo || !heading) return;
      logo.alt = window.SITE.brand.fullName || window.SITE.brand.name || '';
      logo.onload = () => { logo.hidden = false; heading.hidden = true; };
      logo.src = wm;
    })();

    // ── STATE ────────────────────────────────────────────────────────────────
    let mode            = 'orbital';
    let selectedFloor   = null;
    let selectedUnit    = null;
    let hoveredFloorIdx = null;
    let floorViewPos    = null;   // posición guardada al entrar a unit
    let floorViewTgt    = null;
    let hoveredUnit     = null;
    let isTransitioning = false;
    let panelOpen       = false;
    let dimmerStart     = null;
    const DIMMER_MS     = OWN.camera.dimmerMs;
    let prezHighlightOn = false;   // presentación guiada: bloquea hover mientras ilumina
    let prezExitHook    = null;    // la presentación se retira al seleccionar piso/unidad
    let glbModel        = null;   // referencia al modelo completo para hide-all
    let panelState      = 'detail'; // 'detail' | 'proyecto' | 'form' | 'success'
    let formReturnState = 'detail'; // a dónde vuelve el form: 'detail' (unidad) | 'proyecto'
    let currentUnitData = null;
    let disponibilidad  = {};
    let floorGroups     = [];      // [{label, nodeName, items, y_center, units, meshToUnit}]
    let meshToFloor     = new Map(); // mesh → floorIndex (para selección desde unidades en orbital)
    let catNodes        = [];        // [{ name, unitId, worldPos, el }]
    let modelCenter     = new THREE.Vector3();
    let modelMaxDim     = 1;
    let azoteaItems     = [];
    let terrazaItems    = [];  // meshes de la Terraza — se mantiene visible al aislar un piso
    let plantaBajaItems = [];  // N01: locales comerciales — visible, fuera de navegación y venta
    const ghostMeshes   = [];

    // ── RENDERER ─────────────────────────────────────────────────────────────
    const canvas    = document.getElementById('three-canvas');
    const container = document.getElementById('canvas-container');
    const W = () => window.innerWidth;
    const H = () => window.innerHeight;

    // LinearSRGBColorSpace aquí — OutputPass aplica la conversión sRGB final
    // El fallo de contexto WebGL suele ser transitorio (proceso GPU reiniciándose):
    // reintentar con espera creciente antes de declarar derrota.
    let renderer = null;
    for (let attempt = 0; attempt < 4 && !renderer; attempt++) {
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
      } catch (err) {
        if (attempt === 3) {
          const q = document.querySelector('#loading-overlay .lo-quote');
          if (q) {
            q.textContent = 'El visor 3D no pudo iniciarse. ';
            const b = document.createElement('button');
            b.textContent = 'Reintentar';
            b.style.cssText = 'background:none;border:none;border-bottom:1px solid currentColor;color:var(--accent);font:inherit;cursor:pointer;padding:0;';
            b.addEventListener('click', () => location.reload());
            q.appendChild(b);
          }
          throw err;
        }
        await new Promise(r => setTimeout(r, 400 * Math.pow(2, attempt))); // 0.4s, 0.8s, 1.6s
      }
    }
    // Pérdida de contexto en vivo: prevenir el estado roto y dejar que el navegador restaure
    canvas.addEventListener('webglcontextlost', e => e.preventDefault(), false);
    // Liberar el contexto WebGL al salir/recargar: evita que F5 repetidos
    // acumulen contextos vivos y saturen el proceso GPU del navegador.
    window.addEventListener('pagehide', () => {
      try { renderer.forceContextLoss(); renderer.dispose(); } catch (e) {}
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(W(), H());
    renderer.outputColorSpace    = THREE.LinearSRGBColorSpace;
    renderer.toneMapping         = THREE.LinearToneMapping;
    // Entrada por tema: papel usa pull de foco (CSS blur, exposición normal);
    // grafito revela desde penumbra (0.25: silueta visible, nunca negro)
    const dimFrom = document.documentElement.dataset.theme === 'grafito' ? 0.25 : 1.0;
    renderer.toneMappingExposure = dimFrom;

    // ── SCENE ────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    // Canvas transparente: el fondo lo maneja el CSS (--bg en el contenedor).
    // Esto evita que toneMappingExposure oscurezca el background de la escena.
    function syncSceneBgToCSS() {
      scene.background = null;
      renderer.setClearColor(0x000000, 0);
    }
    syncSceneBgToCSS();

    // Hook para el toggle de tema: papel <-> grafito
    window.__applyTheme3D = (grafito) => {
      MAT_BASE.color.setHex(grafito ? 0xd8d5cf : 0xd2cec6);
      MAT_UNIT_DISPO_TENUE.color.copy(mezclaTenue(grafito ? 0xd8d5cf : 0xd2cec6));
      MAT_EDGE.opacity = grafito ? 0.22 : 0.3;
      syncSceneBgToCSS();
    };

    // ── CAMERA ───────────────────────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(OWN.camera.fov, W() / H(), 0.1, 2000);

    // ── CONTROLS ─────────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping  = true;
    controls.dampingFactor  = 0.07;
    controls.enablePan      = false;
    controls.maxPolarAngle  = Math.PI * 0.85;
    controls.update();

    // Cámara sólo ve layer 0 (geometría real).
    // Ghost volumes van en layer 1 → SSAOPass no los incluye → sin sombras fantasma.
    camera.layers.set(0);

    // ── LIGHTS ───────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 2.2));
    const sun = new THREE.DirectionalLight(0xfff8f0, 2.8);
    sun.position.set(60, 100, 50);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xe8f0ff, 1.2);
    fill.position.set(-50, 30, -70);
    scene.add(fill);
    const back = new THREE.DirectionalLight(0xffffff, 0.6);
    back.position.set(0, -20, -60);
    scene.add(back);

    // ── POST-PROCESSING ──────────────────────────────────────────────────────
    const composer   = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);
    const ssaoPass = new SSAOPass(scene, camera, W(), H());
    ssaoPass.kernelRadius = 12;
    ssaoPass.minDistance  = 0.002;
    ssaoPass.maxDistance  = 0.18;
    ssaoPass.output = SSAOPass.OUTPUT.Default;
    ssaoPass.enabled = true; // suavizado: kernel corto, rango apretado (calibrado al cargar el modelo)
    composer.addPass(ssaoPass);
    composer.addPass(new OutputPass());


    // ── MATERIALS ────────────────────────────────────────────────────────────
    const IS_GRAFITO_AT_LOAD = document.documentElement.dataset.theme === 'grafito';
    const MAT_BASE = new THREE.MeshLambertMaterial({ color: IS_GRAFITO_AT_LOAD ? 0xd8d5cf : 0xd2cec6, side: THREE.DoubleSide });
    const MAT_HOVER = new THREE.MeshLambertMaterial({ color: 0xfaf6ee, side: THREE.DoubleSide });
    const MAT_UNIT_HOVER = new THREE.MeshLambertMaterial({ color: parseInt(AVAIL.disponible.hex3d, 16), side: THREE.DoubleSide }); // disponible (ficha: tokens.availability)
    const MAT_UNIT_APARTADA = new THREE.MeshLambertMaterial({ color: parseInt(AVAIL.apartada.hex3d, 16), side: THREE.DoubleSide }); // apartada
    // selección = acento de la ficha; si el acento es oklch (canon), cae al color de apartada
    const ACCENT_3D = (window.SITE.tokens.accent || '').startsWith('#')
      ? parseInt('0x' + window.SITE.tokens.accent.slice(1), 16)
      : parseInt(AVAIL.apartada.hex3d, 16);
    const MAT_UNIT_SEL   = new THREE.MeshLambertMaterial({ color: ACCENT_3D, side: THREE.DoubleSide });
    // Disponibles en reposo (dentro de un nivel): 25% del acento sobre el color base — sutil
    const mezclaTenue = (baseHex) => new THREE.Color(baseHex).lerp(new THREE.Color(ACCENT_3D), 0.25);
    const MAT_UNIT_DISPO_TENUE = new THREE.MeshLambertMaterial({ color: mezclaTenue(IS_GRAFITO_AT_LOAD ? 0xd8d5cf : 0xd2cec6), side: THREE.DoubleSide });
    const MAT_EDGE = new THREE.LineBasicMaterial({ color: 0x1a1820, transparent: true, opacity: IS_GRAFITO_AT_LOAD ? 0.22 : 0.3, depthWrite: false });

    // ── RAYCASTERS ───────────────────────────────────────────────────────────
    const raycaster     = new THREE.Raycaster();
    raycaster.layers.set(1);        // layer 1: ghost volumes (floor picking)
    const unitRaycaster = new THREE.Raycaster();
    unitRaycaster.layers.set(0);    // layer 0: geometría real (unit picking)
    const mouse = new THREE.Vector2(-999, -999);

    // ── AVAILABILITY ─────────────────────────────────────────────────────────
    // Fuente: Supabase (ver backend.js / BACKEND.md). Clave: la ETIQUETA del cliente
    // ("201", "LOCAL 1"), que es también el nombre del nodo GLB. normId la normaliza.
    // Normaliza espacios y guiones bajos (three.js sanea "LOCAL 1" → "LOCAL_1")
    const normId = s => String(s ?? '').trim().toLowerCase().replace(/[\s_]+/g, ' ');

    async function loadDisponibilidad() {
      const store = u => {
        const key = normId(u.etiqueta ?? u.label);
        if (!key) return;   // fila sin etiqueta aún — se ignora hasta cargar datos
        disponibilidad[key] = {
          estado: u.estado,
          tipo: u.tipo ? String(u.tipo).toUpperCase() : null,
          tipologia: u.tipologia ?? null,   // A/B/C/D/L (nomenclatura cliente)
          etiqueta: u.etiqueta ?? u.label ?? null,
          m2: u.m2,
          m2_int: u.m2_int ?? null,
          m2_terraza: u.m2_terraza ?? null,
          m2_balcon: u.m2_balcon ?? null,
          precio: u.precio ?? null,
        };
      };
      try {
        const unidades = await window.MonolitoBackend.fetchDisponibilidad();
        unidades.forEach(store);
      } catch {
        // Sin conexión al backend — fallback al snapshot local si existe
        try {
          const res  = await fetch('content/data/disponibilidad.json');
          const data = await res.json();
          data.unidades.forEach(store);
        } catch { /* las unidades se muestran igual, sin datos de disponibilidad */ }
      }
    }

    function unitDispo(unit) {
      // unit.id = nombre del nodo GLB = etiqueta del cliente ("201", "LOCAL 1")
      return disponibilidad[normId(unit.id)] ?? null;
    }

    // Material en reposo de una unidad dentro de un nivel: las disponibles llevan
    // el tinte sutil de acento (25%); apartadas y vendidas, el color base.
    function matReposo(u) {
      return (unitDispo(u)?.estado ?? 'disponible') === 'disponible' ? MAT_UNIT_DISPO_TENUE : MAT_BASE;
    }

    // ── Etiquetas de tipología por unidad (vista por nivel) ──────────────────
    // Una pastilla (A/B/C/D/L) anclada al centro 3D de cada unidad del nivel
    // activo; se proyecta a pantalla en el render loop (patrón de los íconos CAT).
    const unitTagsWrap = document.getElementById('unit-tags');
    let unitTagEntries = [];
    function clearUnitTags() { unitTagsWrap.innerHTML = ''; unitTagEntries = []; }
    function buildUnitTags(fi) {
      clearUnitTags();
      const fg = floorGroups[fi];
      if (!fg) return;
      // Texto editable desde el panel (Ownership → Etiquetas de tipología).
      // Cadena: etiqueta por UNIDAD (locales, cada uno distinto) → etiqueta por
      // TIPOLOGÍA → la letra tal cual.
      const ETIQ   = OWN.etiquetasTipologia || {};
      const ETIQ_U = OWN.etiquetasUnidad || {};
      const box = new THREE.Box3();
      (fg.units || []).forEach(u => {
        const d = unitDispo(u);
        const tipo = d?.tipologia || null;
        if (!tipo) return;                       // sin dato de tipología: sin etiqueta
        box.makeEmpty();
        u.items.forEach(m => box.expandByObject(m));
        if (box.isEmpty()) return;
        const el = document.createElement('span');
        el.className = 'unit-tag ' + (d?.estado ?? 'disponible');
        el.textContent = ETIQ_U[d?.etiqueta] || ETIQ[String(tipo).toUpperCase()] || tipo;
        unitTagsWrap.appendChild(el);
        unitTagEntries.push({ el, centro: box.getCenter(new THREE.Vector3()) });
      });
    }

    const ESTADO_LABELS = OWN.copy.estados;
    function estadoLabel(d) {
      return ESTADO_LABELS[d?.estado] ?? 'Disponible';
    }

    function floorAvailability(fg) {
      const units = fg.units || [];
      const disp  = units.filter(u => unitDispo(u)?.estado === 'disponible').length;
      return { disp, total: units.length };
    }

    function hasAvailableUnits(fg) {
      return (fg.units || []).some(u => unitDispo(u)?.estado === 'disponible');
    }

    // ── UI REFS ───────────────────────────────────────────────────────────────
    const unitLabelEl = document.getElementById('unit-label');
    const labelId     = document.getElementById('label-id');
    const labelStatus = document.getElementById('label-status');

    // ── EASING / TWEEN ───────────────────────────────────────────────────────
    function easeInOutCubic(t) {
      return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    }
    function tweenCamera(fp, ft, tp, tt, dur, onDone) {
      const start = performance.now();
      const a = fp.clone(), b = ft.clone();
      (function tick(now) {
        const t = Math.min((now - start) / dur, 1);
        const e = easeInOutCubic(t);
        camera.position.lerpVectors(a, tp, e);
        controls.target.lerpVectors(b, tt, e);
        controls.update();
        if (t < 1) requestAnimationFrame(tick);
        else if (onDone) onDone();
      })(performance.now());
    }

    // ── HIGHLIGHT HELPERS ────────────────────────────────────────────────────
    function highlightFloorItem(fi) {
      document.querySelectorAll('.floor-item').forEach(el =>
        el.classList.toggle('hover-highlight', parseInt(el.dataset.fi) === fi)
      );
    }
    function clearFloorHighlight() {
      document.querySelectorAll('.floor-item.hover-highlight').forEach(el =>
        el.classList.remove('hover-highlight')
      );
    }
    function highlightFloor3D(fi) {
      if (prezHighlightOn) return;
      if (fi === null || !floorGroups[fi]) return;
      const fg = floorGroups[fi];
      (fg.units || []).forEach(u => {
        const estado = unitDispo(u)?.estado ?? 'disponible';
        // Disponibles en naranja; apartadas en tono medio; vendidas en tono natural
        const mat = estado === 'disponible' ? MAT_UNIT_HOVER
                  : estado === 'apartada'   ? MAT_UNIT_APARTADA
                  : MAT_BASE;
        u.items.forEach(m => { m.material = mat; });
      });
    }
    function clearFloor3DHover(fi) {
      if (prezHighlightOn) return;
      if (fi === null || !floorGroups[fi]) return;
      const fg = floorGroups[fi];
      fg.items.forEach(mesh => { mesh.material = MAT_BASE; });
      (fg.units || []).forEach(u => u.items.forEach(m => { m.material = MAT_BASE; }));
    }

    // ── FLOOR VISIBILITY ──────────────────────────────────────────────────────
    function applyFloorVisibility(activeIdx) {
      // Ocultar TODO el modelo primero — elimina cualquier geometría
      // no capturada en floorGroups (muros, columnas, etc.)
      if (glbModel) glbModel.traverse(obj => { if (obj.isMesh) obj.visible = false; });

      // Planta baja siempre visible: es la base del edificio
      plantaBajaItems.forEach(mesh => {
        mesh.visible  = true;
        mesh.material = MAT_BASE;
        mesh.children.forEach(c => { if (c.isLineSegments) c.visible = true; });
      });

      // Terraza: solo visible en los niveles altos (8, 9, 10). Al aislar los
      // niveles 1–7 se oculta (queda sobre el corte del edificio, no aplica).
      const nivelActivo = parseInt(String(floorGroups[activeIdx]?.label || '').replace(/\D/g, ''), 10);
      if (nivelActivo >= 8) {
        terrazaItems.forEach(mesh => {
          mesh.visible  = true;
          mesh.material = MAT_BASE;
          mesh.children.forEach(c => { if (c.isLineSegments) c.visible = true; });
        });
      }

      // Mostrar solo los pisos ≤ activeIdx. En el nivel ACTIVO, las unidades
      // disponibles llevan el tinte sutil de acento; los pisos de abajo, base.
      floorGroups.forEach((fg, i) => {
        if (i > activeIdx) return;
        fg.items.forEach(mesh => {
          mesh.visible  = true;
          mesh.material = MAT_BASE;
          mesh.children.forEach(c => { if (c.isLineSegments) c.visible = true; });
        });
        (fg.units || []).forEach(u => {
          const mat = (i === activeIdx) ? matReposo(u) : MAT_BASE;
          u.items.forEach(m => { m.visible = true; m.material = mat; });
        });
      });
    }

    function resetVisibility() {
      // Restaurar todo el modelo como visible
      if (glbModel) glbModel.traverse(obj => { if (obj.isMesh) obj.visible = true; });

      // Asignar materiales correctos a los floors conocidos
      azoteaItems.forEach(mesh => { mesh.material = MAT_BASE; });
      plantaBajaItems.forEach(mesh => { mesh.material = MAT_BASE; });
      floorGroups.forEach(fg => {
        fg.items.forEach(mesh => {
          mesh.material = MAT_BASE;
          mesh.children.forEach(c => { if (c.isLineSegments) c.visible = true; });
        });
        (fg.units || []).forEach(u =>
          u.items.forEach(m => { m.material = MAT_BASE; })
        );
      });
    }

    // ── SELECT FLOOR ─────────────────────────────────────────────────────────
    function selectFloor(fi) {
      if (isTransitioning) return;
      if (prezExitHook) prezExitHook();
      if (panelOpen) closePanel();

      // Limpiar hover antes de transicionar
      if (hoveredFloorIdx !== null) {
        setGhostHover(hoveredFloorIdx, false);
        clearFloor3DHover(hoveredFloorIdx);
        clearFloorHighlight();
        hoveredFloorIdx = null;
      }

      selectedFloor = fi;
      selectedUnit  = null;
      hoveredUnit   = null;
      unitLabelEl.classList.remove('visible');
      refreshInfoBtn();

      // Si venimos de modo unit, regresar el FOV de 8° a 15° en paralelo al tween
      if (Math.abs(camera.fov - 15) > 0.01) {
        const _fs = camera.fov, _fd = reducedMotion ? 1 : 1100, _ft0 = performance.now();
        (function fovTick(now) {
          const t = Math.min((now - _ft0) / _fd, 1);
          camera.fov = _fs + (15 - _fs) * easeInOutCubic(t);
          camera.updateProjectionMatrix();
          if (t < 1) requestAnimationFrame(fovTick);
        })(performance.now());
      }

      const fg = floorGroups[fi];
      applyFloorVisibility(fi);
      syncFloorList();

      const fromPos  = camera.position.clone();
      const fromTgt  = controls.target.clone();
      const fc       = fg.center ?? new THREE.Vector3(modelCenter.x, fg.y_center, modelCenter.z);
      const toTarget = fc.clone();
      // Encuadre del piso: distancia calculada según la huella real del piso y
      // el aspecto del viewport (igual criterio que la torre), manteniendo el
      // ángulo cenital 3/4. Antes era un offset fijo que recortaba en retrato.
      camera.aspect = W() / H();
      camera.updateProjectionMatrix();
      const fdim    = fg.footprint || modelMaxDim * 0.5;
      // Margen ceñido para el nivel: el piso debe llenar buena parte del cuadro.
      const fMargin = camera.aspect >= 1 ? 0.95 : 1.25;
      const dist = fitDistance(fMargin, fdim, 15);
      const dir  = new THREE.Vector3(1, 5, 1).normalize();
      const toPos = fc.clone().add(dir.multiplyScalar(dist));

      isTransitioning  = true;
      controls.enabled = false;
      ghostMeshes.forEach(g => { if (g) { g.visible = false; g.material.opacity = 0; } });

      tweenCamera(fromPos, fromTgt, toPos, toTarget, reducedMotion ? 1 : 1100, () => {
        isTransitioning  = false;
        mode             = 'floor';
        controls.enabled = true;
        document.getElementById('back-btn').classList.add('visible');
        refreshInfoBtn();
        buildUnitTags(fi);
      });
    }

    // Distancia de cámara que encuadra el modelo completo en AMBOS ejes:
    // en pantallas angostas (móvil portrait) manda el FOV horizontal.
    // Margen por defecto responsivo según el ASPECTO del viewport (no un ancho
    // fijo): cuanto más vertical/angosto, más se aleja la cámara para que la
    // torre completa quepa en cuadro. Apaisado: 1.5. Retrato acusado: hasta 3.0.
    function fitDistance(margin, dim = modelMaxDim, fovDeg = camera.fov) {
      const aspect = camera.aspect; // ancho / alto
      if (margin === undefined) {
        if (aspect >= 1)        margin = 1.5;            // apaisado (desktop)
        else if (aspect <= 0.5) margin = 2.0;            // retrato angosto (móvil)
        else margin = 1.5 + (1 - aspect) / 0.5 * 0.5;    // interpolado entre ambos
      }
      const vFov = fovDeg * (Math.PI / 180);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
      const fov  = Math.min(vFov, hFov);
      return (dim / 2) / Math.tan(fov / 2) * margin;
    }

    // Encuadre orbital con el viewport/aspecto actuales. Reutilizado en init,
    // resize y al terminar la carga (evita encuadre con aspecto obsoleto por
    // carreras de tiempo durante la carga del modelo).
    function frameOrbital() {
      if (!modelCenter) return;
      camera.aspect = W() / H();
      camera.updateProjectionMatrix();
      const dist = fitDistance();
      controls.target.copy(modelCenter);
      camera.position.set(
        modelCenter.x + dist * 0.55,
        modelCenter.y + dist * 0.38,
        modelCenter.z + dist * 0.55
      );
      controls.update();
    }

    function returnToOrbital(onDone) {
      if (isTransitioning) return;
      if (panelOpen) closePanel();
      resetVisibility();
      selectedUnit  = null;
      hoveredUnit   = null;
      unitLabelEl.classList.remove('visible');
      hideUnitInfo();

      const fromPos  = camera.position.clone();
      const fromTgt  = controls.target.clone();
      const dist = fitDistance();
      const toPos    = new THREE.Vector3(
        modelCenter.x + dist * 0.55,
        modelCenter.y + dist * 0.38,
        modelCenter.z + dist * 0.55
      );
      const toTarget = modelCenter.clone();

      isTransitioning = true;
      tweenCamera(fromPos, fromTgt, toPos, toTarget, reducedMotion ? 1 : 950, () => {
        isTransitioning = false;
        mode            = 'orbital';
        selectedFloor   = null;
        ghostMeshes.forEach(g => { if (g) g.visible = true; });
        syncFloorList();
        document.getElementById('back-btn').classList.remove('visible');
        refreshInfoBtn();
        clearUnitTags();
        if (onDone) onDone();
      });
    }

    function returnToFloor() {
      if (isTransitioning || selectedFloor === null) return;
      if (panelOpen) closePanel();
      selectedUnit = null; hoveredUnit = null;
      unitLabelEl.classList.remove('visible');
      hideUnitInfo();
      refreshInfoBtn();

      // Restaurar visibilidad completa del piso activo
      applyFloorVisibility(selectedFloor);

      // Restaurar la posición exacta de la vista por nivel anterior
      const toPos    = floorViewPos ?? new THREE.Vector3(modelCenter.x + modelMaxDim * 0.35, fg.y_center + modelMaxDim * 1.75, modelCenter.z + modelMaxDim * 0.35);
      const toTarget = floorViewTgt ?? new THREE.Vector3(modelCenter.x, fg.y_center, modelCenter.z);

      // Tween inline — interpola posición, target Y fov simultáneamente
      isTransitioning = true; controls.enabled = false;
      const _fp = camera.position.clone(), _ft = controls.target.clone();
      const _fovStart = camera.fov, _fovEnd = 15;
      const _dur = reducedMotion ? 1 : 800, _t0 = performance.now();
      (function tick(now) {
        const t = Math.min((now - _t0) / _dur, 1);
        const e = easeInOutCubic(t);
        camera.position.lerpVectors(_fp, toPos, e);
        controls.target.lerpVectors(_ft, toTarget, e);
        camera.fov = _fovStart + (_fovEnd - _fovStart) * e;
        camera.updateProjectionMatrix();
        controls.update();
        if (t < 1) requestAnimationFrame(tick);
        else { isTransitioning = false; mode = 'floor'; controls.enabled = true; floorViewPos = null; floorViewTgt = null; refreshInfoBtn(); buildUnitTags(selectedFloor); }
      })(performance.now());
    }

    function syncFloorList() {
      document.querySelectorAll('.floor-item').forEach(el =>
        el.classList.toggle('active', parseInt(el.dataset.fi) === selectedFloor)
      );
      // Expandir sub-lista del nivel activo, colapsar las demás
      document.querySelectorAll('.unit-list').forEach(ul => {
        ul.classList.toggle('expanded', parseInt(ul.dataset.fi) === selectedFloor);
      });
      // Marcar unidad activa
      document.querySelectorAll('.unit-item').forEach(ui =>
        ui.classList.toggle('active', ui.dataset.unitId === (selectedUnit?.id ?? ''))
      );
    }

    // ── FLOOR LIST UI ────────────────────────────────────────────────────────
    // ── CASCADA DE ENTRADA ────────────────────────────────────────────────
    // De abajo hacia arriba: cada label aparece y su piso pulsa en ámbar.
    function runFloorCascade() {
      const items = [...document.querySelectorAll('#floor-list .floor-item')];
      if (reducedMotion) { items.forEach(it => it.classList.add('revealed')); return; }
      items.sort((a, b) => a.dataset.fi - b.dataset.fi); // fi ascendente = N01 primero
      const applyFloorDispoMat = (fg) => {
        (fg.units || []).forEach(u => {
          const est = unitDispo(u)?.estado ?? 'disponible';
          const mat = est === 'disponible' ? MAT_UNIT_HOVER
                    : est === 'apartada'   ? MAT_UNIT_APARTADA
                    : MAT_BASE;
          u.items.forEach(m => { m.material = mat; });
        });
      };
      const resetFloorMat = (fg) => {
        (fg.units || []).forEach(u => u.items.forEach(m => { m.material = MAT_BASE; }));
      };
      // Cadena secuencial: cada paso apaga el piso anterior antes de encender
      // el siguiente — un solo piso iluminado a la vez, en colores de disponibilidad.
      let k = 0, prev = null;
      (function step() {
        if (prev) {
          prev.it.classList.remove('cascade-pulse');
          if (prev.fg && mode === 'orbital' && hoveredFloorIdx !== prev.fi) resetFloorMat(prev.fg);
          prev = null;
        }
        if (k >= items.length) return;
        const it = items[k++];
        const fi = parseInt(it.dataset.fi);
        const fg = floorGroups[fi];
        it.classList.add('revealed', 'cascade-pulse');
        const lit = fg && mode === 'orbital';
        if (lit) applyFloorDispoMat(fg);
        prev = { it, fi, fg: lit ? fg : null };
        setTimeout(step, 200);
      })();
    }

    function buildFloorList() {
      const el = document.getElementById('floor-list');
      el.innerHTML = '';
      for (let i = floorGroups.length - 1; i >= 0; i--) {
        const fg   = floorGroups[i];
        const avail = hasAvailableUnits(fg);
        const item = document.createElement('div');
        item.className  = 'floor-item' + (avail ? ' has-available' : '');
        item.dataset.fi = i;
        item.setAttribute('role', 'button');
        item.setAttribute('tabindex', '0');
        item.setAttribute('aria-label', fg.label);
        item.innerHTML = `
          <span class="floor-number">${fg.label}</span>
          <span class="floor-dot"></span>
        `;
        item.addEventListener('click', () => {
          if (isTransitioning) return;
          if (mode === 'floor' && selectedFloor === i) return;
          selectFloor(i);
        });
        item.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectFloor(i); }
        });
        item.addEventListener('mouseenter', () => {
          if (mode !== 'orbital' || isTransitioning) return;
          if (hoveredFloorIdx !== null) { setGhostHover(hoveredFloorIdx, false); clearFloor3DHover(hoveredFloorIdx); }
          hoveredFloorIdx = i;
          setGhostHover(i, true);
          highlightFloor3D(i);
          highlightFloorItem(i);
        });
        item.addEventListener('mouseleave', () => {
          if (mode !== 'orbital' || isTransitioning) return;
          setGhostHover(hoveredFloorIdx, false);
          clearFloor3DHover(hoveredFloorIdx);
          clearFloorHighlight();
          hoveredFloorIdx = null;
        });
        el.appendChild(item);

        // ── Sub-lista de unidades ──
        const unitList = document.createElement('div');
        unitList.className = 'unit-list';
        unitList.dataset.fi = i;

        (fg.units || []).forEach(u => {
          const uItem = document.createElement('div');
          const _estadoItem = unitDispo(u)?.estado ?? 'disponible';
          uItem.className = 'unit-item ' + _estadoItem;
          uItem.dataset.unitId = u.id;
          uItem.setAttribute('role', 'button');
          uItem.setAttribute('tabindex', '0');
          uItem.setAttribute('aria-label', u.label || u.id);
          uItem.innerHTML = `
            <span class="unit-name">${u.label || u.id}</span>
            <span class="unit-dot"></span>
          `;

          uItem.addEventListener('mouseenter', () => {
            if (isTransitioning) return;
            if (hoveredUnit && hoveredUnit !== selectedUnit)
              hoveredUnit.items.forEach(m => { m.material = matReposo(hoveredUnit); });
            hoveredUnit = u;
            const _e = unitDispo(u)?.estado ?? 'disponible';
            if (_e !== 'vendida') {
              const _m = _e === 'apartada' ? MAT_UNIT_APARTADA : MAT_UNIT_HOVER;
              u.items.forEach(m => { m.material = _m; });
            }
          });
          uItem.addEventListener('mouseleave', () => {
            if (hoveredUnit === u && u !== selectedUnit)
              u.items.forEach(m => { m.material = matReposo(u); });
            if (hoveredUnit === u) hoveredUnit = null;
          });
          uItem.addEventListener('click', () => {
            if (isTransitioning) return;
            if ((unitDispo(u)?.estado ?? 'disponible') === 'vendida') return;
            selectUnit(u);
          });
          uItem.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if ((unitDispo(u)?.estado ?? 'disponible') === 'vendida') return;
              selectUnit(u);
            }
          });

          unitList.appendChild(uItem);
        });

        el.appendChild(unitList);
      }
      el.classList.add('visible');
    }

    // ── GHOST VOLUMES ────────────────────────────────────────────────────────
    const ghostMat = new THREE.MeshLambertMaterial({
      color: 0xc8a050, transparent: true, opacity: 0,
      depthWrite: false, side: THREE.FrontSide,
    });

    function buildGhostVolumes() {
      floorGroups.forEach((fg, fi) => {
        const box = new THREE.Box3();
        // Incluir meshes estructurales del piso
        fg.items.forEach(mesh => {
          mesh.geometry.computeBoundingBox();
          const wb = mesh.geometry.boundingBox.clone().applyMatrix4(mesh.matrixWorld);
          box.union(wb);
        });
        // Incluir meshes de unidades (pueden estar fuera del bbox estructural)
        (fg.units || []).forEach(u => u.items.forEach(mesh => {
          mesh.geometry.computeBoundingBox();
          const wb = mesh.geometry.boundingBox.clone().applyMatrix4(mesh.matrixWorld);
          box.union(wb);
        }));
        if (box.isEmpty()) { ghostMeshes.push(null); return; }
        fg.center   = box.getCenter(new THREE.Vector3()); // centro real XYZ del piso
        fg.y_center = fg.center.y;
        const size   = box.getSize(new THREE.Vector3());
        fg.footprint = Math.hypot(size.x, size.z);        // diagonal de la huella (vista 3/4 desde esquina)
        const center = box.getCenter(new THREE.Vector3());
        const geo    = new THREE.BoxGeometry(size.x, size.y, size.z);
        const mat    = ghostMat.clone();
        const ghost  = new THREE.Mesh(geo, mat);
        ghost.position.copy(center);
        ghost.userData.floorIndex = fi;
        ghost.layers.set(1);
        scene.add(ghost);
        ghostMeshes.push(ghost);
      });
    }

    function setGhostHover(fi, on) {
      if (fi === null || !ghostMeshes[fi]) return;
      ghostMeshes[fi].material.opacity = on ? 0.10 : 0;
    }

    // ── SELECT UNIT ──────────────────────────────────────────────────────────
    function selectUnit(unit) {
      if (isTransitioning || selectedFloor === null || !unit) return;
      if (prezExitHook) prezExitHook();
      selectedUnit = unit;
      showUnitInfo(unit);   // info + iconos sobre la pantalla, al instante

      // Ocultar todo el modelo — mostrar únicamente la unidad seleccionada
      if (glbModel) glbModel.traverse(obj => { if (obj.isMesh) obj.visible = false; });
      unit.items.forEach(m => { m.visible = true; m.material = MAT_BASE; });

      const box = new THREE.Box3();
      unit.items.forEach(m => box.expandByObject(m));
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());

      // Guardar posición actual (vista por nivel) para poder restaurarla al salir
      floorViewPos = camera.position.clone();
      floorViewTgt = controls.target.clone();

      // Encuadre de la unidad: distancia calculada según su tamaño y el aspecto
      // del viewport, al FOV final de 8°. Antes era un offset fijo que recortaba
      // unidades anchas en retrato.
      camera.aspect = W() / H();
      const udim    = Math.max(Math.hypot(size.x, size.z), size.y, modelMaxDim * 0.08);
      const uMargin = camera.aspect >= 1 ? 1.15 : 1.5;
      const dist    = fitDistance(uMargin, udim, 8);
      const dir     = new THREE.Vector3(1, 4, 1).normalize();
      const toPos   = center.clone().add(dir.multiplyScalar(dist));

      // Tween inline — interpola posición, target Y fov simultáneamente
      isTransitioning = true; controls.enabled = false;
      const _fp = camera.position.clone(), _ft = controls.target.clone();
      const _fovStart = camera.fov, _fovEnd = 8;
      const _dur = reducedMotion ? 1 : 900, _t0 = performance.now();
      (function tick(now) {
        const t = Math.min((now - _t0) / _dur, 1);
        const e = easeInOutCubic(t);
        camera.position.lerpVectors(_fp, toPos, e);
        controls.target.lerpVectors(_ft, center, e);
        camera.fov = _fovStart + (_fovEnd - _fovStart) * e;
        camera.updateProjectionMatrix();
        controls.update();
        if (t < 1) requestAnimationFrame(tick);
        else {
          isTransitioning = false; mode = 'unit'; controls.enabled = true;
          refreshInfoBtn();
        }
      })(performance.now());
    }

    // ── UNIT PANEL ────────────────────────────────────────────────────────────
    const unitPanel  = document.getElementById('unit-panel');
    const canvasDim  = document.getElementById('canvas-dim');
    const panelClose = document.getElementById('panel-close');
    const infoBtn    = document.getElementById('info-btn');

    // Información del proyecto (mostrada cuando NO hay unidad seleccionada).
    const PROJECT_INFO = (typeof OWN.copy.infoProyecto === 'string') ? OWN.copy.infoProyecto.trim() : '';
    // Formato ligero: escapa HTML y traduce **negrita** / *cursiva* (los saltos
    // de línea los respeta el CSS con pre-line).
    function escFmt(raw) {
      return String(raw)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
    }
