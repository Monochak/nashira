    // Estado del botón info: visible siempre que haya unidad seleccionada O info de
    // proyecto capturada; en acento (.selected) solo cuando hay unidad. Si no hay
    // ninguna de las dos (proyecto sin info y sin unidad), queda oculto.
    function refreshInfoBtn() {
      const hasUnit  = mode === 'unit' && !!selectedUnit;
      const hasFloor = mode === 'floor' && selectedFloor !== null;   // info del nivel (auto, de Supabase)
      const show     = hasUnit || hasFloor || !!PROJECT_INFO;
      refreshAmenidades();
      infoBtn.classList.toggle('visible', show);
      infoBtn.classList.toggle('cta', hasUnit);        // en unidad: CTA "Hablar con un asesor"
      infoBtn.classList.remove('selected');
      const lbl = infoBtn.querySelector('.info-label');
      if (lbl) lbl.textContent = hasUnit
        ? (SITE_GET('pages.ownership.copy.cta') || 'Hablar con un asesor')
        : (SITE_GET('pages.ownership.copy.infoButton') || 'Info');
      if (show && !panelOpen) requestAnimationFrame(() => infoBtn.classList.add('shown'));
      else infoBtn.classList.remove('shown');
    }

    // Panel de información del NIVEL (modo piso, sin unidad): resumen armado solo
    // de los datos de disponibilidad — unidades, disponibles, tipologías, superficies.
    function openFloorPanel() {
      if (selectedFloor === null || !floorGroups[selectedFloor]) return;
      const fg    = floorGroups[selectedFloor];
      const datos = (fg.units || []).map(u => unitDispo(u)).filter(Boolean);
      const disp  = datos.filter(d => d.estado === 'disponible');
      const tips  = [...new Set(datos.map(d => d.tipologia).filter(Boolean))].sort();
      const m2de  = d => {
        const ext = (d.m2_terraza ?? 0) + (d.m2_balcon ?? 0);
        return (d.m2_int != null) ? +(d.m2_int + ext).toFixed(1) : (d.m2 ?? null);
      };
      const m2s   = datos.map(m2de).filter(v => v != null);
      const fila  = (lbl, val, accent) => (val == null || val === '') ? '' : `
        <div class="panel-stat">
          <span class="stat-label">${lbl}</span>
          <span class="stat-value${accent ? ' accent' : ''}">${val}</span>
        </div>`;
      document.getElementById('panel-floor-label').textContent = window.SITE.brand.name || '';
      document.getElementById('panel-unit-name').textContent   = fg.label;
      document.getElementById('panel-nivel-stats').innerHTML =
        fila('Unidades', datos.length || (fg.units || []).length) +
        fila('Disponibles', disp.length, true) +
        fila('Tipologías', tips.length ? tips.join(' · ') : null) +
        (m2s.length ? fila('Superficies', Math.min(...m2s).toFixed(0) + '–' + Math.max(...m2s).toFixed(0) + ' m²') : '');
      setPanelState('nivel');
      unitPanel.classList.add('open');
      canvasDim.classList.add('active');
      unitLabelEl.classList.remove('visible');
      panelOpen = true;
      syncFloorList();
      infoBtn.classList.remove('shown');
    }

    // Panel de información del proyecto (reusa el panel deslizante + el mismo CTA).
    function openProjectPanel() {
      if (!PROJECT_INFO) return;
      const BR = window.SITE.brand || {};
      document.getElementById('panel-floor-label').textContent = '';
      // Header: por defecto el nombre en texto; si hay logotipo que cargue, domina.
      const nameEl = document.getElementById('panel-unit-name');
      nameEl.textContent = BR.name || '';
      if (BR.wordmark) {
        const logo = new Image();
        logo.className = 'panel-proyecto-logo';
        logo.alt = BR.fullName || BR.name || '';
        logo.onload = () => { nameEl.textContent = ''; nameEl.appendChild(logo); };
        logo.src = BR.wordmark;
      }
      // Las amenidades ya NO viven aquí: son una capa siempre visible en pantalla
      // (#amenidades). El panel de proyecto solo muestra la descripción opcional.
      document.getElementById('panel-proyecto-body').innerHTML =
        PROJECT_INFO ? `<div class="panel-proyecto-intro">${escFmt(PROJECT_INFO)}</div>` : '';
      setPanelState('proyecto');
      unitPanel.classList.add('open');
      canvasDim.classList.add('active');
      unitLabelEl.classList.remove('visible');
      panelOpen = true;
      syncFloorList();
      infoBtn.classList.remove('shown');
    }

    // "Hablar con un asesor" (unidad seleccionada) → panel con el formulario.
    function openContactForm() {
      if (!selectedUnit) return;
      document.getElementById('panel-floor-label').textContent = currentUnitData.floorLabel || '';
      document.getElementById('panel-unit-name').textContent   = currentUnitData.unitLabel || '';
      formReturnState = 'cerrar';
      setPanelState('form');
      unitPanel.classList.add('open');
      canvasDim.classList.add('active');
      panelOpen = true;
      infoBtn.classList.remove('shown');
    }

    // Botón abajo-derecha: en unidad = "Hablar con un asesor"; si no, INFO del nivel/proyecto.
    infoBtn.addEventListener('click', () => {
      if (selectedUnit) openContactForm();
      else if (mode === 'floor') openFloorPanel();
      else openProjectPanel();
    });

    function setPanelState(state) {
      document.querySelectorAll('.panel-section').forEach(el => { el.hidden = true; });
      document.getElementById(`panel-${state}`).hidden = false;
      panelState = state;
    }

    // Catálogo curado de características (icono de línea + etiqueta por defecto).
    // Se prenden/apagan y su texto se edita por tipología desde el panel.
    const CARACTERISTICAS_CAT = [
      { key: 'recamaras',       label: 'Recámaras',        ic: '<path d="M3 18v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5"/><path d="M3 18h18"/><path d="M7 11V9a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v2"/>' },
      { key: 'banoCompleto',    label: 'Baño completo',    ic: '<path d="M4 13V6.5a2 2 0 0 1 3.9-.6"/><path d="M3 13h18v2a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-2z"/><path d="M7 19l-1 2M18 19l1 2"/>' },
      { key: 'medioBano',       label: 'Medio baño',       ic: '<path d="M7 3v7"/><path d="M5 10h11a1 1 0 0 1 1 1c0 3.3-2.7 6-6 6a5 5 0 0 1-5-5v-3z"/><path d="M9 17l-1 4M13 17l1 4"/>' },
      { key: 'sala',            label: 'Sala / Comedor',   ic: '<path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M4 11a2 2 0 0 0-2 2v4h20v-4a2 2 0 0 0-2-2"/><path d="M6 17v2M18 17v2"/>' },
      { key: 'cocina',          label: 'Cocina',           ic: '<rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="9" r="1.3"/><path d="M4 13h16"/>' },
      { key: 'closet',          label: 'Walk In Closet',   ic: '<path d="M12 5a1.5 1.5 0 1 0-1.4 2L12 8"/><path d="M12 8l7.5 5.2a1 1 0 0 1-.6 1.8H5.1a1 1 0 0 1-.6-1.8L12 8z"/>' },
      { key: 'estacionamiento', label: 'Estacionamiento',  ic: '<path d="M6 13l1.2-3.6A2 2 0 0 1 9.1 8h5.8a2 2 0 0 1 1.9 1.4L18 13"/><path d="M5 13h14v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-4z"/><path d="M7.5 15.5h.01M16.5 15.5h.01"/>' },
      { key: 'lavado',          label: 'Cuarto de lavado', ic: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6h.01M11 6h.01"/>' },
      { key: 'bodega',          label: 'Bodega',           ic: '<path d="M12 3 4 7v10l8 4 8-4V7l-8-4z"/><path d="M4 7l8 4 8-4"/><path d="M12 11v10"/>' },
      { key: 'terraza',         label: 'Terraza / Balcón', ic: '<path d="M4 8h16"/><path d="M4 8v12M20 8v12M4 20h16"/><path d="M8 8v12M12 8v12M16 8v12"/>' },
      { key: 'vista',           label: 'Vista',            ic: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="M4 17l5-5 3 3 3-4 5 6"/>' },
    ];
    const CARAC_ICON = ic => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>`;

    // Catálogo curado de AMENIDADES del proyecto (icono de línea FORMA + etiqueta).
    // Se prenden/apagan y su texto se edita desde el panel. Reemplaza la lista de
    // viñetas del panel de información del proyecto por una retícula icono+texto.
    const AMENIDADES_CAT = [
      { key: 'niveles',           label: '10 Niveles Residenciales',            ic: '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M4 21h16"/><path d="M6 8h12M6 12h12M6 16h12"/>' },
      { key: 'accesoInteligente', label: 'Acceso Inteligente',                  ic: '<rect x="4" y="4" width="10" height="16" rx="2"/><circle cx="7.5" cy="9" r=".5"/><circle cx="10.5" cy="9" r=".5"/><circle cx="7.5" cy="12" r=".5"/><circle cx="10.5" cy="12" r=".5"/><path d="M16.5 8a4 4 0 0 1 0 6"/><path d="M18.5 6a7 7 0 0 1 0 10"/>' },
      { key: 'elevadores',        label: '2 Elevadores de alta velocidad',      ic: '<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M12 3v18"/><path d="M7 9.5 8.5 8l1.5 1.5"/><path d="M14 14.5 15.5 16l1.5-1.5"/>' },
      { key: 'lockers',           label: 'Delivery Lockers',                    ic: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M12 3v18"/><path d="M5 9h14M5 15h14"/><path d="M9 6.2h.8M15 6.2h.8M9 12.2h.8M15 12.2h.8M9 18.2h.8M15 18.2h.8"/>' },
      { key: 'vigilancia',        label: 'Vigilancia 24 horas',                 ic: '<path d="M4 12a8 6 0 0 1 16 0z"/><circle cx="12" cy="9.5" r="1.6"/><path d="M12 6V3"/>' },
      { key: 'cargadores',        label: 'Cargadores para Vehículos Eléctricos',ic: '<path d="M3 14l1-3a2 2 0 0 1 1.9-1.3h5.2A2 2 0 0 1 13 11l1 3"/><path d="M2 14h13v3a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H5v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-3z"/><path d="M19 8l-2.5 3.5H19L16.5 15"/>' },
      { key: 'reciclaje',         label: 'Punto de Reciclaje',                  ic: '<path d="M6 9a6.5 6.5 0 0 1 10.5-1.8"/><path d="M18 12.5a6.5 6.5 0 0 1-10.5 1.8"/><path d="M16.5 4v3.5H13"/><path d="M7.5 17.5V14H11"/>' },
      { key: 'petShower',         label: 'Pet Shower',                          ic: '<path d="M6 3v2"/><path d="M3.5 8a2.5 2.5 0 0 1 5 0z"/><path d="M4.5 11l-.5 1.5M6 11l-.5 1.5M7.5 11l-.5 1.5"/><circle cx="14" cy="14" r="1"/><circle cx="17.5" cy="13.5" r="1"/><circle cx="20" cy="15.5" r="1"/><path d="M17 16.5a2 2 0 0 0-1.7 3.1c.4.6 3 .6 3.4 0A2 2 0 0 0 17 16.5z"/>' },
      { key: 'toolRoom',          label: 'Tool Room',                           ic: '<path d="M14.7 6.3a3 3 0 0 0-3.9 3.9L5 16l3 3 5.8-5.8a3 3 0 0 0 3.9-3.9l-1.9 1.9-1.7-.2-.2-1.7 1.8-2z"/><path d="M5.5 5 8.5 8"/><path d="M4 6.5 5.5 5 7 6.5 5.5 8z"/>' },
      { key: 'jardin',            label: 'Jardín & Patio Interior',             ic: '<path d="M12 4a4 4 0 0 0-2 7.5V14h4v-2.5A4 4 0 0 0 12 4z"/><path d="M10 14h4"/><path d="M4 19c1.3-1 2.7-1 4 0s2.7 1 4 0 2.7-1 4 0"/><path d="M4 21.5c1.3-1 2.7-1 4 0s2.7 1 4 0 2.7-1 4 0"/>' },
      { key: 'gym',               label: 'Open Gym al Aire Libre',              ic: '<path d="M6.5 8v8M4 10v4M17.5 8v8M20 10v4M6.5 12h11"/>' },
      { key: 'coworking',         label: 'Área de Coworking',                   ic: '<path d="M6 6h12v8H6z"/><path d="M4 17.5l1.3-3.5h13.4l1.3 3.5a1 1 0 0 1-1 1.3H5a1 1 0 0 1-1-1.3z"/>' },
      { key: 'firepit',           label: 'Firepit & Área de Asadores',          ic: '<path d="M12 4c.4 2.3 2.8 3.2 2.8 6a2.8 2.8 0 0 1-5.6 0c0-1.2.6-1.9 1.2-2.8.5.9.8 1.1.8 2.1"/><path d="M5 18h14M7 20.5h10"/>' },
      { key: 'rooftop',           label: 'Terraza Rooftop',                     ic: '<path d="M12 3v2"/><path d="M4 9a8 4.5 0 0 1 16 0z"/><path d="M12 9v8"/><path d="M8 20l1-3M16 20l-1-3"/><path d="M8.5 17h7"/>' },
      { key: 'edge',              label: 'Certificación Edge',                  ic: '<circle cx="12" cy="9" r="5.5"/><path d="M9.5 13.5 8 21l4-2 4 2-1.5-7.5"/><path d="M12 6.5c-1.6 0-2.6 1.1-2.6 2.6 1.6 0 2.6-1.1 2.6-2.6z"/><path d="M12 6.5c1.6 0 2.6 1.1 2.6 2.6-1.6 0-2.6-1.1-2.6-2.6z"/>' },
    ];
    const AMEN_ICON = ic => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>`;

    // Retícula de amenidades del proyecto (icono arriba, texto debajo). Convención:
    // si la ficha no trae amenidades configuradas, se muestran TODAS con su etiqueta
    // por defecto (arranca bonito de fábrica); en cuanto se configura en el panel,
    // respeta la selección. Texto vacío = etiqueta por defecto del catálogo.
    function amenidadesProyecto() {
      const amen  = OWN.amenidades;
      const esc   = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const hasSel = amen && Object.keys(amen).length;
      return AMENIDADES_CAT
        .filter(a => !hasSel || amen[a.key] !== undefined)
        .map(a => `<div class="amenidad"><span class="amenidad-ic">${AMEN_ICON(a.ic)}</span><span class="amenidad-tx">${esc((hasSel && amen[a.key]) || a.label)}</span></div>`)
        .join('');
    }
    const AMENIDADES_HTML = amenidadesProyecto();

    // Capa de amenidades SIEMPRE VISIBLE: se puebla una vez y se muestra en modo
    // torre (orbital) y nivel (floor); se oculta al seleccionar una unidad o abrir
    // un panel. La llama refreshInfoBtn (mismos momentos) + las aperturas de panel.
    function refreshAmenidades() {
      const el = document.getElementById('amenidades');
      if (!el) return;
      if (AMENIDADES_HTML && !el.innerHTML) el.innerHTML = `<div class="amenidades-grid">${AMENIDADES_HTML}</div>`;
      // Visible en torre y nivel; oculta SOLO al seleccionar unidad. Al abrir un
      // panel no se oculta: el dim (z10) la atenúa junto al modelo, como la info de unidad.
      const show = !!AMENIDADES_HTML && !selectedUnit
                && (mode === 'orbital' || mode === 'floor');
      el.classList.toggle('on', show);
    }

    // Lista de características de la tipología de una unidad (icono + texto).
    function caracteristicasUnidad(tipologia) {
      const mapa = (OWN.caracteristicas && OWN.caracteristicas[String(tipologia).toUpperCase()]) || {};
      const esc  = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      return CARACTERISTICAS_CAT
        .filter(c => mapa[c.key] !== undefined)
        .map(c => `<div class="unit-feat"><span class="unit-feat-ic">${CARAC_ICON(c.ic)}</span><span class="unit-feat-tx">${esc(mapa[c.key] || c.label)}</span></div>`)
        .join('');
    }

    // Info de la unidad DIRECTAMENTE sobre la pantalla (fuera del panel): nombre,
    // datos y características con iconos. El panel se reserva para "Hablar con un asesor".
    function showUnitInfo(unit) {
      const fg = floorGroups[selectedFloor];
      const d  = unitDispo(unit);
      const floorLabel = fg ? fg.label : '—';
      const unitLabel  = d?.etiqueta ?? unit.label;
      const tipologia  = d?.tipologia ?? d?.tipo ?? '—';
      const fM2  = v => (v == null) ? '—' : (Math.round(v * 10) / 10).toFixed(1) + ' m²';
      const mInt = d?.m2_int ?? null;
      const mExt = (d?.m2_terraza != null || d?.m2_balcon != null) ? ((d.m2_terraza ?? 0) + (d.m2_balcon ?? 0)) : null;
      const mTot = (mInt != null) ? +(mInt + (mExt ?? 0)).toFixed(1) : (d?.m2 ?? null);
      currentUnitData = { floorLabel, unitLabel, tipo: tipologia, m2: mTot ?? '—' };
      const precioStr = d?.precio ? '$' + Number(d.precio).toLocaleString('es-MX') : null;

      const stat = (l, v, acc) => (v == null || v === '') ? '' :
        `<div class="ui-stat"><span class="ui-stat-l">${l}</span><span class="ui-stat-v${acc ? ' accent' : ''}">${v}</span></div>`;
      document.getElementById('ui-floor').textContent = floorLabel;
      document.getElementById('ui-name').textContent  = unitLabel;
      document.getElementById('ui-stats').innerHTML =
        stat(OWN.copy.stats.tipologia, tipologia) +
        stat(OWN.copy.stats.superficie, fM2(mTot)) +
        (precioStr && d?.estado === 'disponible' ? stat(OWN.copy.stats.precio, precioStr, true) : '') +
        stat(OWN.copy.stats.estado, estadoLabel(d), d?.estado === 'disponible' || !d);
      const feats = caracteristicasUnidad(tipologia);
      const fEl = document.getElementById('ui-feats');
      fEl.innerHTML = feats;
      fEl.hidden = !feats;
      const ui = document.getElementById('unit-info');
      ui.hidden = false;
      requestAnimationFrame(() => ui.classList.add('on'));
    }
    function hideUnitInfo() {
      const ui = document.getElementById('unit-info');
      ui.classList.remove('on');
      ui.hidden = true;
    }

    function openPanel(unit) {
      const fg = floorGroups[selectedFloor];
      const d  = unitDispo(unit);
      const floorLabel = fg ? fg.label : '—';
      // Etiqueta del cliente (Supabase) tiene prioridad; fallback al label del GLB
      const unitLabel  = d?.etiqueta ?? unit.label;
      const tipologia  = d?.tipologia ?? d?.tipo ?? '—';

      // Superficie: si hay desglose granular, mostrar interior / terrazas+balcones / total;
      // si no, caer al m2 único (compat con datos previos).
      const fM2  = v => (v == null) ? '—' : (Math.round(v * 10) / 10).toFixed(1) + ' m²';
      const mInt = d?.m2_int ?? null;
      const mExt = (d?.m2_terraza != null || d?.m2_balcon != null)
        ? ((d.m2_terraza ?? 0) + (d.m2_balcon ?? 0)) : null;
      const mTot = (mInt != null) ? +(mInt + (mExt ?? 0)).toFixed(1) : (d?.m2 ?? null);

      currentUnitData = { floorLabel, unitLabel, tipo: tipologia, m2: mTot ?? '—' };

      const precioStr = d?.precio
        ? '$' + Number(d.precio).toLocaleString('es-MX')
        : null;

      const superficieRows = (mInt != null)
        ? `
        <div class="panel-stat">
          <span class="stat-label">Interior</span>
          <span class="stat-value">${fM2(mInt)}</span>
        </div>
        <div class="panel-stat">
          <span class="stat-label">Terrazas y balcones</span>
          <span class="stat-value">${fM2(mExt)}</span>
        </div>
        <div class="panel-stat">
          <span class="stat-label">Total</span>
          <span class="stat-value">${fM2(mTot)}</span>
        </div>`
        : `
        <div class="panel-stat">
          <span class="stat-label">${OWN.copy.stats.superficie}</span>
          <span class="stat-value">${fM2(mTot)}</span>
        </div>`;

      document.getElementById('panel-floor-label').textContent = floorLabel;
      document.getElementById('panel-unit-name').textContent   = unitLabel;
      document.getElementById('panel-stats').innerHTML = `
        <div class="panel-stat">
          <span class="stat-label">${OWN.copy.stats.tipologia}</span>
          <span class="stat-value">${tipologia}</span>
        </div>
        ${superficieRows}
        ${precioStr && d?.estado === 'disponible' ? `
        <div class="panel-stat">
          <span class="stat-label">${OWN.copy.stats.precio}</span>
          <span class="stat-value accent">${precioStr}</span>
        </div>` : ''}
        <div class="panel-stat">
          <span class="stat-label">${OWN.copy.stats.estado}</span>
          <span class="stat-value${d?.estado === 'disponible' || !d ? ' accent' : ''}">${estadoLabel(d)}</span>
        </div>
      `;

      const feats = caracteristicasUnidad(tipologia);
      document.getElementById('panel-features').innerHTML = feats;
      document.getElementById('panel-features').hidden = !feats;

      setPanelState('detail');
      unitPanel.classList.add('open');
      canvasDim.classList.add('active');
      unitLabelEl.classList.remove('visible');
      panelOpen = true;
      syncFloorList();
      infoBtn.classList.remove('shown');
    }

    function closePanel() {
      unitPanel.classList.remove('open');
      canvasDim.classList.remove('active');
      panelOpen = false;
      syncFloorList();
      refreshInfoBtn();
      // Reset form and state after close animation (0.42s)
      setTimeout(() => {
        document.getElementById('contact-form').reset();
        setPanelState('detail');
      }, 460);
    }

    panelClose.addEventListener('click', closePanel);
    canvasDim.addEventListener('click', closePanel);

    // Escape: cierra el panel si abierto, o navega hacia atrás en la vista
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (panelOpen) { closePanel(); return; }
      if (mode === 'unit')  returnToFloor();
      else if (mode === 'floor') returnToOrbital();
    });

    // Limpiar errores al corregir
    ['f-nombre', 'f-email'].forEach(id => {
      document.getElementById(id).addEventListener('input', function() {
        this.classList.remove('error');
        document.getElementById(id + '-error').classList.remove('visible');
      });
    });

    // CTA: detalle de unidad → formulario
    document.getElementById('panel-cta-contact').addEventListener('click', () => {
      formReturnState = 'detail';
      setPanelState('form');
    });

    // CTA: info de proyecto → formulario
    document.getElementById('panel-cta-proyecto').addEventListener('click', () => {
      formReturnState = 'proyecto';
      setPanelState('form');
    });

    // CTA: info de nivel → formulario
    document.getElementById('panel-cta-nivel').addEventListener('click', () => {
      formReturnState = 'nivel';
      setPanelState('form');
    });

    // Volver: formulario → de donde vino (unidad on-screen → cierra; proyecto/nivel → su detalle)
    document.getElementById('panel-back').addEventListener('click', () => {
      if (formReturnState === 'cerrar') closePanel();
      else setPanelState(formReturnState);
    });

    // Submit del formulario
    document.getElementById('contact-form').addEventListener('submit', async e => {
      e.preventDefault();
      const nombreEl = document.getElementById('f-nombre');
      const emailEl  = document.getElementById('f-email');
      const nombre   = nombreEl.value.trim();
      const email    = emailEl.value.trim();
      const telefono = document.getElementById('f-tel').value.trim();

      // Inline validation
      let valid = true;
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      nombreEl.classList.toggle('error', !nombre);
      document.getElementById('f-nombre-error').classList.toggle('visible', !nombre);
      if (!nombre) { valid = false; nombreEl.focus(); }

      emailEl.classList.toggle('error', !email || !emailRe.test(email));
      document.getElementById('f-email-error').classList.toggle('visible', !email || !emailRe.test(email));
      if (!email || !emailRe.test(email)) {
        valid = false;
        if (nombre) emailEl.focus();
      }

      if (!valid) return;

      // Envío al backend del estudio (ver backend.js / BACKEND.md)
      const submitBtn = e.target.querySelector('.panel-cta');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando…';
      try {
        await window.MonolitoBackend.enviarLead({
          nombre, email,
          telefono: telefono || null,
          mensaje:
            `Unidad de interés: ${currentUnitData.floorLabel} / ${currentUnitData.unitLabel}` +
            ` · Tipología: ${currentUnitData.tipo} · Superficie: ${currentUnitData.m2} m²`,
        });
        setPanelState('success');
        setTimeout(() => closePanel(), 3000);
      } catch {
        submitBtn.textContent = 'Error — reintentar';
      } finally {
        submitBtn.disabled = false;
        if (panelState === 'success') submitBtn.textContent = 'Enviar solicitud';
      }
    });

    // ── MOUSE EVENTS ─────────────────────────────────────────────────────────
    canvas.addEventListener('mousemove', e => {
      mouse.x =  (e.clientX / W()) * 2 - 1;
      mouse.y = -(e.clientY / H()) * 2 + 1;

      // Update hover-label position (cursor-following)
      unitLabelEl.style.left = (e.clientX + 16) + 'px';
      unitLabelEl.style.top  = (e.clientY - 8)  + 'px';

      if (isTransitioning) return;

      // ── Orbital: hover de pisos via ghost volumes + meshes de unidades ──
      if (mode === 'orbital' && ghostMeshes.length) {
        raycaster.setFromCamera(mouse, camera);
        const ghostHit = raycaster.intersectObjects(ghostMeshes.filter(Boolean), false)[0];
        let fi = ghostHit ? ghostHit.object.userData.floorIndex : null;

        // Si no hay ghost hit, intentar con meshes de unidades
        if (fi === null && meshToFloor.size) {
          unitRaycaster.setFromCamera(mouse, camera);
          const allUnitMeshes = floorGroups.flatMap(fg => fg.units?.flatMap(u => u.items) ?? []);
          const unitHit = unitRaycaster.intersectObjects(allUnitMeshes, false)[0];
          if (unitHit) fi = meshToFloor.get(unitHit.object) ?? null;
        }

        if (fi !== hoveredFloorIdx) {
          if (hoveredFloorIdx !== null) { setGhostHover(hoveredFloorIdx, false); clearFloor3DHover(hoveredFloorIdx); clearFloorHighlight(); }
          hoveredFloorIdx = fi;
          if (fi !== null) { setGhostHover(fi, true); highlightFloor3D(fi); highlightFloorItem(fi); canvas.style.cursor = 'pointer'; }
          else canvas.style.cursor = 'grab';
        }
        unitLabelEl.classList.remove('visible');
      }

      // ── Floor / Unit: hover de unidades ──
      if ((mode === 'floor' || mode === 'unit') && selectedFloor !== null && !panelOpen) {
        const fg = floorGroups[selectedFloor];
        if (!fg.units?.length) return;

        unitRaycaster.setFromCamera(mouse, camera);
        const allUnitMeshes = fg.units.flatMap(u => u.items);
        const hit     = unitRaycaster.intersectObjects(allUnitMeshes, false)[0];
        const newUnit = hit ? fg.meshToUnit.get(hit.object) ?? null : null;

        if (newUnit !== hoveredUnit) {
          if (hoveredUnit && hoveredUnit !== selectedUnit)
            hoveredUnit.items.forEach(m => { m.material = matReposo(hoveredUnit); });
          hoveredUnit = newUnit;
          if (newUnit && newUnit !== selectedUnit) {
            const _e = unitDispo(newUnit)?.estado ?? 'disponible';
            const _m = _e === 'disponible' ? MAT_UNIT_HOVER
                     : _e === 'apartada'   ? MAT_UNIT_APARTADA
                     : MAT_BASE;
            newUnit.items.forEach(m => { m.material = _m; });
          }
          canvas.style.cursor = newUnit ? 'pointer' : 'grab';
        }

        if (hoveredUnit && mode !== 'unit') {
          const d = unitDispo(hoveredUnit);
          labelId.textContent     = `${floorGroups[selectedFloor].label} / ${hoveredUnit.label}`;
          labelStatus.textContent = estadoLabel(d);
          labelStatus.className   = 'unit-label-status' + ((d?.estado ?? 'disponible') === 'disponible' ? ' disponible' : '');
          unitLabelEl.classList.add('visible');
        } else {
          unitLabelEl.classList.remove('visible');
        }
      }
    });

    canvas.addEventListener('mouseleave', () => {
      if (hoveredFloorIdx !== null) {
        setGhostHover(hoveredFloorIdx, false);
        clearFloor3DHover(hoveredFloorIdx);
        clearFloorHighlight();
        hoveredFloorIdx = null;
      }
      if (hoveredUnit && hoveredUnit !== selectedUnit)
        hoveredUnit.items.forEach(m => { m.material = MAT_BASE; });
      hoveredUnit = null;
      unitLabelEl.classList.remove('visible');
      canvas.style.cursor = 'grab';
    });

    // Distinguir click real de fin-de-drag
    let mouseDownPos = { x: 0, y: 0 };
    let wasDragging  = false;
    const DRAG_THRESHOLD = 5;
    canvas.addEventListener('mousedown', e => { mouseDownPos = {x: e.clientX, y: e.clientY}; wasDragging = false; });
    canvas.addEventListener('mousemove', e => {
      if (e.buttons === 1) {
        const dx = e.clientX - mouseDownPos.x;
        const dy = e.clientY - mouseDownPos.y;
        if (Math.hypot(dx, dy) > DRAG_THRESHOLD) wasDragging = true;
      }
    });
    canvas.addEventListener('click', () => {
      if (wasDragging || isTransitioning || panelOpen) return;
      if (mode === 'orbital' && hoveredFloorIdx !== null) {
        selectFloor(hoveredFloorIdx);
      } else if ((mode === 'floor' || mode === 'unit') && hoveredUnit !== null && hoveredUnit !== selectedUnit) {
        if ((unitDispo(hoveredUnit)?.estado ?? 'disponible') === 'vendida') return;
        selectUnit(hoveredUnit);
      } else if (mode === 'floor' && hoveredUnit === null && hoveredFloorIdx === null) {
        returnToOrbital();
      } else if (mode === 'unit' && hoveredUnit === null) {
        returnToFloor();
      }
    });
    canvas.style.cursor = 'grab';

    // Back button
    document.getElementById('back-btn').addEventListener('click', () => {
      if (mode === 'unit')  returnToFloor();
      else                  returnToOrbital();
    });

    // ── RENDER LOOP ───────────────────────────────────────────────────────────
    const _catVec = new THREE.Vector3();
    (function render() {
      requestAnimationFrame(render);
      controls.update();

      // Dimmer — anima toneMappingExposure de dimFrom → 1.0
      // papel (desde 2.5): ease-in, se asienta lento. grafito (desde 0.25): ease-out, enciende rápido.
      if (dimmerStart !== null) {
        const dt = Math.min((performance.now() - dimmerStart) / DIMMER_MS, 1);
        const e  = dimFrom > 1 ? dt * dt : 1 - Math.pow(1 - dt, 3);
        renderer.toneMappingExposure = dimFrom + (1.0 - dimFrom) * e;
        if (dt >= 1) { renderer.toneMappingExposure = 1.0; dimmerStart = null; }
      }

      composer.render();

      // Proyectar íconos CAT a pantalla
      const showCats = mode === 'unit' && selectedUnit !== null;
      catNodes.forEach(cat => {
        const isOwn = cat.unitId === selectedUnit?.id;
        if (!showCats || !isOwn) {
          cat.el.classList.remove('visible');
          return;
        }
        _catVec.copy(cat.worldPos).project(camera);
        if (_catVec.z > 1) { cat.el.classList.remove('visible'); return; }
        const x = ( _catVec.x * 0.5 + 0.5) * W();
        const y = (-_catVec.y * 0.5 + 0.5) * H();
        cat.el.style.left = x + 'px';
        cat.el.style.top  = y + 'px';
        cat.el.classList.add('visible');
      });

      // Proyectar etiquetas de tipología (solo en vista por nivel, tras el tween)
      const showTags = mode === 'floor' && !isTransitioning;
      unitTagEntries.forEach(t => {
        if (!showTags) { t.el.classList.remove('on'); return; }
        _catVec.copy(t.centro).project(camera);
        if (_catVec.z > 1) { t.el.classList.remove('on'); return; }
        t.el.style.left = (( _catVec.x * 0.5 + 0.5) * W()) + 'px';
        t.el.style.top  = ((-_catVec.y * 0.5 + 0.5) * H()) + 'px';
        t.el.classList.add('on');
      });
    })();

    // ── RESIZE ────────────────────────────────────────────────────────────────
    let lastAspect = W() / H();
    window.addEventListener('resize', () => {
      const newAspect = W() / H();
      // Cambio de aspecto significativo = rotación / redimensionado real. Los
      // micro-cambios (barra de URL móvil que altera solo la altura) quedan por
      // debajo del umbral y no mueven la cámara.
      const aspectChanged = Math.abs(newAspect - lastAspect) > 0.05;
      lastAspect = newAspect;
      camera.aspect = newAspect;
      camera.updateProjectionMatrix();
      renderer.setSize(W(), H());
      composer.setSize(W(), H());
      // Re-encuadrar la torre con el aspecto/margen actuales. Solo en vista
      // orbital, sin transición en curso.
      if (aspectChanged && mode === 'orbital' && !isTransitioning) frameOrbital();
    });

    // ── LOAD ─────────────────────────────────────────────────────────────────
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingBar     = document.getElementById('loading-bar');
    const loStartTime    = performance.now();

    async function init() {
      // 1. Load disponibilidad (non-blocking — continues even if missing)
      await loadDisponibilidad();

      // 2. Load floor labels JSON
      const floorData = await fetch(OWN.floors.data).then(r => r.json());
      const labelMap  = new Map();
      floorData.floors.forEach(fd => labelMap.set(fd.nodeName, fd.label));

      // 3. Load GLB
      const gltf = await new Promise((resolve, reject) => {
        new GLTFLoader().load(
          `${OWN.model.src}?v=${OWN.model.version}`,
          resolve,
          xhr => {
            if (xhr.lengthComputable)
              loadingBar.style.width = ((xhr.loaded / xhr.total) * 90) + '%';
          },
          reject
        );
      });

      const model = gltf.scene;
      glbModel = model;
      scene.add(model);
      model.updateMatrixWorld(true);


      // 4. Find floor group nodes (Floor-01 … Floor-10, Floor-Azotea)
      const floorNodeMap = new Map();
      model.traverse(obj => {
        if (!obj.isMesh && obj.name && /^Floor-/.test(obj.name))
          floorNodeMap.set(obj.name, obj);
      });

      const sortedNames = [...floorNodeMap.keys()].sort((a, b) => {
        const na = a.replace('Floor-', '');
        const nb = b.replace('Floor-', '');
        const ia = /^\d+$/.test(na) ? parseInt(na) : 999;
        const ib = /^\d+$/.test(nb) ? parseInt(nb) : 999;
        return ia - ib;
      });

      // 5. Build floor groups + materials + edge lines
      floorGroups = sortedNames.map(nodeName => {
        const floorObj = floorNodeMap.get(nodeName);
        const items    = [];
        floorObj.traverse(obj => {
          if (!obj.isMesh) return;
          obj.material = MAT_BASE;
          const edges = new THREE.EdgesGeometry(obj.geometry, 15);
          obj.add(new THREE.LineSegments(edges, MAT_EDGE));
          items.push(obj);
        });
        const label = labelMap.get(nodeName) || nodeName.replace('Floor-', 'N');
        if (label === 'Azotea') { azoteaItems = items; return null; }
        // N01 (planta baja) ahora es un piso navegable: aloja los LOCALES vendibles.
        // Como es el índice 0, la lógica "≤ activeIdx" lo mantiene visible como base.
        return { label, nodeName, items, y_center: 0 };
      }).filter(Boolean);

      // 6. Discover units by client nomenclature and associate to floors.
      //    El nombre del nodo GLB ES la etiqueta del cliente: "201".."1002" y "LOCAL 1..3".
      //    El nivel se deriva del label (201→2, 1001→10, LOCAL→1).
      const unitsByFloor = new Map();
      const seenUnits = new Set();
      model.traverse(obj => {
        const name = (obj.name || '').trim();
        const isNumUnit = /^\d{3,4}$/.test(name);
        // Solo el nodo padre del local ("LOCAL 1"/"LOCAL_1"), no sus mesh-hijos ("LOCAL_1_2")
        const isLocal   = /^local[\s_]*\d+$/i.test(name);
        if ((!isNumUnit && !isLocal) || seenUnits.has(name)) return;
        seenUnits.add(name);
        const nivel    = isLocal ? 1 : Math.floor(parseInt(name, 10) / 100);
        const floorLbl = 'N' + String(nivel).padStart(2, '0');
        const items = [];
        obj.traverse(child => {          // incluye obj si es Mesh, o sus mesh-hijos si es Group
          if (!child.isMesh) return;
          child.material = MAT_BASE;
          child.add(new THREE.LineSegments(new THREE.EdgesGeometry(child.geometry, 15), MAT_EDGE));
          items.push(child);
        });
        if (!items.length) return;
        // Etiqueta del cliente (Supabase) tiene prioridad; si no, limpia el nombre saneado
        const unitLbl = disponibilidad[normId(name)]?.etiqueta || name.replace(/_/g, ' ');
        if (!unitsByFloor.has(floorLbl)) unitsByFloor.set(floorLbl, []);
        unitsByFloor.get(floorLbl).push({ id: name, label: unitLbl, items });
      });

      meshToFloor = new Map();
      floorGroups.forEach((fg, fi) => {
        fg.units = (unitsByFloor.get(fg.label) || []).sort((a, b) => a.id.localeCompare(b.id));
        fg.meshToUnit = new Map();
        fg.units.forEach(u => u.items.forEach(m => {
          fg.meshToUnit.set(m, u);
          meshToFloor.set(m, fi);   // lookup global: mesh → índice de piso
        }));
      });

      // 6b. Meshes sueltos (Terraza, remates de azotea…) que no cayeron en un piso
      //     ni unidad: sin esto conservan el material oscuro del GLB y se ven negros.
      //     Se les da MAT_BASE y se agrupan con la azotea (visibles en órbita,
      //     ocultos al entrar a un piso inferior).
      const strayMeshes = [];
      model.traverse(obj => { if (obj.isMesh && obj.material !== MAT_BASE) strayMeshes.push(obj); });
      strayMeshes.forEach(mesh => {
        mesh.material = MAT_BASE;
        mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 15), MAT_EDGE));
        azoteaItems.push(mesh);
      });

      // 6c. Terraza: meshes cuyo nodo (o algún ancestro) se llama "Terraza".
      //     Se aíslan en su propio grupo para mantenerla visible al entrar a un
      //     piso (no se corta con la azotea).
      model.traverse(obj => {
        if (!obj.isMesh) return;
        for (let p = obj; p; p = p.parent) {
          if (p.name && /terraza/i.test(p.name)) { terrazaItems.push(obj); break; }
        }
      });

      // 7. Camera auto-fit
      const box = new THREE.Box3().setFromObject(model);
      modelCenter = box.getCenter(new THREE.Vector3());
      const size  = box.getSize(new THREE.Vector3());
      modelMaxDim = Math.max(size.x, size.y, size.z);
      camera.near = modelMaxDim * 0.001;
      camera.far  = modelMaxDim * 40;
      controls.minDistance = modelMaxDim * 0.05;
      // Suficiente para el encuadre alejado de retrato (margen hasta 3.0) sin
      // recortar la cámara; antes era *5 y clampeaba el fit en móvil.
      controls.maxDistance = modelMaxDim * 30;
      frameOrbital();   // encuadra con el viewport real (aspecto + margen)

      // 8. Calibrate SSAO to model scale — kernel corto y rango apretado:
      // oclusión solo en esquinas y contactos, sin halos ni copias fantasma
      ssaoPass.kernelRadius = Math.max(1.5, modelMaxDim * 0.002);
      ssaoPass.minDistance  = modelMaxDim * 0.0002;
      ssaoPass.maxDistance  = modelMaxDim * 0.002;

      // 9. Ghost volumes
      buildGhostVolumes();

      // 10. CAT nodes
      model.traverse(obj => {
        const rawName = obj.name.replace(/^Obj_/, ''); // quitar prefijo Obj_ si existe
        if (!rawName.startsWith('CAT-')) return;
        const parts  = rawName.replace(/_\d+$/, '').split('-'); // quitar sufijo _1, _2, etc.
        const unitId = parts.slice(1, 4).join('-');   // 'Unit-10-02'
        const worldPos = new THREE.Vector3();
        obj.getWorldPosition(worldPos);
        const el = document.createElement('div');
        el.className  = 'cat-icon';
        el.title      = obj.name;
        document.body.appendChild(el);
        el.addEventListener('click', () => openPanorama(obj.name));
        catNodes.push({ name: obj.name, unitId, worldPos, el });
      });

      // 11. Floor list UI
      buildFloorList();
      loadingBar.style.width = '100%';

      const minShow = reducedMotion ? 600 : 4200;
      const elapsed = performance.now() - loStartTime;
      const delay   = Math.max(300, minShow - elapsed);
      setTimeout(() => {
        frameOrbital();   // re-encuadre con el viewport ya definitivo (corrige carreras de carga)
        container.classList.add('visible');         // canvas empieza a emerger
        if (reducedMotion) {
          renderer.toneMappingExposure = 1.0;
        } else {
          dimmerStart = performance.now();
        }
        setTimeout(() => {
          loadingOverlay.classList.add('hidden');   // texto escala y se disuelve 200ms después
        }, reducedMotion ? 0 : 200);
        // Intro: presentación guiada si la ficha la trae activa; si no, cascada de niveles
        const prezCfg    = OWN.presentacion;
        const prezActiva = !!(prezCfg && prezCfg.enabled !== false && (prezCfg.pasos || []).length);
        if (prezActiva) {
          // La presentación ES la intro: la lista de pisos se revela junta, sin cascada.
          // Arranca JUNTO con el giro (no al final): corre durante toda la rotación
          // mientras la escena aclara con el dimmer. Coexiste con la órbita sin conflicto.
          document.querySelectorAll('#floor-list .floor-item')
            .forEach(it => it.classList.add('revealed'));
          setTimeout(() => initPrez(prezCfg), reducedMotion ? 0 : 300);
        } else {
          setTimeout(runFloorCascade, reducedMotion ? 0 : DIMMER_MS + 100);
        }
        if (!reducedMotion) {
          controls.autoRotate      = true;
          controls.autoRotateSpeed = OWN.camera.autoRotateSpeed;
          setTimeout(() => { controls.autoRotate = false; }, OWN.camera.autoRotateDelayMs);
        }
        refreshInfoBtn();   // botón info visible desde la vista general (si hay info de proyecto)
      }, delay);
    }

    // ── PANORAMA ─────────────────────────────────────────────────────────────
    const panoOverlay = document.getElementById('pano-overlay');
    const panoClose   = document.getElementById('pano-close');
    const panoLabel   = document.getElementById('pano-label');
    let   panoViewer  = null;

    function openPanorama(nodeName) {
      const raw  = nodeName.replace(/^Obj_/, '').replace(/_\d+$/, '');
      const tipo = raw.split('-').pop().toLowerCase();    // 'CAT-Unit-10-02B' → '02b'
      const url  = OWN.panoramas.pattern.replace('{tipo}', tipo);

      panoLabel.textContent = OWN.copy.panoramaLabel.replace('{t}', tipo.toUpperCase());
      panoOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';

      if (panoViewer) { panoViewer.destroy(); panoViewer = null; }
      panoViewer = pannellum.viewer('pano-viewer', {
        type:        'equirectangular',
        panorama:    url,
        autoLoad:    true,
        showControls: false,
        compass:     false,
        mouseZoom:   true,
        hfov:        OWN.panoramas.hfov,
      });
    }

    function closePanorama() {
      panoOverlay.classList.remove('open');
      document.body.style.overflow = '';
      if (panoViewer) {
        setTimeout(() => { panoViewer.destroy(); panoViewer = null; }, 400);
      }
    }

    panoClose.addEventListener('click', closePanorama);
    panoOverlay.addEventListener('keydown', e => { if (e.key === 'Escape') closePanorama(); });

    /* =====================================================
       PRESENTACIÓN GUIADA — pasos desde la ficha
       (pages.ownership.presentacion, editable en el panel).
       highlight = selectores por nombre separados por coma:
         "N03" / "Floor-03"   → un piso completo
         "Unit-*-02B"         → una tipología (el * no cruza guiones)
         "Azotea"             → la azotea
         "Planta-Baja" / "N01"→ la planta baja comercial
         "@disponibles"       → todas las unidades con estado disponible (de la base)
         "Nombre-De-Capa"     → cualquier nodo nombrado del GLB
         "none" | "nada" | "todo" → sin resaltado
       Tocar piso/unidad la retira; el botón ▶ la retoma.
    ===================================================== */
    function prezResolveSelector(sel) {
      const meshes = [];
      const push = arr => (arr || []).forEach(m => { if (m && m.isMesh) meshes.push(m); });
      const escapa = t => t.replace(/[.+^${}()|[\]\\]/g, '\\$&');
      String(sel || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean).forEach(t => {
        if (t === 'none' || t === 'nada' || t === 'todo') return;
        let hit = false;
        // pisos por label (N03) o nombre de nodo (Floor-03)
        floorGroups.forEach(fg => {
          if (fg.label.toLowerCase() === t || (fg.nodeName || '').toLowerCase() === t) {
            push(fg.items);
            (fg.units || []).forEach(u => push(u.items));
            hit = true;
          }
        });
        if (t === 'azotea' || t === 'floor-azotea') { push(azoteaItems); hit = true; }
        if (t === 'planta-baja' || t === 'plantabaja') {
          const pb = floorGroups.find(fg => fg.label.toLowerCase() === 'n01');
          if (pb) { push(pb.items); (pb.units || []).forEach(u => push(u.items)); hit = true; }
        }
        // unidades por patrón: unit-*-02b — por nombre de nodo (Unit-{nivel}-{tipo})
        // O por la tipología del dato (disponibilidad), porque en proyectos como
        // Nashira los nodos se llaman por etiqueta de cliente ("201", "LOCAL 1")
        // y la tipología solo vive en Supabase (tipo / tipologia).
        if (t.startsWith('unit-')) {
          const re      = new RegExp('^' + escapa(t).replace(/\*/g, '[^-]*') + '$', 'i');
          const tipoSel = t.split('-').pop();   // '02b' — la tipología pedida
          floorGroups.forEach(fg => (fg.units || []).forEach(u => {
            const d = disponibilidad[normId(u.id)];
            const porNombre = re.test(u.id);
            const porDato   = d && (
              String(d.tipo || '').toLowerCase()      === tipoSel ||
              String(d.tipologia || '').toLowerCase() === tipoSel
            );
            if (porNombre || porDato) { push(u.items); hit = true; }
          }));
        }
        // "@disponibles" → todas las unidades marcadas como disponibles en la base
        // (sin importar piso ni tipología). Se encienden en el acento del panel, igual
        // que el resto del resalte. Missing = disponible (convención del resto del app).
        if (t === '@disponibles' || t === 'disponibles') {
          floorGroups.forEach(fg => (fg.units || []).forEach(u => {
            const d = disponibilidad[normId(u.id)];
            if ((d?.estado ?? 'disponible') === 'disponible') push(u.items);
          }));
          hit = true;
        }
        // cualquier nodo del GLB con ese nombre (capas futuras: Terraza, Alberca…)
        if (!hit && glbModel) {
          const re = new RegExp('^' + escapa(t).replace(/\*/g, '.*') + '$', 'i');
          glbModel.traverse(o => {
            if (o.name && re.test(o.name.replace(/^Obj_/, '').replace(/_\d+$/, ''))) {
              o.traverse(c => { if (c.isMesh) meshes.push(c); });
            }
          });
        }
      });
      return meshes;
    }

    function initPrez(cfg) {
      const steps = cfg.pasos || [];
      if (!steps.length) return;

      const overlay = document.getElementById('prez-overlay');
      const pill    = document.getElementById('prez-pill');
      const counter = document.getElementById('prez-counter');
      const btnPrev = document.getElementById('prez-prev');
      const btnNext = document.getElementById('prez-next');
      const resume  = document.getElementById('prez-resume');
      let cur = 0, active = false;

      function setMaterialsBase() {
        floorGroups.forEach(fg => {
          fg.items.forEach(m => { m.material = MAT_BASE; });
          (fg.units || []).forEach(u => u.items.forEach(m => { m.material = MAT_BASE; }));
        });
        azoteaItems.forEach(m => { m.material = MAT_BASE; });
        plantaBajaItems.forEach(m => { m.material = MAT_BASE; });
      }

      function applyHighlight(sel) {
        prezHighlightOn = false;          // permite pintar base sin bloqueo
        setMaterialsBase();
        const meshes = prezResolveSelector(sel);
        prezHighlightOn = meshes.length > 0;
        meshes.forEach(m => { m.material = MAT_UNIT_SEL; });
      }

      // Formato ligero para el texto de la ficha: escapa HTML (seguro) y traduce
      // **negrita**, *cursiva*. Los saltos de línea los respeta el CSS (pre-line).
      function fmtTexto(raw) {
        return String(raw)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
      }

      function renderStep(i) {
        cur = i;
        const s = steps[i];
        const num = s.num || String(i + 1).padStart(2, '0');
        // Colores homologados (una elección por tipo de campo aplica a todos los pasos)
        const TC = window.SITE.textColors || {};
        const P  = 'pages.ownership.presentacion.pasos.';
        const sty = k => TC[k] ? ` style="color:${TC[k]}"` : '';
        overlay.innerHTML =
          '<div class="prez-text">' +
          `<div class="prez-num"${sty(P + 'label')}>${num} · ${s.label || ''}</div>` +
          (s.kpi ? `<div class="prez-kpi"${sty(P + 'kpi')}>${s.kpi}</div>` : '') +
          (s.caption ? `<div class="prez-caption"${sty(P + 'caption')}>${s.caption}</div>` : '') +
          (s.body ? `<p class="prez-body"${sty(P + 'body')}>${fmtTexto(s.body)}</p>` : '') +
          '</div>';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const t = overlay.firstElementChild;
          if (t) t.classList.add('in');
        }));
        counter.textContent = `${i + 1} / ${steps.length}`;
        btnPrev.disabled = i === 0;
        btnNext.disabled = i === steps.length - 1;
        applyHighlight(s.highlight || 'none');
      }

      function enter() {
        active = true;
        overlay.classList.add('visible');
        pill.classList.add('visible');
        resume.classList.remove('visible');
        renderStep(cur);
      }
      function exit() {
        if (!active) return;
        active = false;
        prezHighlightOn = false;
        setMaterialsBase();
        overlay.classList.remove('visible');
        pill.classList.remove('visible');
        resume.classList.add('visible');
      }

      btnPrev.addEventListener('click', () => { if (cur > 0) renderStep(cur - 1); });
      btnNext.addEventListener('click', () => { if (cur < steps.length - 1) renderStep(cur + 1); });
      // Retomar la presentación: si estás dentro de un piso o unidad, la vista
      // vuelve primero a la general del proyecto (orbital) y ahí arranca.
      resume.addEventListener('click', () => {
        if (mode === 'orbital') enter();
        else returnToOrbital(enter);
      });

      // Convive con la órbita y el zoom; se retira al seleccionar piso/unidad
      prezExitHook = exit;

      if (cfg.autoStart !== false) enter();
      else resume.classList.add('visible');
    }

    init().catch(err => {
      const lbl = document.querySelector('#loading-overlay .lo-quote');
      if (lbl) lbl.textContent = 'Error al cargar: ' + err.message;
      console.error(err);
    });
  </script>

  <!-- ── PRESENTACIÓN GUIADA ───────────────────────────────────────────────
       Pasos desde la ficha (pages.ownership.presentacion, editable en el
       panel). Cada paso ilumina piezas del modelo vía selectores por nombre. -->
  <div id="prez-overlay" aria-live="polite"></div>
  <div id="prez-pill" aria-label="Navegación de la presentación">
    <button class="pill-btn" id="prez-prev" aria-label="Paso anterior">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="prez-counter">1 / 1</span>
    <button class="pill-btn" id="prez-next" aria-label="Paso siguiente">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <button id="prez-resume" aria-label="Retomar presentación">▶ Presentación</button>

  <!-- ── PANORAMA OVERLAY ─────────────────────────────────────────────────── -->

    <div id="pano-viewer"></div>
    <button id="pano-close" aria-label="Cerrar panorama">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <span id="pano-label">Vista 360°</span>
  </div>
