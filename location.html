<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#24262b">
  <link rel="apple-touch-icon" href="content/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nashira">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Nashira · Location</title>
  <meta name="description" content="Nashira. El entorno del proyecto: avenidas, servicios y todo lo que está a minutos.">
  <link rel="icon" type="image/svg+xml" href="content/brand/favicon.svg">
  <!-- Ficha del proyecto — SIEMPRE el primer script (los motores leen window.SITE) -->
  <script src="site.js?v=0d6e79f5"></script>
  <script src="theme.js?v=60b6e933"></script>
  <meta property="og:title" content="Nashira · Location">
  <meta property="og:description" content="Nashira. El entorno del proyecto: avenidas, servicios y todo lo que está a minutos.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="content/images/sequence/frame_000.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* papel (default) */
      --bg:           oklch(94% 0.010  85);
      --text:         oklch(24% 0.006  85);
      --muted:        oklch(52% 0.008  85);
      --label:        oklch(44% 0.008  85);
      --accent:       #ab4e30;
      --border:       oklch(85% 0.008  85);
      --glass-bg:     oklch(97% 0.006  85 / 0.82);
      --glass-border: oklch(78% 0.010  85 / 0.55);
      --poi:          oklch(36% 0.01   85);
      --poi-fill:     oklch(90% 0.008  85);
      --font-display: 'Big Shoulders Display', 'Arial Black', system-ui, sans-serif;
      --font-body:    'Barlow', system-ui, -apple-system, sans-serif;
      /* filtro de tiles: empuja el gris de CARTO hacia el hueso cálido del papel */
      --tile-filter:  saturate(0.55) brightness(1.04) contrast(0.94) sepia(0.10);
    }
    html[data-theme='grafito'] {
      --bg:           oklch(18% 0.008 250);
      --text:         oklch(93% 0.005 250);
      --muted:        oklch(52% 0.01  250);
      --label:        oklch(62% 0.01  250);
      --border:       oklch(26% 0.01  250);
      --glass-bg:     oklch(22% 0.01  250 / 0.80);
      --glass-border: oklch(34% 0.012 250 / 0.55);
      --poi:          oklch(82% 0.006 250);
      --poi-fill:     oklch(26% 0.01  250);
      --tile-filter:  saturate(0.7) brightness(0.96) contrast(1.0) hue-rotate(8deg);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── MAPA ── */
    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: var(--bg);
      opacity: 0;
      transition: opacity 1.4s ease-out;
    }
    #map.ready { opacity: 1; }
    .leaflet-tile-pane { filter: var(--tile-filter); transition: filter 0.5s; }
    .leaflet-container { background: var(--bg); font-family: var(--font-body); }
    .leaflet-control-attribution {
      background: var(--glass-bg) !important;
      color: var(--muted) !important;
      font-size: 0.5rem !important;
      letter-spacing: 0.02em;
      backdrop-filter: blur(6px);
    }
    .leaflet-control-attribution a { color: var(--muted) !important; }
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: none !important;
    }
    .leaflet-control-zoom a {
      background: var(--glass-bg) !important;
      color: var(--muted) !important;
      border: 1px solid var(--glass-border) !important;
      width: 30px; height: 30px; line-height: 30px;
      backdrop-filter: blur(8px);
      transition: color 0.2s;
    }
    .leaflet-control-zoom a:hover { color: var(--text) !important; }

    /* ── MARCADORES ── */
    .mk { display: flex; align-items: center; justify-content: center; }

    .mk-proyecto {
      width: 22px; height: 22px;
      position: relative;
    }
    .mk-proyecto .core {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px oklch(54.8% 0.157 35.7 / 0.22);
    }
    .mk-proyecto .pulse {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      animation: pulse 2.6s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .mk-poi {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--poi-fill);
      border: 2px solid var(--poi);
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }
    .mk-poi:hover { transform: scale(1.4); }
    .mk-poi.hl { transform: scale(1.7); background: var(--accent); border-color: var(--accent); }

    /* anillo de distancia caminable (radio configurable) */
    .ring-radio {
      stroke: var(--accent);
      stroke-width: 1.25;
      stroke-opacity: 0.5;
      stroke-dasharray: 3 5;
      fill: var(--accent);
      fill-opacity: 0.035;
    }
    .ring-label {
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.75;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 6px var(--bg);
    }

    /* etiquetas de vías — solo las avenidas curadas */
    .mk-via {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      pointer-events: none;
      text-shadow:
        0 0 3px var(--bg), 0 0 3px var(--bg),
        0 0 6px var(--bg), 0 0 6px var(--bg);
      opacity: 0.9;
    }

    /* tooltips */
    .leaflet-tooltip.tt {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 6px;
      padding: 4px 9px;
      box-shadow: 0 4px 16px oklch(24% 0.006 85 / 0.12);
      backdrop-filter: blur(10px);
    }
    .leaflet-tooltip.tt::before { display: none; }
    .leaflet-tooltip.tt .tt-dist {
      color: var(--accent); font-weight: 700; margin-left: 6px;
    }
    .leaflet-tooltip.tt-proyecto {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 6px 13px;
    }

    /* ── PANEL ── */
    .loc-panel {
      position: fixed;
      top: 88px;
      left: 28px;
      z-index: 40;
      width: 320px;
      max-width: calc(100vw - 56px);
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      padding: 24px 24px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: 0 10px 40px oklch(24% 0.006 85 / 0.10);
    }
    html[data-theme='grafito'] .loc-panel { box-shadow: 0 10px 40px oklch(0% 0.008 250 / 0.4); }

    .loc-label {
      font-size: 0.5625rem; font-weight: 600; letter-spacing: 0.22em;
      color: var(--label); text-transform: uppercase;
    }
    .loc-heading {
      font-family: var(--font-display);
      font-size: 2.4rem; font-weight: 700; line-height: 1;
      letter-spacing: 0.02em; text-transform: uppercase;
      color: var(--text); margin: 8px 0 14px;
    }
    .loc-narrativa {
      font-size: 0.8125rem; line-height: 1.6; color: var(--muted);
      margin-bottom: 20px;
    }

    .loc-cats-title {
      font-size: 0.5625rem; font-weight: 600; letter-spacing: 0.16em;
      color: var(--label); text-transform: uppercase;
      padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
    }
    .loc-cat {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 2px; cursor: pointer; user-select: none;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.2s;
    }
    .loc-cat:last-child { border-bottom: none; }
    .loc-cat .cat-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--poi-fill); border: 2px solid var(--poi);
      flex-shrink: 0; transition: transform 0.15s;
    }
    .loc-cat .cat-name {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em;
      color: var(--text); flex: 1;
    }
    .loc-cat .cat-count {
      font-size: 0.6875rem; font-weight: 600; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .loc-cat:hover .cat-name { color: var(--accent); }
    .loc-cat:hover .cat-dot  { transform: scale(1.3); }
    .loc-cat.off { opacity: 0.4; }
    .loc-cat.off .cat-name { text-decoration: line-through; }

    /* entrada */
    .loc-panel { opacity: 0; transform: translateY(10px); }
    .loc-panel.in { opacity: 1; transform: translateY(0); transition: opacity 0.9s ease-out 0.3s, transform 0.9s cubic-bezier(0.22,1,0.36,1) 0.3s; }

    /* botón info (CAT) y cierre — solo móvil */
    .loc-info, .loc-close { display: none; }
    .loc-info {
      position: fixed; top: 90px; left: 14px; z-index: 45;
      align-items: center; gap: 7px;
      padding: 9px 14px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      color: var(--text);
      font-family: var(--font-body); font-size: 0.5625rem; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
    }
    .loc-info .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .loc-close {
      position: absolute; top: 13px; right: 13px;
      width: 30px; height: 30px;
      align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1.05rem; line-height: 1;
    }
    .loc-close:hover { color: var(--text); }

    /* ── MÓVIL ── */
    @media (max-width: 767px) {
      .loc-panel {
        top: auto; bottom: 0; left: 0;
        width: 100%; max-width: 100%;
        max-height: 64vh;
        border-radius: 20px 20px 0 0;
        padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
        opacity: 1;                                       /* anula entrada desktop */
        transform: translateY(110%);                      /* oculto por defecto */
        transition: transform 0.42s cubic-bezier(0.22,1,0.36,1);
      }
      .loc-panel.open { transform: translateY(0); }
      .loc-info, .loc-close { display: flex; }
      .loc-heading { font-size: 1.9rem; }
    }
    /* ── Dirección del proyecto (ancla: siempre visible arriba) ────────── */
    #loc-direccion {
      position: fixed;
      top: 82px; left: 50%;   /* bajo la pastilla de navegación (móvil la sube a 14px) */
      transform: translateX(-50%);
      z-index: 40;
      display: flex; align-items: center; gap: 8px;
      max-width: calc(100vw - 28px);
      padding: 9px 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border-radius: 100px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.625rem; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      white-space: nowrap; overflow: hidden;
      animation: ld-in 0.9s cubic-bezier(0.22,1,0.36,1) 0.45s both;
    }
    #loc-direccion .ld-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 20%, transparent);
    }
    #loc-direccion .ld-text { overflow: hidden; text-overflow: ellipsis; }
    @keyframes ld-in {
      from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @media (max-width: 767px) {
      #loc-direccion { top: 14px; font-size: 0.5625rem; padding: 8px 14px; }
    }

    /* ── Control de radio (slider) ─────────────────────────────────────── */
    #radio-control {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border-radius: 100px;
    }
    #radio-control .radio-label {
      font-size: 0.5625rem; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted);
    }
    #radio-val {
      font-size: 0.6875rem; font-weight: 700; color: var(--accent);
      font-variant-numeric: tabular-nums; min-width: 50px; text-align: right;
    }
    #radio-slider {
      -webkit-appearance: none; appearance: none;
      width: 180px; height: 3px; border-radius: 3px;
      background: var(--glass-border); outline: none; cursor: pointer;
    }
    #radio-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
    }
    #radio-slider::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
    }
    #radio-slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    @media (max-width: 767px) {
      #radio-control { bottom: calc(78px + env(safe-area-inset-bottom)); padding: 8px 14px; gap: 8px; }
      #radio-slider { width: 130px; }
    }
    /* Vialidades principales: resaltado sólido en tinte claro (marcador) */
    .via-hl {
      stroke: oklch(72% 0.10 42) !important;
      stroke-opacity: 1 !important;
      stroke-width: 7px !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      fill: none !important;
    }

    /* ── Presentación de Location (película) ───────────────────────────── */
    #radio-control { transition: opacity 0.5s ease; }
    #radio-control.film-oculto { opacity: 0; pointer-events: none; }
    .film-pop .mk-poi { animation: poiPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes poiPop { from { transform: scale(0); } to { transform: scale(1); } }
    #loc-replay {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.95rem; line-height: 1;
      padding: 0 0 0 2px; transition: color 0.2s;
    }
    #loc-replay:hover { color: var(--text); }
    #loc-replay:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    /* ── ¿Cómo llegar?: ruta al proyecto ───────────────────────────────── */
    #ruta-abrir {
      background: none; border: none; cursor: pointer;
      color: var(--muted);
      font-family: var(--font-body); font-size: 0.5625rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0 2px; transition: color 0.2s; white-space: nowrap;
    }
    #ruta-abrir:hover { color: var(--text); }
    #ruta-abrir:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    #ruta-panel {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 35;
      width: min(400px, calc(100vw - 32px));
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-radius: 14px;
      padding: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #ruta-panel.abierto { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    #ruta-panel .ruta-fila { display: flex; gap: 8px; align-items: center; }
    #ruta-input {
      flex: 1;
      background: oklch(from var(--bg) l c h / 0.55);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-body); font-size: 0.8125rem;
      padding: 8px 11px;
      min-width: 0;
    }
    #ruta-input:focus { outline: none; border-color: var(--accent); }
    #ruta-input::placeholder { color: var(--muted); }
    .ruta-perfil {
      background: none; border: 1px solid var(--glass-border); border-radius: 8px;
      color: var(--muted); cursor: pointer;
      font-family: var(--font-body); font-size: 0.5625rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 8px 10px; transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .ruta-perfil.activo { color: var(--accent); border-color: var(--accent); }
    #ruta-cerrar {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1rem; line-height: 1; padding: 4px;
      flex-shrink: 0; transition: color 0.15s;
    }
    #ruta-cerrar:hover { color: var(--text); }
    #ruta-msg {
      font-size: 0.6875rem; color: var(--muted);
      margin-top: 9px; line-height: 1.5;
    }
    #ruta-msg .ruta-dato { color: var(--accent); font-weight: 700; }
    #ruta-msg a {
      color: var(--muted); font-weight: 600; text-decoration: underline;
      text-underline-offset: 2px; transition: color 0.15s;
    }
    #ruta-msg a:hover { color: var(--text); }
    .ruta-linea {
      stroke: var(--accent);
      stroke-opacity: 0.85;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mk-origen {
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--bg); border: 3px solid var(--accent);
    }
    @media (max-width: 767px) {
      #ruta-panel { bottom: calc(126px + env(safe-area-inset-bottom)); }
    }

    /* ── Índice de POIs: etiquetas a la izquierda + líneas guía ────────── */
    #poi-indice {
      position: fixed;
      left: 128px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-width: 210px;
      pointer-events: none;
    }
    .pindex-item {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.35;
      color: var(--text);
      text-shadow:
        0 0 3px var(--bg), 0 0 3px var(--bg),
        0 0 6px var(--bg), 0 0 6px var(--bg);
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .pindex-item.in { opacity: 0.92; transform: translateX(0); }
    .pindex-item.oculto { display: none; }
    .pindex-item { pointer-events: auto; cursor: pointer; }
    .pindex-item.hl { opacity: 1; color: var(--accent); }
    .pindex-dist { color: var(--accent); font-weight: 700; margin-left: 6px; }
    #poi-lineas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 24;
      pointer-events: none;
    }
    #poi-lineas line {
      stroke: var(--accent);
      stroke-width: 1;
      stroke-opacity: 0;
      transition: stroke-opacity 0.6s ease;
    }
    #poi-lineas line.in { stroke-opacity: 0.4; }
    #poi-lineas line.hl { stroke-opacity: 0.95; stroke-width: 2; }
    @media (max-width: 767px) {
      #poi-indice, #poi-lineas { display: none; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- ── DIRECCIÓN DEL PROYECTO (ancla de ubicación, siempre visible) ───── -->
  <div id="loc-direccion">
    <span class="ld-dot"></span>
    <span class="ld-text" data-site="brand.address"></span>
  </div>

  <!-- ── CONTROL DE RADIO ──────────────────────────────────────────────── -->
  <div id="radio-control">
    <span class="radio-label">Radio</span>
    <input id="radio-slider" type="range" min="250" max="1500" step="50" value="500"
           aria-label="Ajustar radio de puntos de interés">
    <span id="radio-val">500 m</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (async function () {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const root = document.documentElement;
      const isGrafito = () => root.dataset.theme === 'grafito';

      // ── Ficha del proyecto (site.json → window.SITE)
      const LOC = window.SITE.pages.location;

      // Dirección del proyecto arriba (site.js llena el data-site); si la ficha
      // no la trae, se oculta la pastilla en vez de dejarla vacía.
      if (!(window.SITE.brand && window.SITE.brand.address)) {
        const ld = document.getElementById('loc-direccion');
        if (ld) ld.style.display = 'none';
      }

      // ── Datos
      let data;
      try {
        data = await fetch(LOC.data).then(r => r.json());
      } catch (e) {
        return;
      }
      const P = data.proyecto;

      // La ficha viva manda en coordenadas si las trae (editable en el panel):
      // así un cambio de ubicación impacta el mapa sin regenerar el JSON.
      if (LOC.coords && LOC.coords.lat != null) {
        P.lat = LOC.coords.lat;
        P.lng = LOC.coords.lng;
        if (LOC.coords.zoom != null) P.zoom = LOC.coords.zoom;
      }

      // La ficha también manda en avenidas y puntos de interés si los trae
      // (migrados al panel); las vialidades (geometría pesada) siguen en el JSON.
      if (Array.isArray(LOC.vias) && LOC.vias.length) data.vias = LOC.vias;
      if (Array.isArray(LOC.categorias) && LOC.categorias.length) data.categorias = LOC.categorias;

      // ── Mapa
      const map = L.map('map', {
        center: [P.lat, P.lng],
        zoom: 15,
        zoomControl: false,
        attributionControl: true,
        scrollWheelZoom: true,
        zoomSnap: 0,   // permite zoom fraccional (proyecto.zoom puede ser 16.7)
      });
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      const TILES = {
        papel:   `https://{s}.basemaps.cartocdn.com/${LOC.tiles.papel}/{z}/{x}/{y}{r}.png`,
        grafito: `https://{s}.basemaps.cartocdn.com/${LOC.tiles.grafito}/{z}/{x}/{y}{r}.png`,
      };
      const ATTR = LOC.tiles.attribution;
      let tileLayer = L.tileLayer(TILES[isGrafito() ? 'grafito' : 'papel'],
        { attribution: ATTR, maxZoom: LOC.tiles.maxZoom, subdomains: 'abcd' }).addTo(map);

      // ── Marcador del proyecto
      const proyectoIcon = L.divIcon({
        className: '',
        html: '<div class="mk mk-proyecto"><span class="pulse"></span><span class="core"></span></div>',
        iconSize: [22, 22], iconAnchor: [11, 11],
      });
      const projMarker = L.marker([P.lat, P.lng], { icon: proyectoIcon, zIndexOffset: 1000 })
        .addTo(map)
        .bindTooltip(P.nombre, { permanent: true, direction: 'top', offset: [0, -12], className: 'tt tt-proyecto' });
      // Muestra/oculta el marcador del proyecto + su etiqueta (para la película)
      function projSet(visible, instante) {
        [projMarker.getElement(), projMarker.getTooltip() && projMarker.getTooltip().getElement()]
          .forEach(el => {
            if (!el) return;
            el.style.transition = instante ? 'none' : 'opacity 0.8s ease';
            el.style.opacity = visible ? '' : '0';
          });
      }

      // ── Radio dinámico + anillo (controlado por el slider) ─────────────
      const R_MIN  = P.radioMin  || 250;
      const R_MAX  = P.radioMax  || 1500;
      const R_STEP = P.radioStep || 50;
      let ringRadius = P.radioMax || 1500;   // Location abre en el radio máximo

      const ring = L.circle([P.lat, P.lng], {
        radius: ringRadius, className: 'ring-radio', interactive: false,
      }).addTo(map);
      const mkRingLabel = (r) => L.divIcon({
        className: '', html: `<span class="ring-label">${r} m</span>`,
        iconSize: [60, 12], iconAnchor: [30, 14],
      });
      const ringLabelMk = L.marker([P.lat + (ringRadius / 111320), P.lng], {
        icon: mkRingLabel(ringRadius), interactive: false, zIndexOffset: -100,
      }).addTo(map);

      // ── Equipamiento por categoría (cada POI guarda su distancia real) ──
      const poiIcon = L.divIcon({
        className: '', html: '<div class="mk mk-poi"></div>',
        iconSize: [11, 11], iconAnchor: [5.5, 5.5],
      });
      const toRad = d => d * Math.PI / 180;
      function distM(la, lo) {
        const Rm = 6371000;
        const dLa = toRad(la - P.lat), dLo = toRad(lo - P.lng);
        const x = Math.sin(dLa / 2) ** 2 + Math.cos(toRad(P.lat)) * Math.cos(toRad(la)) * Math.sin(dLo / 2) ** 2;
        return 2 * Rm * Math.asin(Math.sqrt(x));
      }
      const fmtDist = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1) + ' km';

      // ── Puntos de interés de Location — lista editable en el panel
      //    (pages.location.presentacion.puntos). Cada punto es autocontenido
      //    {nombre, categoria, lat, lng}; para fichas viejas las coords se
      //    completan desde el catálogo `categorias` por nombre.
      const _catCoords = {};
      (data.categorias || []).forEach(c => (c.puntos || []).forEach(pt => { _catCoords[pt.nombre] = pt; }));
      const LOC_PUNTOS = ((LOC.presentacion && LOC.presentacion.puntos) || [])
        .map(p => {
          const src = (p.lat != null && p.lng != null) ? p : (_catCoords[p.nombre] || {});
          return { nombre: p.nombre, categoria: p.categoria || '',
                   lat: src.lat, lng: src.lng, distancia: p.distancia || src.distancia || null };
        })
        .filter(p => p.lat != null && p.lng != null);

      const poiMarkers = [];
      LOC_PUNTOS.forEach(pt => {
        const m = L.marker([pt.lat, pt.lng], { icon: poiIcon });
        const d = distM(pt.lat, pt.lng);
        const distStr = pt.distancia || fmtDist(d);
        m.bindTooltip(`${pt.nombre}<span class="tt-dist">${distStr}</span>`,
          { direction: 'top', offset: [0, -8], className: 'tt' });
        poiMarkers.push({ m, d, nombre: pt.nombre, dist: distStr });
      });

      // ── Vialidades principales (OSM trunk/primary/secondary/tertiary),
      //    recortadas al radio: solo se resalta la parte dentro del círculo
      //    (marcador). updateRoads(r) recalcula al cambiar el radio.
      const MX = 111320 * Math.cos(P.lat * Math.PI / 180), MY = 110540;
      function clipRoad(coords, R) {
        const pts = coords.map(c => ({ x: (c[1] - P.lng) * MX, y: (c[0] - P.lat) * MY, lat: c[0], lng: c[1] }));
        const ins = p => (p.x * p.x + p.y * p.y) <= R * R;
        const interp = (a, b, t) => [a.lat + t * (b.lat - a.lat), a.lng + t * (b.lng - a.lng)];
        const tCross = (a, b) => {
          const dx = b.x - a.x, dy = b.y - a.y, A = dx * dx + dy * dy;
          if (A === 0) return [];
          const B = 2 * (a.x * dx + a.y * dy), C = a.x * a.x + a.y * a.y - R * R;
          const disc = B * B - 4 * A * C;
          if (disc <= 0) return [];
          const s = Math.sqrt(disc);
          return [(-B - s) / (2 * A), (-B + s) / (2 * A)].filter(t => t >= 0 && t <= 1).sort((p, q) => p - q);
        };
        const runs = []; let run = [];
        const flush = () => { if (run.length > 1) runs.push(run); run = []; };
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1], ai = ins(a), bi = ins(b);
          if (ai && bi) { if (!run.length) run.push([a.lat, a.lng]); run.push([b.lat, b.lng]); }
          else if (ai && !bi) { const ts = tCross(a, b); if (!run.length) run.push([a.lat, a.lng]); run.push(interp(a, b, ts.length ? ts[ts.length - 1] : 1)); flush(); }
          else if (!ai && bi) { const ts = tCross(a, b); flush(); run = [interp(a, b, ts.length ? ts[0] : 0), [b.lat, b.lng]]; }
          else { const ts = tCross(a, b); if (ts.length === 2) { flush(); runs.push([interp(a, b, ts[0]), interp(a, b, ts[1])]); } }
        }
        flush();
        return runs;
      }
      const roadLayer = L.layerGroup().addTo(map);
      const roadLines = (data.vialidades || []).map(v => {
        const pl = L.polyline([], { className: 'via-hl', interactive: false }).addTo(roadLayer);
        pl._coords = v.coords;
        pl._clase  = v.clase || 'secondary';   // jerarquía para la presentación
        return pl;
      });
      function updateRoads(r) { roadLines.forEach(pl => pl.setLatLngs(clipRoad(pl._coords, r))); }

      // ── Encuadrar el mapa al anillo: el círculo siempre llena la pantalla
      //    (radio grande → zoom out; radio chico → zoom in). El padding deja
      //    aire arriba (etiqueta) y abajo (slider + control de zoom).
      function fitToRadius() {
        map.fitBounds(ring.getBounds(), {
          paddingTopLeft: [40, 56],
          paddingBottomRight: [40, 96],
          animate: false,
        });
      }

      // ── Aplicar radio: anillo + etiqueta + visibilidad de POIs + encuadre ──
      function applyRadius(r) {
        ringRadius = r;
        ring.setRadius(r);
        ringLabelMk.setLatLng([P.lat + (r / 111320), P.lng]).setIcon(mkRingLabel(r));
        poiMarkers.forEach(o => {
          if (o.d <= r) { if (!map.hasLayer(o.m)) o.m.addTo(map); }
          else if (map.hasLayer(o.m)) map.removeLayer(o.m);
        });
        const sv = document.getElementById('radio-val');
        if (sv) sv.textContent = r + ' m';
        updateRoads(r);
        fitToRadius();
        idxSync();
      }

      const radioSlider = document.getElementById('radio-slider');
      if (radioSlider) {
        radioSlider.min = R_MIN; radioSlider.max = R_MAX;
        radioSlider.step = R_STEP; radioSlider.value = ringRadius;
        radioSlider.addEventListener('input', () => applyRadius(parseInt(radioSlider.value, 10)));
      }
      applyRadius(ringRadius);

      // ── Etiquetas de vías (avenidas curadas), alineadas al trazo real
      // El ángulo se calcula proyectando el punto de la vía y un punto en su
      // dirección; Web Mercator preserva ángulos, así que es invariante al zoom.
      function viaAngle(via) {
        if (!via.dir) return via.rot || 0;
        const p1 = map.latLngToLayerPoint([via.lat, via.lng]);
        const p2 = map.latLngToLayerPoint(via.dir);
        let a = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
        if (a > 90) a -= 180; else if (a < -90) a += 180;   // mantener el texto derecho
        return a;
      }
      const viaMarkers = (data.vias || []).map(via => {
        const icon = L.divIcon({
          className: '',
          html: `<span class="mk-via" style="display:inline-block;transform:rotate(${viaAngle(via)}deg)">${via.nombre}</span>`,
          iconSize: [140, 14], iconAnchor: [70, 7],
        });
        return { via, marker: L.marker([via.lat, via.lng], { icon, interactive: false, zIndexOffset: -200 }).addTo(map) };
      });

      // ── ÍNDICE DE POIs — etiquetas a la izquierda con líneas guía ──────
      // Lámina de atlas: cada punto visible se lista en una columna fija y
      // una línea fina lo liga a su ubicación exacta. Durante la película los
      // protagonistas se acumulan en orden de aparición; al final el índice
      // queda como leyenda permanente (respeta el radio del slider).
      // En móvil no hay columna: se conservan los globitos.
      let rutaDesdePunto = null;           // lo define el bloque de rutas; el índice lo usa al clic
      var idxListo = false;
      var idxModoFilm = false;             // durante la película solo se listan los revelados
      const usaIndice = window.matchMedia('(min-width: 768px)').matches;
      const idxItems = new Map();          // nombre → { el, line, o }

      const idxWrap = document.createElement('div');
      idxWrap.id = 'poi-indice';
      const idxSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      idxSvg.id = 'poi-lineas';
      if (usaIndice) {
        document.body.appendChild(idxWrap);
        document.body.appendChild(idxSvg);
      }

      function idxCrear(o) {               // crea (si falta) la etiqueta + línea de un POI
        if (idxItems.has(o.nombre)) return idxItems.get(o.nombre);
        const el = document.createElement('div');
        el.className = 'pindex-item';
        el.innerHTML = `${o.nombre}${o.dist ? `<span class="pindex-dist">${o.dist}</span>` : ''}`;
        idxWrap.appendChild(el);           // el orden del índice = orden de aparición
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        idxSvg.appendChild(line);
        const item = { el, line, o };
        idxItems.set(o.nombre, item);
        // hover / clic: resalta etiqueta + línea + punto en el mapa
        el.addEventListener('mouseenter', () => idxResaltar(item, true));
        el.addEventListener('mouseleave', () => idxResaltar(item, false));
        el.addEventListener('click', () => { if (rutaDesdePunto) rutaDesdePunto(o.nombre, o.m.getLatLng()); });
        return item;
      }
      function idxResaltar(item, on) {
        item.el.classList.toggle('hl', on);
        item.line.classList.toggle('hl', on);
        const mk = item.o.m.getElement();
        const poi = mk && mk.querySelector('.mk-poi');
        if (poi) poi.classList.toggle('hl', on);
      }
      function idxMostrar(item) {
        item.el.classList.remove('oculto');
        void item.el.offsetWidth;          // reflow: la transición corre sin depender de rAF
        item.el.classList.add('in');
        item.line.classList.add('in');
      }
      function idxEsconder(item) {
        item.el.classList.add('oculto');
        item.el.classList.remove('in');
        item.line.classList.remove('in');
      }
      function idxRedibujar() {            // recalcula las líneas etiqueta → punto
        if (!idxListo) return;
        idxItems.forEach(item => {
          if (item.el.classList.contains('oculto')) return;
          const r = item.el.getBoundingClientRect();
          const p = map.latLngToContainerPoint(item.o.m.getLatLng());
          item.line.setAttribute('x1', r.right + 8);
          item.line.setAttribute('y1', r.top + r.height / 2);
          item.line.setAttribute('x2', p.x);
          item.line.setAttribute('y2', p.y);
        });
      }
      function idxOrdenar() {              // columna en orden vertical de los puntos:
        if (!idxListo) return;             // las líneas se abren en abanico, sin cruces
        [...idxItems.values()]
          .sort((a, b) => map.latLngToContainerPoint(a.o.m.getLatLng()).y
                        - map.latLngToContainerPoint(b.o.m.getLatLng()).y)
          .forEach(item => idxWrap.appendChild(item.el));
        idxRedibujar();
      }
      function idxSync() {                 // leyenda permanente: los puntos visibles según el radio
        if (!idxListo || idxModoFilm) return;
        poiMarkers.forEach(o => {
          const item = idxCrear(o);
          if (map.hasLayer(o.m)) idxMostrar(item); else idxEsconder(item);
        });
        idxOrdenar();
      }

      if (usaIndice) {
        idxListo = true;
        let _idxRaf = null;
        const idxOnMove = () => {
          if (_idxRaf) return;
          _idxRaf = requestAnimationFrame(() => { _idxRaf = null; idxRedibujar(); });
        };
        map.on('move zoom viewreset resize', idxOnMove);
        map.on('moveend zoomend', idxOrdenar);   // reordenar al asentarse el mapa
        window.addEventListener('resize', idxOnMove);
        idxSync();                         // estado inicial (sin película: todo visible)
      }

      // ── Encuadre inicial: lo determina el radio (fitToRadius dentro de
      //    applyRadius, ya llamado arriba), para que el anillo llene la pantalla
      //    desde el arranque, sin zoom fijo.

      // ── Reaccionar al cambio de tema (papel/grafito)
      new MutationObserver(() => {
        const url = TILES[isGrafito() ? 'grafito' : 'papel'];
        const next = L.tileLayer(url, { attribution: ATTR, maxZoom: LOC.tiles.maxZoom, subdomains: 'abcd' });
        next.addTo(map);
        next.once('load', () => { if (tileLayer) map.removeLayer(tileLayer); tileLayer = next; });
      }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

      // ── Entrada
      requestAnimationFrame(() => {
        document.getElementById('map').classList.add('ready');
        setTimeout(() => { map.invalidateSize(); fitToRadius(); }, reduced ? 0 : 500);
      });

      // ── Mantener el anillo a pantalla completa al redimensionar / rotar
      let _rzT;
      window.addEventListener('resize', () => {
        clearTimeout(_rzT);
        _rzT = setTimeout(() => { map.invalidateSize(); fitToRadius(); }, 150);
      });

      // ── PRESENTACIÓN DE LOCATION — película automática desde la ficha ──
      // (pages.location.presentacion, editable en el panel). Secuencia:
      // vialidades por jerarquía (con etiquetas de avenidas) → anillo →
      // protagonistas uno a uno con su etiqueta. Cualquier gesto sobre el
      // mapa la retira; el ↻ del control la repite. Con "menos movimiento"
      // el mapa abre completo, sin película.
      const PREZ = LOC.presentacion;
      const hayPrez = !!(PREZ && PREZ.enabled !== false && (PREZ.puntos || []).length && !reduced);
      let filmActiva = false, filmTimer = null, filmTooltipM = null;

      const replayBtn = document.createElement('button');
      replayBtn.id = 'loc-replay';
      replayBtn.innerHTML = '&#8635;';
      replayBtn.title = 'Repetir presentación';
      replayBtn.setAttribute('aria-label', 'Repetir presentación');
      if (hayPrez) document.getElementById('radio-control')?.appendChild(replayBtn);
      replayBtn.addEventListener('click', () => { if (!filmActiva) filmCorrer(); });

      function filmSet(el, visible, instante) {
        if (!el) return;
        el.style.transition = instante ? 'none' : 'opacity 0.8s ease';
        el.style.opacity = visible ? '' : '0';
      }
      function filmOcultarTodo() {
        idxModoFilm = true;
        idxItems.forEach(idxEsconder);
        projSet(false, true);              // el proyecto aparece hasta el final
        poiMarkers.forEach(o => { if (map.hasLayer(o.m)) map.removeLayer(o.m); });
        viaMarkers.forEach(v => filmSet(v.marker.getElement(), false, true));
        filmSet(ring.getElement(), false, true);
        filmSet(ringLabelMk.getElement(), false, true);
        roadLines.forEach(pl => filmSet(pl.getElement(), false, true));
        document.getElementById('radio-control')?.classList.add('film-oculto');
      }
      function filmFinal() {
        filmActiva = false;
        clearTimeout(filmTimer);
        if (filmTooltipM) { filmTooltipM.closeTooltip(); filmTooltipM = null; }
        viaMarkers.forEach(v => filmSet(v.marker.getElement(), true));
        filmSet(ring.getElement(), true);
        filmSet(ringLabelMk.getElement(), true);
        roadLines.forEach(pl => filmSet(pl.getElement(), true));
        projSet(true);                     // el proyecto queda visible (también al interrumpir)
        idxModoFilm = false;
        applyRadius(ringRadius);           // repone POIs e índice según el radio
        document.getElementById('radio-control')?.classList.remove('film-oculto');
      }
      const filmEspera = ms => new Promise(res => { filmTimer = setTimeout(res, ms); });

      async function filmCorrer() {
        filmActiva = true;
        filmOcultarTodo();
        await filmEspera(1200);            // el mapa termina de entrar
        if (!filmActiva) return;

        // salir al primer gesto del visitante sobre el mapa
        const salir = () => { if (filmActiva) filmFinal(); };
        map.once('dragstart', salir);
        map.once('zoomstart', salir);
        map.once('click', salir);

        // 1) vialidades dibujándose por jerarquía; avenidas con la 1ª oleada
        const oleadas = [['trunk', 'primary'], ['secondary'], ['tertiary']];
        for (const clases of oleadas) {
          if (!filmActiva) return;
          roadLines.filter(pl => clases.includes(pl._clase))
            .forEach(pl => filmSet(pl.getElement(), true));
          if (clases.includes('primary'))
            viaMarkers.forEach(v => filmSet(v.marker.getElement(), true));
          await filmEspera(950);
        }
        if (!filmActiva) return;

        // 2) el anillo caminable define el escenario
        filmSet(ring.getElement(), true);
        filmSet(ringLabelMk.getElement(), true);
        await filmEspera(1100);

        // 3) protagonistas, uno a la vez — su etiqueta se ACUMULA en el
        //    índice de la izquierda (en móvil, globito que abre y cierra)
        const msPunto = PREZ.msPorPunto || 2000;
        for (const p of (PREZ.puntos || [])) {
          if (!filmActiva) return;
          const o = poiMarkers.find(x => x.nombre === p.nombre);
          if (!o) continue;
          o.m.addTo(map);
          const el = o.m.getElement();
          if (el) el.classList.add('film-pop');
          if (usaIndice) {
            idxMostrar(idxCrear(o));
            idxOrdenar();                  // cada etiqueta entra en su lugar vertical
            await filmEspera(msPunto);
          } else {
            o.m.openTooltip();
            filmTooltipM = o.m;
            await filmEspera(msPunto);
            o.m.closeTooltip();
            filmTooltipM = null;
          }
        }
        if (!filmActiva) return;

        // 4) cierre: aparece la ubicación del proyecto (lo último)
        await filmEspera(500);
        if (!filmActiva) return;
        projSet(true);
        await filmEspera(1000);
        if (filmActiva) filmFinal();
      }

      if (hayPrez) filmCorrer();

      // ── ¿CÓMO LLEGAR? — ruta de un punto al proyecto ────────────────────
      // Dirección escrita (geocoding Photon/OSM) o clic en el mapa; la ruta
      // la calcula el OSRM público de FOSSGIS (el mismo que usa osm.org) y
      // se dibuja con el estilo de la ficha. Complemento: abrir Google Maps
      // con el destino puesto (navegación real). Apagable por ficha:
      // pages.location.rutas.enabled = false.
      const hayRutas = !(LOC.rutas && LOC.rutas.enabled === false);
      if (hayRutas) {
        let rutaPerfil = 'auto';           // 'auto' | 'pie'
        let rutaLinea = null, rutaOrigen = null, rutaEsperandoClic = false;

        const rutaBtn = document.createElement('button');
        rutaBtn.id = 'ruta-abrir';
        rutaBtn.textContent = '¿Cómo llegar?';
        const rc = document.getElementById('radio-control');
        if (rc) rc.insertBefore(rutaBtn, document.getElementById('loc-replay'));

        const panel = document.createElement('div');
        panel.id = 'ruta-panel';
        panel.innerHTML = `
          <div class="ruta-fila">
            <input id="ruta-input" type="text" autocomplete="off"
                   placeholder="Escribe tu dirección de partida…"
                   aria-label="Punto de partida">
            <button class="ruta-perfil activo" data-perfil="auto" type="button">En auto</button>
            <button class="ruta-perfil" data-perfil="pie" type="button">A pie</button>
            <button id="ruta-cerrar" type="button" aria-label="Cerrar">&#215;</button>
          </div>
          <div id="ruta-msg"></div>`;
        document.body.appendChild(panel);

        const rutaInput = panel.querySelector('#ruta-input');
        const rutaMsg   = panel.querySelector('#ruta-msg');

        // Google Maps: siempre disponible y siempre a la UBICACIÓN del
        // proyecto (el pin) — la navegación la elige el visitante allá.
        const GMAPS_LINK = `<a href="https://www.google.com/maps/search/?api=1&query=${P.lat},${P.lng}"` +
          ` target="_blank" rel="noopener">Abrir en Google Maps</a>`;
        const MSG_BASE = `Escribe tu dirección, o haz clic en un lugar de la lista para ver su ruta. &nbsp;·&nbsp; ${GMAPS_LINK}`;
        rutaMsg.innerHTML = MSG_BASE;

        const mkOrigen = L.divIcon({
          className: '', html: '<div class="mk mk-origen"></div>',
          iconSize: [13, 13], iconAnchor: [6.5, 6.5],
        });

        function rutaLimpiar() {
          if (rutaLinea)  { map.removeLayer(rutaLinea);  rutaLinea = null; }
          if (rutaOrigen) { map.removeLayer(rutaOrigen); rutaOrigen = null; }
        }
        function rutaAbrir(conFoco) {
          panel.classList.add('abierto');
          rutaEsperandoClic = true;
          if (conFoco) {
            if (typeof filmFinal === 'function') filmFinal();
            rutaInput.focus();
          }
        }
        function rutaCerrar() {
          panel.classList.remove('abierto');
          rutaEsperandoClic = false;
          rutaLimpiar();
          rutaMsg.innerHTML = MSG_BASE;
          fitToRadius();
        }
        rutaBtn.addEventListener('click', () =>
          panel.classList.contains('abierto') ? rutaCerrar() : rutaAbrir(true));
        panel.querySelector('#ruta-cerrar').addEventListener('click', rutaCerrar);

        // Visible desde el arranque (convive con la película; sin robar el
        // foco — en móvil abriría el teclado). Quien quiera pantalla limpia
        // lo cierra con la ✕ y lo recupera con "¿Cómo llegar?".
        rutaAbrir(false);

        // Clic en una etiqueta del índice → ruta DEL PROYECTO a ese lugar
        rutaDesdePunto = (nombre, latlng) => {
          rutaAbrir(false);
          rutaInput.value = '';
          rutaTrazar(L.latLng(P.lat, P.lng), latlng, nombre, false);
        };

        panel.querySelectorAll('.ruta-perfil').forEach(b => b.addEventListener('click', () => {
          panel.querySelectorAll('.ruta-perfil').forEach(x => x.classList.remove('activo'));
          b.classList.add('activo');
          rutaPerfil = b.dataset.perfil;
          if (rutaOrigenLL) rutaTrazar(rutaOrigenLL, rutaDestLL, rutaDestNombre, rutaMarcarOrigen);   // recalcular con el nuevo perfil
        }));

        // Estado de la ruta actual (para recalcular al cambiar de perfil).
        // Por defecto: dirección escrita → llega AL proyecto (origen = dirección,
        // destino = proyecto). Clic en un lugar → sale DEL proyecto (origen =
        // proyecto, destino = el lugar).
        let rutaOrigenLL = null, rutaDestLL = null, rutaDestNombre = null, rutaMarcarOrigen = true;

        async function rutaTrazar(origenLL, destinoLL, destinoNombre, marcarOrigen) {
          rutaOrigenLL = origenLL;
          rutaDestLL = destinoLL || L.latLng(P.lat, P.lng);
          rutaDestNombre = destinoNombre || P.nombre;
          rutaMarcarOrigen = marcarOrigen !== false;
          rutaMsg.textContent = 'Calculando ruta…';
          try {
            const srv = rutaPerfil === 'pie' ? 'routed-foot' : 'routed-car';
            const prof = rutaPerfil === 'pie' ? 'foot' : 'driving';
            const url = `https://routing.openstreetmap.de/${srv}/route/v1/${prof}/` +
              `${rutaOrigenLL.lng},${rutaOrigenLL.lat};${rutaDestLL.lng},${rutaDestLL.lat}?overview=full&geometries=geojson`;
            const res = await fetch(url);
            const json = await res.json();
            if (!json.routes || !json.routes.length) throw new Error('sin ruta');
            const ruta = json.routes[0];

            rutaLimpiar();
            if (rutaMarcarOrigen)
              rutaOrigen = L.marker(rutaOrigenLL, { icon: mkOrigen, zIndexOffset: 900 }).addTo(map);
            rutaLinea = L.polyline(
              ruta.geometry.coordinates.map(c => [c[1], c[0]]),
              { className: 'ruta-linea', weight: 3.5, interactive: false }
            ).addTo(map);
            map.fitBounds(rutaLinea.getBounds(), { padding: [70, 70] });

            const km  = (ruta.distance / 1000).toFixed(ruta.distance < 10000 ? 1 : 0);
            const min = Math.max(1, Math.round(ruta.duration / 60));
            rutaMsg.innerHTML =
              `<span class="ruta-dato">${km} km · ${min} min</span> ` +
              `${rutaPerfil === 'pie' ? 'a pie' : 'en auto'} hasta ${rutaDestNombre} &nbsp;·&nbsp; ${GMAPS_LINK}`;
          } catch (e) {
            rutaMsg.innerHTML = `No se pudo calcular la ruta en este momento. &nbsp;·&nbsp; ${GMAPS_LINK}`;
          }
        }

        rutaInput.addEventListener('keydown', async e => {
          if (e.key !== 'Enter') return;
          const q = rutaInput.value.trim();
          if (!q) return;
          rutaMsg.textContent = 'Buscando dirección…';
          try {
            // sin lang: el índice multilenguaje encuentra más lugares locales
            const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}` +
              `&limit=1&lat=${P.lat}&lon=${P.lng}`;
            const res = await fetch(url);
            const json = await res.json();
            const f = json.features && json.features[0];
            if (!f) { rutaMsg.textContent = 'No encontré esa dirección — intenta con más detalle.'; return; }
            rutaTrazar(L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]));
          } catch (err) {
            rutaMsg.textContent = 'No se pudo buscar la dirección — inténtalo de nuevo.';
          }
        });
      }
    })();
  </script>
