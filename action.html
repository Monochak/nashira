<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-title" content="Nashira">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/svg+xml" href="content/brand/favicon.svg">
  <!-- Ficha del proyecto — SIEMPRE el primer script (los motores leen window.SITE) -->
  <script src="site.js?v=0ffc7494"></script>
  <script src="theme.js?v=a45adf14"></script>
  <!-- OG: reemplazar og:image con URL absoluta al definir el dominio de producción -->
  <meta property="og:title" content="Nashira · Action">
  <meta property="og:description" content="Nashira. Da el siguiente paso: habla con un asesor.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="content/images/sequence/frame_000.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* papel (default) */
      --bg:           oklch(94% 0.010  85);
      --text:         oklch(24% 0.006  85);
      --muted:        oklch(52% 0.008  85);
      --accent:       oklch(54.8% 0.157 35.7);
      --border:       oklch(85% 0.008  85);
      --glass-bg:     oklch(97% 0.006  85 / 0.78);
      --glass-border: oklch(78% 0.010  85 / 0.55);
      --font-display: 'Big Shoulders Display', 'Arial Black', system-ui, sans-serif;
      --font-body:    'Barlow', system-ui, -apple-system, sans-serif;
    }
    html[data-theme='grafito'] {
      --bg:           oklch(18% 0.008 250);
      --text:         oklch(93% 0.005 250);
      --muted:        oklch(52% 0.01  250);
      --border:       oklch(26% 0.01  250);
      --glass-bg:     oklch(22% 0.01  250 / 0.80);
      --glass-border: oklch(34% 0.012 250 / 0.55);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── PLACEHOLDER — mismo tratamiento de entrada que Ownership ── */
    .lo-content {
      position: fixed;
      left: 32px;
      bottom: 11vh;
      display: flex;
      flex-direction: column;
    }

    .lo-label {
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: oklch(44% 0.008 85);
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    html[data-theme='grafito'] .lo-label { color: oklch(62% 0.01 250); }

    .lo-heading {
      font-family: var(--font-display);
      font-size: clamp(4rem, 8vw, 8rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 0 3px 6px oklch(24% 0.006 85 / 0.18), 0 12px 32px oklch(24% 0.006 85 / 0.14);
    }
    html[data-theme='grafito'] .lo-heading {
      text-shadow: 0 3px 6px oklch(0% 0.008 250 / 0.5), 0 12px 32px oklch(0% 0.008 250 / 0.4);
    }

    .lo-quote {
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.65;
      color: oklch(46% 0.008 85);
      letter-spacing: 0.01em;
      max-width: 440px;
    }
    html[data-theme='grafito'] .lo-quote { color: oklch(52% 0.008 250); }

    .lo-label, .lo-heading, .lo-quote { opacity: 1; }

    @media (prefers-reduced-motion: no-preference) {
      .lo-label {
        opacity: 0;
        transform: translateY(8px);
        animation: lo-rise   0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
      }
      .lo-heading {
        opacity: 0;
        filter: blur(20px);
        animation: lo-emerge 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
      }
      .lo-quote {
        opacity: 0;
        animation: lo-fade   0.8s ease-out 1.55s forwards;
      }
    }
    @keyframes lo-rise   { to { opacity: 1; transform: translateY(0); } }
    @keyframes lo-emerge { to { opacity: 1; filter: blur(0px); } }
    @keyframes lo-fade   { to { opacity: 1; } }

    @media (max-width: 767px) {
      .lo-content { left: 14px; bottom: calc(72px + env(safe-area-inset-bottom) + 4vh); }
    }

  </style>
</head>
<body>

  <div class="lo-content">
    <span class="lo-label" data-site="pages.action.copy.eyebrow">Próximamente</span>
    <h1 class="lo-heading" data-site="pages.action.copy.heading">Action</h1>
    <p class="lo-quote" lang="en" data-site="pages.action.copy.quote">Good design is honest.</p>
  </div>

  <script src="transition.js?v=c0fe1e68"></script>
  <script src="rail.js?v=cc7b1eb2"></script>
  <script src="fullscreen.js?v=8f3fe4bb"></script>
  <script src="sparkles.js?v=07f3a614"></script>
  <script src="pwa.js?v=681b3376"></script>

</body>
</html>
